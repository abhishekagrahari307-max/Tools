# Render Blueprint: a PAID single web instance + persistent disk. Review charges
# in your own Render workspace before deploying. No changes to GitHub Pages.
services:
  - type: web
    name: celebration-studio
    runtime: python
    plan: starter
    numInstances: 1
    rootDir: celebration-studio
    buildCommand: python -m pip install -r requirements-production.txt
    startCommand: ./run-production.sh
    healthCheckPath: /healthz
    disk:
      name: studio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.18
      - key: STUDIO_ENV
        value: production
      - key: STUDIO_DATA_DIR
        value: /var/data/celebration-studio
      - key: STUDIO_DISK_MOUNT
        value: /var/data
