  panel.innerHTML=`<div class="track-panel-head"><span class="track-panel-title">Track details</span><span class="track-count">${st.tracks.length} track${st.tracks.length===1?'':'s'}</span></div>${inspector}<div class="track-list">${cards}</div>`;
}

/* ---- playback ---- */
async function stPlay(){
  if(st.playing){ stPause(); return; }
  const c=AC(); if(c.state==='suspended') await c.resume();
  stStopSources();
  if(!st.tracks.length) return toast('Add some audio first');
  const from=clamp(st.playhead,0,stTotal());
  const t0=c.currentTime+.08;
  st.master=c.createGain(); st.master.gain.value=.95; st.master.connect(c.destination);
  const nodes=[];
  for(const t of st.tracks){
    if(!trackAudible(t)) continue;
    for(const cl of t.clips){
      const buf=stBuf(cl.bufId); if(!buf) continue;
      const a=Math.max(from,cl.start), b=cl.start+cl.len;
      if(a>=b-.005) continue;
      const s=c.createBufferSource(); s.buffer=buf;
      const g=c.createGain(); s.connect(g); g.connect(st.master);
      const dur=cl.len, eff=cl.muted?0:cl.gain;
      const startDelay=a-from;   /* seconds from now until this (part-)clip is heard */
      const into=a-cl.start;     /* how far into the clip playback enters */
      g.gain.setValueAtTime(eff*envAt(into,dur,cl.fi,cl.fo,cl.fc),t0+startDelay);
      const kfs=[cl.fi?cl.fi/2:0,cl.fi,dur-(cl.fo?cl.fo/2:0),dur-cl.fo,dur]
        .filter(x=>x>into+.0001&&x<=dur).sort((x,y)=>x-y);
      const u=[]; kfs.forEach(x=>{ if(!u.length||x-u[u.length-1]>1e-6) u.push(x); });
      u.forEach(kt=>{
        g.gain.linearRampToValueAtTime(eff*envAt(kt,dur,cl.fi,cl.fo,cl.fc),t0+(cl.start+kt-from));
      });
      try{ s.start(t0+startDelay,cl.offset+into,Math.max(.01,b-a+.05)); }
      catch(e){ continue; }
      nodes.push(s);
    }
  }
  if(!nodes.length){ try{st.master.disconnect();}catch(e){} st.master=null; return toast('Nothing to play at this position'); }
  st.sources=nodes; st.playing=true; st.startAt=t0-from; st.playhead=from;
  const total=stTotal();
  const tick=()=>{
    if(!st.playing) return;
    st.playhead=c.currentTime-st.startAt;
    if(st.playhead>=total){ st.playhead=total; stPause(); stFrame(); stTimeUI(); return; }
    stFrame(); stTimeUI();
    if(!st.drag){
      const wrap=$('#studio-scroll');
      if(wrap){
        const px=stCX(st.playhead); /* content-space x */
        if(px>wrap.scrollLeft+wrap.clientWidth-80) wrap.scrollLeft=px-wrap.clientWidth+80;
        if(px<wrap.scrollLeft+MARGIN) wrap.scrollLeft=Math.max(0,px-MARGIN-10);
      }
    }
    st.raf=requestAnimationFrame(tick);
  };
  stTimeUI(); tick();
}
function stPause(){ st.playing=false; cancelAnimationFrame(st.raf); stStopSources(); stTimeUI(); }
function stStopSources(){
  st.sources.forEach(s=>{ try{s.stop();}catch(e){} try{s.disconnect();}catch(e){} });
  st.sources=[];
  if(st.master){ try{st.master.disconnect();}catch(e){} st.master=null; }
}
st.zoom=f=>{
  const wrap=$('#studio-scroll'); if(!wrap) return;
  const before=stT(wrap.clientWidth/2); /* time at viewport center */
  st.p=clamp(st.p*f,8,400);
  wrap.scrollLeft=MARGIN+before*st.p-wrap.clientWidth/2;
  stDirty();
};

/* ---- pointer interaction (incl. pinch zoom) ---- */
function stBindPointer(cv){
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  const hit=(x,y)=>{
    if(y<RULER) return x<MARGIN?{m:'mruler'}:{m:'ruler'};
    const inMargin=x<MARGIN;
    const ti=Math.floor((y-RULER)/LANE);
    const nearPh=Math.abs(x-stX(st.playhead))<=26;
    const t=st.tracks[ti]; if(!t) return nearPh?{m:'playhead',ti}:(inMargin?{m:'margin'}:{m:'off'});
    const yInLane=y-RULER-ti*LANE; /* clips are drawn from +26px with height LANE-34 */
    const coarse=coarsePointer()||window.innerWidth<=760;
    const yPad=coarse?7:2;
    if(yInLane<26-yPad||yInLane>26+(LANE-34)+yPad)
      return nearPh?{m:'playhead',ti}:(inMargin?{m:'margin'}:{m:'empty',ti});
    /* 1) HANDLES FIRST — a finger near a clip edge always grabs the handle,
       never the playhead (22px desktop / 26px touch, also just outside the edge) */
    const edgeBase=coarse?26:22;
    let edgeHit=null, edgeScore=Infinity;
    for(let i=0;i<t.clips.length;i++){
      const c=t.clips[i], x0=stX(c.start), x1=x0+c.len*st.p;
      const edge=Math.min(edgeBase,Math.max(6,(x1-x0)*.38));
      const bonus=(st.sel&&st.sel.t===ti&&st.sel.c===i)?2:0;
      const dl=Math.abs(x-x0), dr=Math.abs(x-x1);
      if(dl<=edge&&dl-bonus<edgeScore){ edgeScore=dl-bonus; edgeHit={m:'tl',ti,ci:i,c}; }
      if(dr<=edge&&dr-bonus<edgeScore){ edgeScore=dr-bonus; edgeHit={m:'tr',ti,ci:i,c}; }
    }
    if(edgeHit) return edgeHit;
    let bodyHit=null;
    for(let i=0;i<t.clips.length;i++){
      const c=t.clips[i], x0=stX(c.start), x1=x0+c.len*st.p;
      if(x>=x0&&x<=x1){ bodyHit={m:'body',ti,ci:i,c}; break; }
    }
    /* 2) PLAYHEAD SECOND — within 26px of the line, from empty lane space or
       near the ruler (top 60px strip); deeper on a clip body it must not
       steal the drag, so the clip can still slide from its middle */
    if(nearPh&&(!bodyHit||y<=RULER+60)) return {m:'playhead',ti};
    /* 3) BODY THIRD — slide the clip left/right */
    if(bodyHit) return bodyHit;
    return inMargin?{m:'margin'}:{m:'empty',ti};
  };
  const dist=()=>{ const pts=[...st.pointers.values()]; return Math.hypot(pts[0].cx-pts[1].cx,pts[0].cy-pts[1].cy); };
  cv.addEventListener('pointerdown',e=>{
    const {x,y}=pos(e);
    st.pointers.set(e.pointerId,{x,y,cx:e.clientX,cy:e.clientY});
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    if(st.pointers.size===2){
      const [A,B]=[...st.pointers.values()];
      const wEl=$('#studio-scroll');
      const L0=cv.getBoundingClientRect().left;
      const sl0=wEl?wEl.scrollLeft:0, st0=wEl?wEl.scrollTop:0;
      const mx0=(A.cx+B.cx)/2, my0=(A.cy+B.cy)/2;
      const t0=(mx0-L0+sl0-MARGIN)/st.p;
      st.drag={m:'pinch',d0:dist(),p0:st.p,L0,sl0,st0,mx0,my0,t0};
      return;
    }
    if(st.pointers.size>2) return;
    /* Hand tool and middle-mouse drag pan the timeline from any point, including over clips. */
    if(st.handMode||e.button===1){
      const wrap=$('#studio-scroll');
      if(wrap){ st.drag={m:'pan',x0:e.clientX,y0:e.clientY,sl0:wrap.scrollLeft,st0:wrap.scrollTop,moved:false}; cv.style.cursor='grabbing'; }
      return;
    }
    const h=hit(x,y);
    if(h.m==='ruler'){ st.playhead=clamp(stT(x),0,Math.max(stTotal(),0)); stFrame(); stTimeUI(); st.drag={m:'seek',grabDx:0}; return; }
    if(h.m==='playhead'){ st.drag={m:'seek',grabDx:x-stX(st.playhead)}; cv.style.cursor='grabbing'; return; }
    if(h.m==='tm'||h.m==='ts'||h.m==='tk'){
      const t=st.tracks[h.ti];
      if(h.m==='tm'){ t.muted=!t.muted; stSnapshot(); }
      else if(h.m==='ts'){ t.solo=!t.solo; stSnapshot(); }
      else { t.lock=!t.lock; stSnapshot(); }
      return;
    }
    if(h.m==='body'){
      stSelect(h.ti,h.ci);
      if(!h.c||st.tracks[h.ti].lock) return;
      st.drag={m:'move',c:h.c,ti:h.ti,x0:x,y0:y,start0:h.c.start,moved:false,active:false};
      return;
    }
    if(h.m==='tl'||h.m==='tr'){
      stSelect(h.ti,h.ci);
      if(st.tracks[h.ti].lock) return;
      st.drag={m:h.m,c:h.c,ti:h.ti,x0:x,y0:y,len0:h.c.len,start0:h.c.start,off0:h.c.offset,moved:false,active:false};
      return;
    }
    if(h.m==='empty'){
      stSelect(null);
      const wrap=$('#studio-scroll');
      if(wrap) st.drag={m:'pan',x0:e.clientX,y0:e.clientY,sl0:wrap.scrollLeft,st0:wrap.scrollTop,moved:false};
      return;
    }
  });
  cv.addEventListener('pointermove',e=>{
    const {x,y}=pos(e);
    if(st.pointers.has(e.pointerId)) st.pointers.set(e.pointerId,{x,y,cx:e.clientX,cy:e.clientY});
    if(st.pointers.size>=2){
      if(st.drag&&st.drag.m==='pinch'){
        const d=dist();
        const wrap=$('#studio-scroll'); if(!wrap) return;
        const [A,B]=[...st.pointers.values()];
        const mx=(A.cx+B.cx)/2, my=(A.cy+B.cy)/2;
        const wr=wrap.getBoundingClientRect(); /* live rect — canvas is sticky, so the old L0 drifts */
        st.p=clamp(st.drag.p0*d/Math.max(1,st.drag.d0),8,400);
        wrap.scrollLeft=MARGIN+st.drag.t0*st.p-(mx-wr.left);
        wrap.scrollTop=st.drag.st0-(my-st.drag.my0);
        stDirty(true);
      }
      return;
    }
    if(!st.drag){
      const h=hit(x,y);
      cv.style.cursor=st.handMode?'grab':((h.m==='tl'||h.m==='tr')?'ew-resize':((h.m==='body'||h.m==='empty'||h.m==='playhead')?'grab':(h.m==='ruler'?'pointer':(h.m==='tm'||h.m==='ts'||h.m==='tk'?'pointer':'default'))));
      /* hover highlight for clips (redraw only on change) */
      const nh=(h.c&&h.m!=='off')?{ti:h.ti,ci:h.ci}:null;
      const oh=st.hover;
      if((nh?nh.ti+':'+nh.ci:null)!==(oh?oh.ti+':'+oh.ci:null)){ st.hover=nh; if(st.tracks.length) stFrame(); }
      return;
    }
    const d=st.drag;
    if(d.m==='seek'){ st.playhead=clamp(stT(x-(d.grabDx||0)),0,Math.max(stTotal(),0)); cv.style.cursor='grabbing'; stFrame(); stTimeUI(); return; }
    if(d.m==='pan'){
      const wrap=$('#studio-scroll'); if(!wrap) return;
      wrap.scrollLeft=d.sl0-(e.clientX-d.x0); wrap.scrollTop=d.st0-(e.clientY-d.y0); d.moved=true; return;
    }
    const t=st.tracks[d.ti];
    /* 6px dead-zone: a light tap only selects; the clip starts moving/trimming
       only after a real 6px drag, and the dead-zone is subtracted so no jump */
    const rawDx=x-d.x0, rawDy=y-(d.y0==null?y:d.y0);
    if(!d.active){
      if(Math.hypot(rawDx,rawDy)<6) return;
      d.active=true; st.lofi=true;
    }
    const effDx=Math.sign(rawDx)*Math.max(0,Math.abs(rawDx)-6);
    if(d.m==='move'){
      let ns=Math.max(0,d.start0+effDx/st.p);
      if(st.snap){
        const snapped=Math.round(ns/.25)*.25;
        if(Math.abs(ns-snapped)<.15) ns=snapped;
        if(Math.abs(st.playhead-ns)<.15) ns=st.playhead;
      }
      d.c.start=ns; d.moved=d.moved||effDx!==0; stDirty(true); return;
    }
    const dt=effDx/st.p;
    if(d.m==='tl'){
      let nd=clamp(dt,-d.off0,d.len0-MIN_DUR);
      if(st.snap){
        let ns=d.start0+nd, s2=Math.round(ns/.25)*.25;
        if(Math.abs(ns-s2)<.15) nd=s2-d.start0;
        if(Math.abs(st.playhead-ns)<.15) nd=st.playhead-d.start0;
        nd=clamp(nd,-d.off0,d.len0-MIN_DUR);
      }
      d.c.start=d.start0+nd; d.c.offset=d.off0+nd; d.c.len=d.len0-nd; d.moved=d.moved||nd!==0;
    }else if(d.m==='tr'){
      const maxExt=(stBuf(d.c.bufId)?.duration||0)-d.off0-d.len0;
      let nd=clamp(dt,-(d.len0-MIN_DUR),maxExt);
      if(st.snap){
        let ne=d.start0+d.len0+nd, s2=Math.round(ne/.25)*.25;
        if(Math.abs(ne-s2)<.15) nd=s2-d.start0-d.len0;
        if(Math.abs(st.playhead-ne)<.15) nd=st.playhead-d.start0-d.len0;
        nd=clamp(nd,-(d.len0-MIN_DUR),maxExt);
      }
      d.c.len=d.len0+nd; d.moved=d.moved||nd!==0;
    }
    stDirty(true);
  });
  const up=e=>{
    st.pointers.delete(e.pointerId);
    if(st.drag){
      if(st.drag.m==='pinch'){ if(st.pointers.size<2) st.drag=null; return; }
      if(st.drag.moved&&st.drag.m!=='pan') stSnapshot();
      st.drag=null;
      cv.style.cursor=st.handMode?'grab':'default';
      if(st.lofi){ st.lofi=false; stDirty(); } /* restore full-quality waveforms */
    }
  };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',()=>{ if(st.hover){ st.hover=null; if(st.tracks.length) stFrame(); } });
}

/* ---- clip ops ---- */
const locked=()=>{ const s=stSel(); if(s&&s.t.lock){ toast('Track is locked'); return true; } return false; };
function stNeedSel(){ const s=stSel(); if(!s){ toast('Select a clip first — tap any clip on the timeline'); return null; } return s; }
function stCopyTrackName(name){
  let n=2, cand=name+' (2)';
  while(st.tracks.some(t=>t.name===cand)) cand=name+' ('+(++n)+')';
  return cand;
}
function stDuplicateClip(toNewTrack){
  const s=stNeedSel(); if(!s) return false; if(locked()) return false;
  const c=s.c;
  st.clipboard={clip:Object.assign({},c),trackName:s.t.name,color:s.t.color};
  const copy=Object.assign({},c,{id:st.nextId++});
  if(toNewTrack){
    const nt={id:st.nextId++,name:stCopyTrackName(s.t.name),color:s.t.color,clips:[copy],muted:s.t.muted,solo:s.t.solo,lock:false};
    st.tracks.splice(s.ti+1,0,nt);
    stSelect(s.ti+1,0);
    stSnapshot(); toast('Copy → new line par gaya (same time par)');
    return true;
  }
  const end=c.start+c.len;
  copy.start=end;
  /* if the copy would land on top of later clips, ripple them right to make room */
  const overlaps=s.t.clips.some(o=>o!==c&&o.start<copy.start+copy.len-.001&&o.start+o.len>copy.start+.001);
  if(overlaps) s.t.clips.forEach(o=>{ if(o!==c&&o.start>=end-.001) o.start+=c.len; });
  s.t.clips.splice(s.ci+1,0,copy);
  stSelect(s.ti,s.ci+1);
  stSnapshot(); toast('Clip copy ho gaya — copy selected hai');
  return true;
}
function stMoveClipToNewTrack(){
  const s=stNeedSel(); if(!s) return false; if(locked()) return false;
  if(s.t.clips.length===1){ toast('Ye clip pehle se apni line par akela hai'); return false; }
  const c=s.c;
  s.t.clips.splice(s.ci,1);
  const nt={id:st.nextId++,name:stCopyTrackName(s.t.name),color:s.t.color,clips:[c],muted:s.t.muted,solo:s.t.solo,lock:false};
  st.tracks.splice(s.ti+1,0,nt);
  stSelect(s.ti+1,0);
  stSnapshot(); toast('Clip nayi line (new track) par move ho gaya');
  return true;
}
function stJoinNext(){
  const s=stNeedSel(); if(!s) return false; if(locked()) return false;
  const c=s.c, end=c.start+c.len;
  let ni=-1, best=Infinity;
  s.t.clips.forEach((o,i)=>{ if(i!==s.ci&&o.start>=end-.01&&o.start<best){ best=o.start; ni=i; } });
  if(ni<0){ toast('Join ke liye aage koi clip nahi hai'); return false; }
  const n=s.t.clips[ni];
  if(Math.abs(n.start-end)>.01){ toast('Join tabhi hoga jab next clip bilkul chipka hua ho (gap nahi)'); return false; }
  if(n.bufId!==c.bufId||Math.abs(n.offset-(c.offset+c.len))>.01||Math.abs((n.speed||1)-(c.speed||1))>1e-6){
    toast('Join sirf ek hi audio ke chipke hue hisson par hota hai (jaise Split ke baad)'); return false;
  }
  if(Math.abs(n.gain-c.gain)>1e-6||!!n.muted!==!!c.muted||c.fo>0||n.fi>0){
    toast('Join se pehle dono clips ki volume/mute/fade settings same karo'); return false;
  }
  c.len+=n.len; c.fo=n.fo;
  s.t.clips.splice(ni,1);
  stSelect(s.ti,s.t.clips.indexOf(c));
  stSnapshot(); toast('Clips join ho gaye — ek clip ban gaya');
  return true;
}
function stNudgeClip(sec){
  const s=stSel(); if(!s||locked()) return false;
  s.c.start=Math.max(0,+(s.c.start+sec).toFixed(3));
  stSnapshot(); return true;
}
function stAlignClipToPlayhead(){
  const s=stSel(); if(!s||locked()) return false;
  s.c.start=Math.max(0,+st.playhead.toFixed(3));
  stSnapshot(); toast('Clip start = playhead ('+fmtTime(st.playhead)+')');
  return true;
}
function stGoToClip(which){
  const s=stSel(); if(!s) return;
  st.playhead=which==='end'?s.c.start+s.c.len:s.c.start;
  stDirty();
  const wrap=$('#studio-scroll');
  if(wrap){ const px=stCX(st.playhead); wrap.scrollLeft=clamp(px-60,0,Math.max(0,wrap.scrollWidth)); stFrame(); }
}
function stPasteClip(){
  const cb=st.clipboard;
  if(!cb){ toast('Pehle kisi clip ko Copy karo — phir Paste hoga'); return false; }
  const clip=Object.assign({},cb.clip,{id:st.nextId++,start:+st.playhead.toFixed(3)});
  const sel=stSel();
  if(sel){
    if(sel.t.lock){ toast('Selected track locked hai — Paste ke liye dusra track chuno ya unlock karo'); return false; }
    const t=sel.t;
    const overlaps=t.clips.some(o=>o.start<clip.start+clip.len-.001&&o.start+o.len>clip.start+.001);
    if(overlaps){
      /* no clean room on this track at the playhead — paste onto a fresh line below it */
      const nt={id:st.nextId++,name:stCopyTrackName(cb.trackName),color:cb.color,clips:[clip],muted:false,solo:false,lock:false};
      st.tracks.splice(sel.ti+1,0,nt);
      stSelect(sel.ti+1,0);
      stSnapshot(); toast('Paste → new line par gaya (selected track par jagah nahi thi)');
      return true;
    }
    t.clips.push(clip);
    stSelect(sel.ti,t.clips.indexOf(clip));
  }else{
    const nt={id:st.nextId++,name:st.tracks.length?stCopyTrackName(cb.trackName):cb.trackName,color:cb.color,clips:[clip],muted:false,solo:false,lock:false};
    st.tracks.push(nt);
    stSelect(st.tracks.length-1,0);
  }
  stSnapshot(); toast('Paste ho gaya — playhead par ('+fmtTime(clip.start)+')');
  return true;
}
function stSplitAll(){
  if(!st.tracks.length){ toast('Koi track nahi hai'); return false; }
  const pos=st.playhead;
  let count=0, selAfter=null;
  st.tracks.forEach((t,ti)=>{
    if(t.lock) return;
    for(let i=t.clips.length-1;i>=0;i--){
      const c=t.clips[i];
      if(pos<=c.start+.03||pos>=c.start+c.len-.03) continue;
      const l=pos-c.start;
      const right={id:st.nextId++,bufId:c.bufId,start:pos,offset:c.offset+l,len:c.len-l,gain:c.gain,fi:0,fo:c.fo,fc:c.fc,muted:c.muted,speed:c.speed};
      c.len=l; c.fo=0;
      t.clips.splice(i+1,0,right);
      count++;
      if(st.sel&&st.sel.t===ti&&st.sel.c===i) selAfter={t:ti,c:i+1};
    }
  });
  if(!count){ toast('Playhead kisi clip ke beech me nahi hai — Split All ke liye playhead clips ke upar rakho'); return false; }
  if(selAfter) stSelect(selAfter.t,selAfter.c);
  stSnapshot(); toast('Split All — '+count+' clip'+(count>1?'s':'')+' cut hue '+fmtTime(pos)+' par');
  return true;
}
function stRippleDelete(){
  const s=stNeedSel(); if(!s) return false; if(locked()) return false;
  const end=s.c.start+s.c.len, len=s.c.len;
  s.t.clips.splice(s.ci,1);
  s.t.clips.forEach(o=>{ if(o.start>=end-.001) o.start=Math.max(0,+(o.start-len).toFixed(3)); });
  if(!s.t.clips.length){ st.tracks.splice(s.ti,1); stSelect(null); }
  else stSelect(s.ti,Math.min(s.ci,s.t.clips.length-1));
  stSnapshot(); toast('Ripple delete — clip hata aur gap band ho gaya');
  return true;
}
function stDuplicateTrack(){
  const s=stNeedSel(); if(!s) return false;
  const nt={id:st.nextId++,name:stCopyTrackName(s.t.name),color:s.t.color,
    clips:s.t.clips.map(c=>Object.assign({},c,{id:st.nextId++})),
    muted:s.t.muted,solo:s.t.solo,lock:false};
  st.tracks.splice(s.ti+1,0,nt);
  stSelect(s.ti+1,Math.min(s.ci,nt.clips.length-1));
  stSnapshot(); toast('Poora track duplicate ho gaya');
  return true;
}
function stRenderClip(c){
  const buf=stBuf(c.bufId); if(!buf) return null;
  const out=sliceBuf(buf,c.offset,c.offset+c.len);
  const sr=out.sampleRate, g=c.muted?0:(c.gain==null?1:c.gain);
  for(let ch=0;ch<out.numberOfChannels;ch++){
    const d=out.getChannelData(ch);
    for(let i=0;i<d.length;i++) d[i]=clamp(d[i]*g*envAt(i/sr,out.duration,c.fi||0,c.fo||0,c.fc||'lin'),-1,1);
  }
  return out;
}
function stPlayClip(){
  const s=stNeedSel(); if(!s) return;
  if(s.c.muted) return toast('Ye clip muted hai — pehle Unmute karo');
  if(st.playing) stPause();
  const b=stRenderClip(s.c);
  if(b) playBuf(b);
}
function stNormalizeClip(){
  const s=stNeedSel(); if(!s) return false; if(locked()) return false;
  const c=s.c, buf=stBuf(c.bufId); if(!buf) return false;
  let peak=0;
  for(let ch=0;ch<buf.numberOfChannels;ch++){
    const data=buf.getChannelData(ch), pk=peaksFor(data), sr=buf.sampleRate;
    const i0=Math.floor(c.offset*sr), i1=Math.min(data.length,Math.ceil((c.offset+c.len)*sr));
    const b0=clamp(Math.floor(i0/pk.step),0,pk.count), b1=clamp(Math.ceil(i1/pk.step),0,pk.count);
    peak=Math.max(peak,peakRangeMax(pk,b0,Math.max(b0,b1)));
  }
  if(peak<=.0001){ toast('Ye clip silent hai — normalize nahi ho sakta'); return false; }
  c.gain=clamp(.89/peak,.05,4);
  if(c.muted) c.muted=false;
  stSnapshot(); toast('Normalized · volume ab '+Math.round(c.gain*100)+'% hai');
  return true;
}
function stSplitAt(toNewTrack){
  const s=stNeedSel(); if(!s) return false; if(locked()) return false;
  const pos=st.playhead, c=s.c;
  if(pos<=c.start+.03||pos>=c.start+c.len-.03){ toast('Playhead ko selected clip ke beech me rakho — phir Split dabao'); return false; }
  const l=pos-c.start;
  const right={id:st.nextId++,bufId:c.bufId,start:pos,offset:c.offset+l,len:c.len-l,gain:c.gain,fi:0,fo:c.fo,fc:c.fc,muted:c.muted,speed:c.speed};
  c.len=l; c.fo=0;
  if(toNewTrack){
    const nt={id:st.nextId++,name:stCopyTrackName(s.t.name),color:s.t.color,clips:[right],muted:s.t.muted,solo:s.t.solo,lock:false};
    st.tracks.splice(s.ti+1,0,nt);
    stSelect(s.ti+1,0);
  }else{
    s.t.clips.splice(s.ci+1,0,right);
    stSelect(s.ti,s.ci+1); /* right part auto-selects, ready to move/trim */
  }
  stSnapshot();
  toast(toNewTrack?('Split → new line · right part naye track par gaya ('+fmtTime(pos)+')'):('Split at '+fmtTime(pos)+' — right part selected hai'));
  return true;
}
function stTrimToPlayhead(which){
  const s=stSel(); if(!s||locked()) return false;
  const c=s.c, p=st.playhead;
  if(p<=c.start+.01||p>=c.start+c.len-.01){ toast('Playhead ko clip ke beech me rakho — phir trim option choose karo'); return false; }
  if(which==='start'){ const d=p-c.start; c.start=p; c.offset+=d; c.len-=d; }
  else c.len=p-c.start;
  stSnapshot();
  toast(which==='start'?'Left part hata diya — clip ab playhead se shuru hota hai':'Right part hata diya — clip ab playhead par khatam hota hai');
  return true;
}
function stDeleteClip(){ const s=stNeedSel(); if(!s) return; if(locked()) return; s.t.clips.splice(s.ci,1); if(!s.t.clips.length) st.tracks.splice(s.ti,1); stSelect(null); stSnapshot(); toast('Clip deleted'); }
function stDeleteTrack(){ const s=stNeedSel(); if(!s) return; if(locked()) return; st.tracks.splice(s.ti,1); stSelect(null); stSnapshot(); toast('Track deleted'); }
function stMuteClip(){ const s=stNeedSel(); if(!s) return; if(locked()) return; s.c.muted=!s.c.muted; stSnapshot(); toast(s.c.muted?'Muted':'Unmuted'); }
function stSetVolume(v){ const s=stSel(); if(!s) return; if(s.c.muted) s.c.muted=false; s.c.gain=v; }
function stSetFade(k,v){ const s=stSel(); if(!s) return; s.c[k]=v; }
function stSetCurve(fc){ const s=stSel(); if(!s) return; s.c.fc=fc; }

function resampleBuf(buf,ratio){
  const newLen=Math.max(1,Math.round(buf.length*ratio));
  const out=AC().createBuffer(buf.numberOfChannels,newLen,buf.sampleRate);
  for(let ch=0;ch<buf.numberOfChannels;ch++){
    const d=buf.getChannelData(ch), o=out.getChannelData(ch);
    const r=buf.length/newLen;
    for(let i=0;i<o.length;i++){
      const t=i*r, i0=Math.floor(t), i1=Math.min(d.length-1,i0+1), f=t-i0;
      o[i]=d[i0]*(1-f)+d[i1]*f;
    }
  }
  return out;
}
function stApplySpeed(speed){
  const s=stSel(); if(!s||locked()) return;
  const c=s.c, s1=c.speed||1;
  if(Math.abs(s1-speed)<1e-3) return;
  const buf=stBuf(c.bufId); if(!buf) return;
  const factor=s1/speed;
  const nb=resampleBuf(buf,factor);
  const bid=st.nextId++; st.buffers[bid]=nb;
  c.bufId=bid; c.offset*=factor; c.len*=factor; c.speed=speed;
  if(c.len<MIN_DUR) c.len=MIN_DUR;
  /* runs on every slider tick: no snapshot/toast here (the popover snapshots on 'change') */
  stFrame(); stTimeUI();
}
function stReverse(){
  const s=stNeedSel(); if(!s) return; if(locked()) return;
  const c=s.c, buf=stBuf(c.bufId); if(!buf) return;
  const out=AC().createBuffer(buf.numberOfChannels,buf.length,buf.sampleRate);
  for(let ch=0;ch<buf.numberOfChannels;ch++){
    const d=buf.getChannelData(ch), o=out.getChannelData(ch);
    for(let i=0;i<d.length;i++) o[i]=d[buf.length-1-i];
  }
  const bid=st.nextId++; st.buffers[bid]=out; c.bufId=bid;
  /* the whole buffer was reversed, so this clip's segment now lives at the mirrored offset */
  c.offset=Math.max(0,buf.duration-c.offset-c.len);
  stSnapshot(); toast('Reversed');
}
async function stDenoiseClip(){
  const s=stNeedSel(); if(!s) return; if(locked()) return;
  const c=s.c, buf=stBuf(c.bufId); if(!buf) return;
  toast('AI cleaning clip…',1600);
  await sleep(30);
  try{
    const seg=sliceBuf(buf,c.offset,c.offset+c.len);
    const clean=await denoiseBuffer(seg,1.6,null);
    const bid=st.nextId++; st.buffers[bid]=clean;
    c.bufId=bid; c.offset=0;
    stSnapshot(); toast('Clip cleaned');
  }catch(e){ console.warn(e); toast('Cleaning failed'); }
}

async function stAddFiles(files){
  let added=0;
  for(const f of files){
    try{
      const buf=await decodeFile(f);
      const bid=st.nextId++; st.buffers[bid]=buf;
      const track={id:st.nextId++,name:stripExt(f.name),color:PAL[st.tracks.length%PAL.length],clips:[],muted:false,solo:false,lock:false};
      track.clips.push({id:st.nextId++,bufId:bid,start:0,offset:0,len:buf.duration,gain:1,fi:0,fo:0,fc:'lin',muted:false,speed:1});
      st.tracks.push(track); added++;
    }catch(err){ toast("Couldn't decode "+f.name); }
  }
  if(added){ stSnapshot(); stDirty(); toast(added+' track'+(added>1?'s':'')+' added'); }
}

async function renderStudioMix(){
  const c=AC(), sr=c.sampleRate;
  const total=stTotal();
  const n=Math.ceil(total*sr)+Math.floor(sr*.3);
  const out=c.createBuffer(2,n,sr);
  const L=out.getChannelData(0), R=out.getChannelData(1);
  for(const t of st.tracks){
    if(!trackAudible(t)) continue;
    for(const cl of t.clips){
      const g0=cl.muted?0:cl.gain; if(g0<=0) continue;
      let nb=stBuf(cl.bufId); if(!nb) continue; if(nb.sampleRate!==sr) nb=resampleLinear(nb,sr);
      const d0=nb.getChannelData(0);
      const d1=nb.numberOfChannels>1?nb.getChannelData(1):d0;
      const i0=Math.floor(cl.offset*sr);
      const lenS=Math.min(Math.floor(cl.len*sr),nb.length-i0);
      const s0=Math.floor(cl.start*sr);
      const fi=cl.fi, fo=cl.fo, clen=cl.len, fc=cl.fc;
      for(let i=0;i<lenS;i++){
        const idx=s0+i; if(idx>=n) break;
        const e=envAt(i/sr,clen,fi,fo,fc)*g0;
        L[idx]+=d0[i0+i]*e;
        R[idx]+=d1[i0+i]*e;
      }
      await sleep(0);
    }
  }
  let peak=0;
  for(let i=0;i<n;i++){ const a=Math.abs(L[i]),b=Math.abs(R[i]); if(a>peak)peak=a; if(b>peak)peak=b; }
  if(peak>1.0001){ const s=1.3,ns=Math.tanh(s); for(let i=0;i<n;i++){ L[i]=Math.tanh(L[i]*s)/ns; R[i]=Math.tanh(R[i]*s)/ns; } }
  return out;
}

/* ---- popovers ---- */
function placePopover(pop,anchor){
  pop._anchor=anchor;
  const r=anchor.getBoundingClientRect();
  const vv=window.visualViewport;
  const vw=vv?vv.width:window.innerWidth, vh=vv?vv.height:window.innerHeight;
  const ox=vv?vv.offsetLeft:0, oy=vv?vv.offsetTop:0;
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  if(vw<=640){ /* phones: dead-center of the VISUAL viewport (keyboard-safe) */
    pop.style.left=(ox+clamp((vw-pw)/2,8,Math.max(8,vw-pw-8)))+'px';
    pop.style.top=(oy+clamp((vh-ph)/2,8,Math.max(8,vh-ph-8)))+'px';
    return;
  }
  pop.style.left=(ox+clamp(r.left-70,8,Math.max(8,vw-pw-10)))+'px';
  const below=r.bottom+10, above=r.top-ph-10;
  pop.style.top=(oy+clamp(below+ph<=vh-8?below:above,8,Math.max(8,vh-ph-8)))+'px';
}
function stPopover(anchor,title,o){
  closePopover();
  const r=anchor.getBoundingClientRect();
  const pop=document.createElement('div'); pop.className='pop'; pop.id='stPop';
  pop.innerHTML=`<div class="pop-h">${title} <span class="pop-v" id="popV"></span></div>
    <input type="range" class="slider" id="popR" min="${o.min}" max="${o.max}" step="${o.step}">
    ${o.extra||''}
    <div class="row mt" style="justify-content:flex-end"><button class="btn ghost small" id="popX">Done</button></div>`;
  document.body.appendChild(pop);
  placePopover(pop,anchor);
  const range=$('#popR',pop);
  range.value=o.get(); paintRange(range);
  const upd=()=>{ $('#popV',pop).textContent=o.fmt(+range.value); };
  /* heavy setters (e.g. Speed resamples the whole clip) can debounce so the
     slider stays buttery while processing runs once, on the final value */
  let popTimer=0, popPending=null;
  const flushPop=()=>{ if(popPending===null) return; const v=popPending; popPending=null; clearTimeout(popTimer); o.set(v); stToolbarUI(); };
  range.oninput=()=>{ upd();
    if(o.debounce){ popPending=+range.value; clearTimeout(popTimer); popTimer=setTimeout(flushPop,o.debounce); }
    else { o.set(+range.value); stToolbarUI(); }
  };
  range.onchange=()=>{ flushPop(); stSnapshot(); };
  pop._flush=flushPop;
  upd();
  if(o.ready) o.ready(pop);
  $('#popX',pop).onclick=()=>{ if(pop._flush) pop._flush(); closePopover(); };
  setTimeout(()=>{
    _popOutside=e=>{ if(!pop.contains(e.target)&&!anchor.contains(e.target)) closePopover(); };
    document.addEventListener('pointerdown',_popOutside);
  },0);
}
function stSimplePop(anchor,title,inner,cb){
  closePopover();
  const r=anchor.getBoundingClientRect();
  const pop=document.createElement('div'); pop.className='pop'; pop.id='stPop';
  pop.innerHTML=`<div class="pop-h">${title}</div>${inner}
    <div class="row mt" style="justify-content:flex-end"><button class="btn ghost small" id="popX">Done</button></div>`;
  document.body.appendChild(pop);
  placePopover(pop,anchor);
  cb&&cb(pop);
  $('#popX',pop).onclick=closePopover;
  setTimeout(()=>{
    _popOutside=e=>{ if(!pop.contains(e.target)&&!anchor.contains(e.target)) closePopover(); };
    document.addEventListener('pointerdown',_popOutside);
  },0);
}
let _popOutside=null;
function closePopover(){
  const p=$('#stPop'); if(p) p.remove();
  if(_popOutside){ document.removeEventListener('pointerdown',_popOutside); _popOutside=null; }
}

function stJumpPop(anchor){
  stSimplePop(anchor,'Jump to time',
   `<input class="inp" id="jumpInp" style="width:100%" placeholder="e.g. 0:42, 1:02:03 or 42.5" inputmode="decimal">`,
   pop=>{
     const inp=$('#jumpInp',pop);
     inp.focus();
     const go=()=>{
       const v=inp.value.trim();
       let t=NaN;
       const mh=v.match(/^(\d+):([0-5]?\d):([0-5]?\d)(?:\.(\d+))?$/);
       const m=v.match(/^(\d+):([0-5]?\d)(?:\.(\d+))?$/);
       if(mh) t=+mh[1]*3600+ +mh[2]*60+ +mh[3]+ (mh[4]?+('0.'+mh[4]):0);
       else if(m) t=+m[1]*60+ +m[2]+ (m[3]?+('0.'+m[3]):0);
       else if(/^\d+(\.\d+)?$/.test(v)) t=+v;
       if(!isFinite(t)||t<0){ toast('Invalid time'); return; }
       st.playhead=clamp(t,0,Math.max(stTotal(),t));
       stDirty(); closePopover();
     };
     inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
     inp.addEventListener('blur',()=>{ if(document.activeElement===inp) setTimeout(closePopover,150); });
   });
}

async function stSaveProject(nm){
  const id='proj:'+Date.now().toString(36);
  const payload={
    id, name:nm, savedAt:Date.now(),
    nTracks:st.tracks.length,
    nClips:st.tracks.reduce((n,t)=>n+t.clips.length,0),
    tracks:st.tracks.map(t=>({id:t.id,name:t.name,color:t.color,muted:t.muted,solo:t.solo,lock:t.lock,
      clips:t.clips.map(c=>({id:c.id,bufId:c.bufId,start:c.start,offset:c.offset,len:c.len,gain:c.gain,fi:c.fi,fo:c.fo,fc:c.fc,muted:c.muted,speed:c.speed}))})),
    buffers:{}
  };
  const used=new Set(); /* only buffers actually referenced by clips (orphans from edits bloat storage) */
  st.tracks.forEach(t=>t.clips.forEach(c=>used.add(String(c.bufId))));
  for(const bid of used){
    const ab=st.buffers[bid]; if(!ab) continue;
    payload.buffers[bid]={ch:ab.numberOfChannels,sr:ab.sampleRate,len:ab.length,data:[]};
    for(let c=0;c<ab.numberOfChannels;c++) payload.buffers[bid].data.push(ab.getChannelData(c).slice());
  }
  payload.nextId=st.nextId;
  await dbPut(id,payload);
  toast('Project saved in this browser');
}
async function stProjDraw(){
  const box=$('#prjList'); if(!box) return;
  let keys=[];
  try{ keys=await dbKeys('proj:'); }
  catch(e){ box.innerHTML='<div class="muted" style="font-size:13px">Browser storage is unavailable (private mode?), so projects cannot be listed.</div>'; return; }
  const items=[];
  for(const k of keys){ const p=await dbGet(k); if(p) items.push(p); }
  items.sort((a,b)=>b.savedAt-a.savedAt);
  box.innerHTML=items.length?items.map(p=>`
    <div class="file-row" style="border-color:var(--line)">
      <div class="file-ic">${IC.layers}</div>
      <div class="file-meta"><div class="fm-n">${esc(p.name)}</div>
      <div class="fm-s">${p.nTracks} track${p.nTracks>1?'s':''} · ${p.nClips} clip${p.nClips>1?'s':''} · ${new Date(p.savedAt).toLocaleString()}</div></div>
      <button class="btn small" data-pl="${p.id}">Load</button>
      <button class="btn ghost small" data-pd="${p.id}">${IC.trash}</button>
    </div>`).join('')
   :'<div class="muted" style="font-size:13px">No saved projects yet.</div>';
  $$('#prjList [data-pl]').forEach(b=>b.onclick=async()=>{
    let p=null;
    try{ p=await dbGet(b.dataset.pl); }catch(e){}
    if(!p) return toast('Project not found');
    if(st.playing) stPause();
    stStopSources();
    st.buffers={};
    for(const [bid,bb] of Object.entries(p.buffers)){
      const ab=AC().createBuffer(bb.ch,bb.len,bb.sr);
      for(let c=0;c<bb.ch;c++) ab.getChannelData(c).set(bb.data[c]);
      st.buffers[bid]=ab;
    }
    st.tracks=p.tracks.map(t=>Object.assign({},t,{clips:t.clips.map(c=>Object.assign({},c))}));
    /* new ids must never collide with loaded track/clip/buffer ids (was: adding audio could overwrite a loaded buffer) */
    let maxId=+p.nextId||0;
    Object.keys(st.buffers).forEach(k=>{ maxId=Math.max(maxId,+k||0); });
    st.tracks.forEach(t=>{ maxId=Math.max(maxId,t.id||0); t.clips.forEach(c=>{ maxId=Math.max(maxId,c.id||0,c.bufId||0); }); });
    st.nextId=maxId+1;
    st.sel=null; st.playhead=0;
    st.history=[]; st.histIdx=-1; stSnapshot();
    stDirty();
    closeModal();
    toast('Project loaded');
  });
  $$('#prjList [data-pd]').forEach(b=>b.onclick=async()=>{
    try{ await dbDel(b.dataset.pd); }catch(e){}
    stProjDraw(); toast('Project deleted');
  });
}

  $('#stSplitAll').onclick=()=>stSplitAll();
  $('#stPaste').onclick=()=>stPasteClip();
  $('#stRipple').onclick=()=>stRippleDelete();
  $('#stDupTrack').onclick=()=>stDuplicateTrack();

  $('#stFit').onclick=()=>{

  $('#stExportClip').onclick=e=>{
    const s=stNeedSel(); if(!s) return;
    stSimplePop(e.currentTarget,'Export selected clip',
     `<div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
        <button class="btn ghost small pop-action" id="ecW">WAV <span class="dim" style="font-weight:600">(lossless)</span></button>

       $('#ecW',pop).onclick=()=>go('wav');

     });

  $('#stProps').onclick=e=>{
    const s=stNeedSel(); if(!s) return;
    stSimplePop(e.currentTarget,'Clip / Track properties',
     `<label class="lbl">Track name</label>
      <input class="inp" id="prName" style="width:100%" value="${esc(s.t.name)}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <div><label class="lbl">Clip start (s)</label><input class="inp" id="prStart" style="width:100%" inputmode="decimal" value="${s.c.start.toFixed(2)}"></div>
        <div><label class="lbl">Length (s)</label><input class="inp" id="prLen" style="width:100%" inputmode="decimal" value="${s.c.len.toFixed(2)}"></div>
      </div>
      <div class="row mt" style="justify-content:flex-end"><button class="btn primary small" id="prApply">Apply</button></div>`,
     pop=>{
       $('#prApply',pop).onclick=()=>{
         const cur=stSel(); if(!cur||locked()){ closePopover(); return; }
         const nm=$('#prName',pop).value.trim();
         if(nm) cur.t.name=nm.slice(0,60);
         const ns=parseFloat($('#prStart',pop).value), nl=parseFloat($('#prLen',pop).value);
         if(isFinite(ns)) cur.c.start=Math.max(0,+ns.toFixed(3));
         if(isFinite(nl)){
           const buf=stBuf(cur.c.bufId);
           const maxL=buf?Math.max(MIN_DUR,buf.duration-cur.c.offset):nl;
           cur.c.len=clamp(+nl.toFixed(3),MIN_DUR,maxL);
           cur.c.fi=Math.min(cur.c.fi||0,cur.c.len); cur.c.fo=Math.min(cur.c.fo||0,cur.c.len);
         }
         stSnapshot(); closePopover(); toast('Properties update ho gayi');
       };
     });
  };
  $('#stNudge').onclick=e=>{
    if(!stNeedSel()) return;
    stSimplePop(e.currentTarget,'Nudge clip — fine position',
     `<p class="dim" style="font-size:12.5px;margin-bottom:10px">Clip ko left/right khiskayo, ya playhead ko clip par le jao. Popup khula rahega — baar-baar tap kar sakte ho.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn ghost small pop-action" id="ngM1" style="text-align:center">−1.0 s</button>
        <button class="btn ghost small pop-action" id="ngP1" style="text-align:center">+1.0 s</button>
        <button class="btn ghost small pop-action" id="ngM01" style="text-align:center">−0.1 s</button>
        <button class="btn ghost small pop-action" id="ngP01" style="text-align:center">+0.1 s</button>
      </div>
      <div class="row" style="flex-direction:column;align-items:stretch;gap:8px;margin-top:10px">
        <button class="btn ghost small pop-action" id="ngAlign">Clip start = playhead</button>
        <button class="btn ghost small pop-action" id="ngStart">Playhead → clip start</button>
        <button class="btn ghost small pop-action" id="ngEnd">Playhead → clip end</button>
      </div>`,
     pop=>{
       $('#ngM1',pop).onclick=()=>stNudgeClip(-1);
       $('#ngP1',pop).onclick=()=>stNudgeClip(1);
       $('#ngM01',pop).onclick=()=>stNudgeClip(-.1);
       $('#ngP01',pop).onclick=()=>stNudgeClip(.1);
       $('#ngAlign',pop).onclick=()=>stAlignClipToPlayhead();
       $('#ngStart',pop).onclick=()=>stGoToClip('start');
       $('#ngEnd',pop).onclick=()=>stGoToClip('end');
     });
  };
  $('#stDel').onclick=stDeleteClip;
  $('#stDelT').onclick=stDeleteTrack;
  $('#stMute').onclick=stMuteClip;
  $('#stVol').onclick=e=>{
    const s=stNeedSel(); if(!s) return;
    stPopover(e.currentTarget,'Clip volume',{min:0,max:200,step:5,
      get:()=>{ const g=s.c.muted?0:s.c.gain; return Math.round(Math.min(200,g*100)); },
      set:v=>stSetVolume(v/100), fmt:v=>Math.round(v)+'%'});
  };
  const fadePop=(which,label)=>e=>{
    const s=stNeedSel(); if(!s) return;
    stPopover(e.currentTarget,label,{min:0,max:5,step:.1,
      get:()=>s.c[which],
      set:v=>stSetFade(which,v), fmt:v=>v.toFixed(1)+' s',
      extra:`<div class="row" style="margin-top:10px">
        <span class="chip" data-fc="lin">Linear</span>
        <span class="chip" data-fc="exp">Smooth</span>
      </div>`,
      ready:pop=>{
        $$('.chip',pop).forEach(ch=>{
          ch.classList.toggle('on',ch.dataset.fc===s.c.fc);
          ch.onclick=()=>{
            stSetCurve(ch.dataset.fc);
            $$('.chip',pop).forEach(c2=>c2.classList.toggle('on',c2===ch));
            stSnapshot();
          };
        });
      }});
  };
  $('#stFi').onclick=fadePop('fi','Fade in');
  $('#stFo').onclick=fadePop('fo','Fade out');
  $('#stSpeed').onclick=e=>{
    const s=stNeedSel(); if(!s) return;
    stPopover(e.currentTarget,'Speed',{min:.5,max:2,step:.1,debounce:140,
      get:()=>s.c.speed||1, set:v=>stApplySpeed(v), fmt:v=>v.toFixed(1)+'×'});
  };
  $('#stClean').onclick=stDenoiseClip;
  $('#stRev').onclick=stReverse;
  const cv=$('#tl');
  stBindPointer(cv);
  if(!st.history.length) stSnapshot();
  stDirty();

<script>
'use strict';
/* ================= TRIM ================= */
function renderTrim(){
  const S={buf:null,name:'',a:0,b:0,mode:null,off:0,a0:0,b0:0};
  page.innerHTML=toolPage('Trim','Cut out the exact part you need. Drag the blue handles to set start and end, preview, then export.',
   `<div class="panel">${dropHtml('Tap to choose an audio file','or drag & drop here')}</div>
    <div class="panel mt" id="work" hidden>
      <div class="row between">
        <div class="file-row" style="flex:1;min-width:230px;border:0;padding:0;gap:10px"><div class="file-ic">${IC.music}</div><div class="file-meta"><div class="fm-n"><span id="fn"></span></div><div class="fm-s"><span id="fs"></span></div></div></div>
        <button class="btn ghost small" id="chg">Change file</button>
      </div>
      <div class="wave-wrap mt"><canvas id="wc"></canvas></div>
      <div class="row between mt">
        <span class="chip" id="ta">Start 00:00</span>
        <span class="chip" id="tlen">Length 00:00</span>
        <span class="chip" id="tb">End 00:00</span>
      </div>
      <div class="row mt">
        <button class="btn ghost" id="pp">${IC.play} Preview</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="exW">${IC.download} WAV</button>
        <button class="btn primary" id="exM">${IC.download} MP3</button>
      </div>
    </div>`);
  const work=$('#work'), cv=$('#wc');
  let drawRaf=0;
  const scheduleDraw=()=>{ if(drawRaf) return; drawRaf=requestAnimationFrame(()=>{ drawRaf=0; draw(); }); };
  /* fat-finger friendly handle grab zone: ~24px on touch (capped at 6% of width) */
  const handleTol=()=>{ const w=cv.getBoundingClientRect().width||1;
    return (coarsePointer()||window.innerWidth<=760)?clamp(24/w,.035,.06):clamp(16/w,.02,.04); };
  function draw(){
    if(!S.buf) return;
    const dur=S.buf.duration;
    drawPeaks(cv,S.buf.getChannelData(0),{sel0:S.a/dur,sel1:S.b/dur,mid:true});
    $('#ta').textContent='Start '+fmtTime(S.a);
    $('#tb').textContent='End '+fmtTime(S.b);
    $('#tlen').textContent='Length '+fmtTime(S.b-S.a);
  }
  async function load(f){
    try{
      const buf=await decodeFile(f);
      S.buf=buf; S.name=f.name; S.a=0; S.b=buf.duration;
      $('#fn').textContent=f.name;
      $('#fs').textContent=fmtTime(buf.duration)+' · '+(buf.numberOfChannels>1?'stereo':'mono')+' · '+(buf.sampleRate/1000)+' kHz';
      work.hidden=false;
      requestAnimationFrame(draw);
    }catch(e){ toast("Couldn't decode "+f.name); }
  }
  attachDrop($('#dz'),fs=>load(fs[0]));
  $('#chg').onclick=()=>{ const i=$('#dz input'); if(i) i.click(); };
  cv.addEventListener('pointerdown',e=>{
    if(!S.buf) return;
    const r=cv.getBoundingClientRect(), f=(e.clientX-r.left)/r.width;
    const fa=S.a/S.buf.duration, fb=S.b/S.buf.duration;
    const tol=handleTol(), da=Math.abs(f-fa), db=Math.abs(f-fb);
    if(da<tol||db<tol) S.mode=da<=db?'a':'b'; /* nearest handle wins */
    else if(f>fa&&f<fb) S.mode='move';
    else return;
    S.off=f; S.a0=S.a; S.b0=S.b;
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{
    if(!S.buf) return;
    const r=cv.getBoundingClientRect(), f=clamp((e.clientX-r.left)/r.width,0,1);
    if(!S.mode){
      const fa=S.a/S.buf.duration, fb=S.b/S.buf.duration, tol=handleTol();
      cv.style.cursor=(Math.abs(f-fa)<tol||Math.abs(f-fb)<tol)?'ew-resize':(f>fa&&f<fb?'grab':'crosshair');
      return;
    }
    const t=f*S.buf.duration, min=.1;
    if(S.mode==='a') S.a=clamp(t,0,S.b-min);
    else if(S.mode==='b') S.b=clamp(t,S.a+min,S.buf.duration);
    else{
      const d=(f-S.off)*S.buf.duration;
      let na=S.a0+d, nb=S.b0+d;
      if(na<0){ nb-=na; na=0; }
      if(nb>S.buf.duration){ na-=(nb-S.buf.duration); nb=S.buf.duration; }
      S.a=Math.max(0,na); S.b=Math.min(S.buf.duration,nb);
    }
    scheduleDraw();
  });
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{ const was=S.mode; S.mode=null; if(was) scheduleDraw(); }));
  $('#pp').onclick=()=>{ if(S.buf) playBuf(sliceBuf(S.buf,S.a,S.b),$('#pp')); };
  $('#exW').onclick=()=>{ if(S.buf) exportBuffer(sliceBuf(S.buf,S.a,S.b),safeName(S.name)+'-trim','wav'); };
  $('#exM').onclick=()=>{ if(S.buf) exportBuffer(sliceBuf(S.buf,S.a,S.b),safeName(S.name)+'-trim','mp3'); };
  window.__pageRedraw=()=>requestAnimationFrame(draw);
}

/* ================= MERGE ================= */
function renderMerge(){
  const S={items:[]};
  page.innerHTML=toolPage('Merge','Join audio files one after another into a single track. Reorder the list before exporting.',
   `<div class="panel">${dropHtml('Tap to add audio files','multiple files supported · drag & drop welcome')}</div>
    <div class="panel mt" id="listP" hidden>
      <div id="list"></div>
      <div class="row between mt">
        <span class="chip" id="tot">0 files</span>
        <div class="row">
          <button class="btn ghost small" id="clear">Clear all</button>
          <button class="btn ghost" id="exW">${IC.download} WAV</button>
          <button class="btn primary" id="exM">${IC.download} MP3</button>
        </div>
      </div>
    </div>`);
  function renderList(){
    const l=$('#list');
    l.innerHTML=S.items.map((it,i)=>`
      <div class="file-row">
        ${fileRowHtml('file',it.name,fmtTime(it.buf.duration)+' · '+(it.buf.numberOfChannels>1?'stereo':'mono'))}
        <button class="icon-sq" data-mv="${i}" data-d="-1" ${i===0?'disabled':''} aria-label="Move up">${IC.up}</button>
        <button class="icon-sq" data-mv="${i}" data-d="1" ${i===S.items.length-1?'disabled':''} aria-label="Move down">${IC.down}</button>
        <button class="icon-sq danger" data-rm="${i}" aria-label="Remove">${IC.trash}</button>
      </div>`).join('');
    const dur=S.items.reduce((a,b)=>a+b.buf.duration,0);
    $('#tot').textContent=S.items.length+' file'+(S.items.length===1?'':'s')+' · '+fmtTime(dur);
    $('#listP').hidden=!S.items.length;
    $$('[data-mv]',l).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.mv, j=i+(+b.dataset.d);
      const it=S.items.splice(i,1)[0]; S.items.splice(j,0,it); renderList();
    });
    $$('[data-rm]',l).forEach(b=>b.onclick=()=>{ S.items.splice(+b.dataset.rm,1); renderList(); });
  }
  async function load(files){
    for(const f of files){
      try{ const buf=await decodeFile(f); S.items.push({name:f.name,buf}); }
      catch(e){ toast("Couldn't decode "+f.name); }
    }
    renderList();
  }
  attachDrop($('#dz'),fs=>load(fs));
  $('#clear').onclick=()=>{ S.items=[]; renderList(); };
  function concat(){
    if(!S.items.length) return null;
    const c=AC();
    const bufs=S.items.map(it=>it.buf.sampleRate===c.sampleRate?it.buf:resampleLinear(it.buf,c.sampleRate));
    let total=0; bufs.forEach(b=>total+=b.length);
    const nc=Math.max(...bufs.map(b=>b.numberOfChannels));
    const out=c.createBuffer(nc,total,c.sampleRate);
    let pos=0;
    bufs.forEach(b=>{
      for(let ch=0;ch<nc;ch++){
        /* mono sources feed every output channel (was: left channel only) */
        out.getChannelData(ch).set(b.getChannelData(Math.min(ch,b.numberOfChannels-1)),pos);
      }
      pos+=b.length;
    });
    return out;
  }
  $('#exW').onclick=()=>{ const b=concat(); if(b) exportBuffer(b,'merged-audio','wav'); else toast('Add files first'); };
  $('#exM').onclick=()=>{ const b=concat(); if(b) exportBuffer(b,'merged-audio','mp3'); else toast('Add files first'); };
  renderList();
}

/* ================= MIX ================= */
function renderMix(){
  const S={A:null,B:null};
  function slotHtml(key,ph){
    return `<div class="panel mt" id="slot${key}" hidden>
      <div class="file-row">
        <div class="file-ic">${IC.music}</div><div class="file-meta"><div class="fm-n"><span id="n${key}"></span></div><div class="fm-s"><span id="s${key}"></span></div></div>
        <button class="icon-sq danger" id="rm${key}" aria-label="Remove">${IC.trash}</button>
      </div>
      <div class="wave-wrap sm mt"><canvas id="wv${key}"></canvas></div>
      <div class="row mt" style="gap:16px">
        <div style="flex:1"><label class="lbl">Level <span id="lv${key}" style="color:var(--cyan)">100%</span></label>
          <input type="range" class="slider" id="gs${key}" min="0" max="200" value="100"></div>
      </div>
    </div>
    <div class="panel mt" id="drop${key}">${dropHtml(ph,'track '+key+' — e.g. music or voice','dz'+key)}</div>`;
  }
  page.innerHTML=toolPage('Mix','Blend two audio tracks together. Set each level, preview the result, export the mix.',
   slotHtml('A','Track A — e.g. music')+slotHtml('B','Track B — e.g. voice')+
   `<div class="panel mt" id="mixP" hidden>
      <div class="row between"><label class="lbl" style="margin:0">Mixed result</label><span class="chip" id="mdur"></span></div>
      <div class="wave-wrap sm mt"><canvas id="wmix"></canvas></div>
      <div class="row mt">
        <button class="btn ghost" id="pp">${IC.play} Preview</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="exW">${IC.download} WAV</button>
        <button class="btn primary" id="exM">${IC.download} MP3</button>
      </div>
    </div>`);
  ['A','B'].forEach(k=>{
    attachDrop($('#drop'+k),async fs=>{
      const f=fs[0];
      try{
        const buf=await decodeFile(f);
        S[k]={name:f.name,buf,gain:1};
        const gsl=$('#gs'+k); if(gsl){ gsl.value=100; paintRange(gsl); }
        const glv=$('#lv'+k); if(glv) glv.textContent='100%';
        $('#drop'+k).style.display='none';
        $('#slot'+k).hidden=false;
        $('#n'+k).textContent=f.name;
        $('#s'+k).textContent=fmtTime(buf.duration)+' · '+(buf.numberOfChannels>1?'stereo':'mono');
        drawSlot(k); mixDraw();
      }catch(e){ toast("Couldn't decode "+f.name); }
    });
    $('#rm'+k).onclick=()=>{ S[k]=null; $('#slot'+k).hidden=true; $('#drop'+k).style.display=''; mixDraw(); };
    $('#gs'+k).oninput=e=>{ if(!S[k]) return; S[k].gain=+e.target.value/100; $('#lv'+k).textContent=e.target.value+'%'; mixDraw(); };
  });
  function drawSlot(k){
    const it=S[k]; if(!it) return;
    drawPeaks($('#wv'+k),it.buf.getChannelData(0),{color:k==='A'?'#e879f9':'#22d3ee'});
  }
  function mixData(){
    if(!(S.A&&S.B)) return null;
    const c=AC();
    /* both tracks are resampled to the output context rate first — mixing a
       44.1 kHz track straight into a 48 kHz buffer played it 8.8% sharp */
    const A=resampleLinear(S.A.buf,c.sampleRate), B=resampleLinear(S.B.buf,c.sampleRate);
    const total=Math.max(A.length,B.length);
    const L=new Float32Array(total), R=new Float32Array(total);
    const add=(buf,gain)=>{
      const d0=buf.getChannelData(0), d1=buf.numberOfChannels>1?buf.getChannelData(1):d0;
      for(let i=0;i<d0.length;i++){ L[i]+=d0[i]*gain; R[i]+=d1[i]*gain; }
    };
    add(A,S.A.gain); add(B,S.B.gain);
    /* two tracks at up to 200% each easily exceed full scale: pull the whole
       mix down proportionally instead of hard-clipping on export */
    let peak=0;
    for(let i=0;i<total;i++){ const a=Math.abs(L[i]),b=Math.abs(R[i]); if(a>peak)peak=a; if(b>peak)peak=b; }
    if(peak>1){ const s2=1/peak; for(let i=0;i<total;i++){ L[i]*=s2; R[i]*=s2; } }
    return {L,R,total};
  }
  /* Fast preview: build a ~2x-canvas-width min/max strip from the CACHED peaks
     instead of mixing millions of samples on every slider tick (the old jank).
     Play/export still use the exact full-sample mixData() above. */
  function mixPreviewData(){
    if(!(S.A&&S.B)) return null;
    const total=Math.max(S.A.buf.length,S.B.buf.length);
    const cw=($('#wmix')&&$('#wmix').clientWidth)||600;
    const cols=Math.round(clamp(cw*2,512,4096));
    const out=new Float32Array(cols*2);
    const src=[S.A,S.B].map(it=>({pk:peaksFor(it.buf.getChannelData(0)),gain:it.gain,len:it.buf.length}));
    let peak=0;
    for(let col=0;col<cols;col++){
      const i0=Math.floor(col*total/cols), i1=Math.max(i0+1,Math.floor((col+1)*total/cols));
      let mn=0,mx=0;
      for(const sc of src){
        if(i0>=sc.len) continue;
        const b0=clamp(Math.floor(i0/sc.pk.step),0,sc.pk.count-1);
        const b1=clamp(Math.max(b0+1,Math.ceil(Math.min(i1,sc.len)/sc.pk.step)),b0+1,sc.pk.count);
        let lo=1,hi=-1;
        for(let b=b0;b<b1;b++){ const l2=sc.pk.mn[b]; if(l2<lo)lo=l2; const h2=sc.pk.mx[b]; if(h2>hi)hi=h2; }
        if(hi>=-1&&lo<=1){ mn+=lo*sc.gain; mx+=hi*sc.gain; }
      }
      out[col*2]=mn; out[col*2+1]=mx;
      const am=Math.max(mn<0?-mn:mn,mx<0?-mx:mx); if(am>peak)peak=am;
    }
    if(peak>1){ const k=1/peak; for(let i=0;i<out.length;i++) out[i]*=k; }
    return {data:out,total};
  }
  let mixRaf=0;
  function mixDrawNow(){
    const m=mixPreviewData();
    $('#mixP').hidden=!m;
    if(!m) return;
    $('#mdur').textContent=fmtTime(m.total/AC().sampleRate);
    drawPeaks($('#wmix'),m.data,{color:'#818cf8'});
  }
  function mixDraw(){ if(mixRaf) return; mixRaf=requestAnimationFrame(()=>{ mixRaf=0; mixDrawNow(); }); }
  function mixBuf(){
    const m=mixData(); if(!m) return null;
    const out=AC().createBuffer(2,m.total,AC().sampleRate);
    out.getChannelData(0).set(m.L); out.getChannelData(1).set(m.R);
    return out;
  }
  $('#pp').onclick=()=>{ const b=mixBuf(); if(b) playBuf(b,$('#pp')); };
  $('#exW').onclick=()=>{ const b=mixBuf(); if(b) exportBuffer(b,'mixed-audio','wav'); };
  $('#exM').onclick=()=>{ const b=mixBuf(); if(b) exportBuffer(b,'mixed-audio','mp3'); };
  window.__pageRedraw=()=>{ if(S.A)drawSlot('A'); if(S.B)drawSlot('B'); mixDraw(); };
}

function renderSplit(){
  const S={buf:null,name:'',pts:[]};
  page.innerHTML=toolPage('Split','Slice one file into segments. Tap the waveform to add a cut point (tap a marker to remove it), then download the pieces.',
   `<div class="panel">${dropHtml('Tap to choose an audio file','or drag & drop here')}</div>
    <div class="panel mt" id="work" hidden>
      <div class="row between">
        <div class="file-row" style="flex:1;min-width:230px;border:0;padding:0;gap:10px"><div class="file-ic">${IC.music}</div><div class="file-meta"><div class="fm-n"><span id="fn"></span></div><div class="fm-s"><span id="fs"></span></div></div></div>
        <button class="btn ghost small" id="chg">Change file</button>
      </div>
      <div class="wave-wrap mt"><canvas id="wc"></canvas></div>
      <p class="dim mt" style="font-size:12.5px">Tap the waveform to add cut points · tap an existing marker to remove it.</p>
      <div id="segs" class="mt"></div>
      <div class="row mt" style="justify-content:flex-end">
        <button class="btn primary" id="exAll">${IC.download} Download all (.zip)</button>
      </div>
    </div>`);
  const cv=$('#wc');
  function segs(){
    const dur=S.buf.duration, pts=S.pts.slice().sort((a,b)=>a-b);
    const out=[], bounds=[0,...pts,dur];
    for(let i=0;i<bounds.length-1;i++){ const a=bounds[i], b=bounds[i+1]; if(b-a>0.05) out.push({a,b}); }
    return out;
  }
  function renderSegs(){
    const ss=segs();
    $('#segs').innerHTML=ss.map((s,i)=>`
      <div class="file-row">
        ${fileRowHtml('file','Segment '+(i+1),fmtTime(s.a)+' → '+fmtTime(s.b)+' · '+fmtTime(s.b-s.a))}
        <button class="btn ghost small" data-sw="${i}">WAV</button>
        <button class="btn primary small" data-sm="${i}">MP3</button>
      </div>`).join('');
    $$('[data-sw]').forEach(b=>b.onclick=()=>{ const s=segs()[+b.dataset.sw]; exportBuffer(sliceBuf(S.buf,s.a,s.b),'segment-'+(+b.dataset.sw+1),'wav'); });
    $$('[data-sm]').forEach(b=>b.onclick=()=>{ const s=segs()[+b.dataset.sm]; exportBuffer(sliceBuf(S.buf,s.a,s.b),'segment-'+(+b.dataset.sm+1),'mp3'); });
  }
  function draw(){
    if(!S.buf) return;
    const r=cv.getBoundingClientRect();
    drawPeaks(cv,S.buf.getChannelData(0),{mid:true});
    const g=cv.getContext('2d'), dpr=canvasDPR(), h=cv.clientHeight;
    g.setTransform(dpr,0,0,dpr,0,0);
    S.pts.forEach((p,i)=>{
      const x=p/S.buf.duration*r.width;
      g.strokeStyle='#f472b6'; g.lineWidth=2;
      g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke();
      g.fillStyle='#f472b6'; rr(g,x-11,6,22,18,5); g.fill();
      g.fillStyle='#3b0a1e'; g.font='800 11px system-ui, sans-serif'; g.textBaseline='middle'; g.textAlign='center';
      g.fillText(String(i+1),x,15.5);
    });
    renderSegs();
  }
  cv.addEventListener('click',e=>{
    if(!S.buf) return;
    const r=cv.getBoundingClientRect();
    const f=clamp((e.clientX-r.left)/r.width,0,1), t=f*S.buf.duration;
    let best=-1, bd=9;
    S.pts.forEach((p,i)=>{ const d=Math.abs(p/S.buf.duration*r.width-(e.clientX-r.left)); if(d<bd){ bd=d; best=i; } });
    if(best>=0) S.pts.splice(best,1);
    else S.pts.push(t);
    draw();
  });
  async function load(f){
    try{
      const buf=await decodeFile(f);
      S.buf=buf; S.name=f.name; S.pts=[];
      $('#fn').textContent=f.name;
      $('#fs').textContent=fmtTime(buf.duration);
      $('#work').hidden=false;
      requestAnimationFrame(draw);
    }catch(e){ toast("Couldn't decode "+f.name); }
  }
  attachDrop($('#dz'),fs=>load(fs[0]));
  $('#chg').onclick=()=>{ const i=$('#dz input'); if(i) i.click(); };
  $('#exAll').onclick=async()=>{
    if(!S.buf) return;
    const ss=segs(); if(!ss.length) return toast('Nothing to download');
    const btn=$('#exAll'); btn.disabled=true;
    try{
      /* one ZIP instead of N downloads (browsers block repeated automatic downloads) */
      const files=[];
      for(let i=0;i<ss.length;i++){
        const blob=wavBlob(sliceBuf(S.buf,ss[i].a,ss[i].b));
        const nm='segment-'+(i+1)+'.wav';
        files.push({name:nm,data:new Uint8Array(await blob.arrayBuffer())});
        recordOutput(nm,blob);
      }
      downloadOnly(zipBlob(files),safeName(S.name)+'-segments.zip');
    }catch(e){ console.warn(e); toast('Zip failed'); }
    btn.disabled=false;
  };
  window.__pageRedraw=draw;
}

/* ================= INSERT (splice) ================= */
function renderInsert(){
  const S={base:null,ins:null,pos:0,xf:true};
  const dz=(id,main,sub)=>`<div class="drop" id="${id}">${IC.upload}<div class="d-main">${main}</div><div class="d-sub">${sub}</div></div>`;
  page.innerHTML=toolPage('Insert','Splice one audio file into another at any position — with an optional crossfade at the join.',
   `<div class="panel">${dz('dzb','Base audio — the file you\'ll cut open','mp3, wav, m4a, ogg…')}</div>
    <div class="panel mt">${dz('dzi','Insert audio — the file to splice in','mp3, wav, m4a, ogg…')}</div>
    <div class="panel mt" id="work" hidden>
      <div class="file-row"><div class="file-ic">${IC.file}</div><div class="file-meta"><div class="fm-n"><span id="bn"></span></div><div class="fm-s"><span id="bs"></span></div></div></div>
      <div class="file-row mt"><div class="file-ic">${IC.file}</div><div class="file-meta"><div class="fm-n"><span id="inn"></span></div><div class="fm-s"><span id="ins2"></span></div></div></div>
      <div class="row mt" style="gap:16px">
        <div style="flex:1;min-width:200px"><label class="lbl">Insert position <span id="pv" style="color:var(--cyan)">00:00</span></label>
          <input type="range" class="slider" id="pos" min="0" max="1000" value="0"></div>
        <span class="chip on" id="xfChip">${IC.check} 0.2s crossfade</span>
      </div>
      <div class="row mt">
        <button class="btn ghost" id="pp">${IC.play} Preview</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="exW">${IC.download} WAV</button>
        <button class="btn primary" id="exM">${IC.download} MP3</button>
      </div>
    </div>`);
  async function loadOne(which,f){
    try{
      const buf=await decodeFile(f);
      if(which==='base'){ S.base={name:f.name,buf}; S.pos=0; } else S.ins={name:f.name,buf};
      refresh();
    }catch(e){ toast("Couldn't decode "+f.name); }
  }
  attachDrop($('#dzb'),fs=>loadOne('base',fs[0]));
  attachDrop($('#dzi'),fs=>loadOne('ins',fs[0]));
  function refresh(){
    const work=$('#work');
    work.hidden=!(S.base&&S.ins);
    if(!S.base||!S.ins) return;
    $('#bn').textContent='Base: '+S.base.name;
    $('#bs').textContent=fmtTime(S.base.buf.duration)+' · '+(S.base.buf.numberOfChannels>1?'stereo':'mono');
    $('#inn').textContent='Insert: '+S.ins.name;
    $('#ins2').textContent=fmtTime(S.ins.buf.duration);
    const pos=$('#pos');
    pos.max=Math.floor(S.base.buf.duration*1000);
    pos.value=Math.floor(S.pos*1000); paintRange(pos);
    $('#pv').textContent=fmtTime(S.pos);
  }
  $('#pos').oninput=e=>{ S.pos=+e.target.value/1000; $('#pv').textContent=fmtTime(S.pos); };
  $('#xfChip').onclick=()=>{ S.xf=!S.xf; $('#xfChip').classList.toggle('on',S.xf); };
  function splice(){
    const b=S.base.buf, i=S.ins.buf, c=AC();
    const p0=Math.floor(clamp(S.pos,0,b.duration)*c.sampleRate);
    const cut=S.xf?Math.min(p0,i.length,Math.floor(.2*c.sampleRate)):0;
    const n1=p0-cut;                    /* base head (before the cut) */
    const n3=Math.max(0,i.length-cut);  /* insert tail (after crossfade) */
    const n4=b.length-p0;               /* base tail (after the cut) */
    const o2=n1+cut, o3=o2+n3;
    const total=Math.max(1,n1+cut+n3+n4);
    const out=c.createBuffer(2,total,c.sampleRate);
    const L=out.getChannelData(0), R=out.getChannelData(1);
    const b0=b.getChannelData(0), b1=b.numberOfChannels>1?b.getChannelData(1):b0;
    const i0=i.getChannelData(0), i1=i.numberOfChannels>1?i.getChannelData(1):i0;
    const copyRange=(dst,src,srcFrom,dstFrom,len)=>{ for(let j=0;j<len;j++) dst[dstFrom+j]=src[srcFrom+j]; };
    for(let ch=0;ch<2;ch++){ const src=ch?b1:b0, dst=ch?R:L; copyRange(dst,src,0,0,n1); }
    for(let j=0;j<cut;j++){
      const t=cut>0?j/cut:1;
      const kb=n1+j, ki=p0-cut+j;
      L[kb]=b0[ki]*(1-t)+i0[j]*t;
      R[kb]=b1[ki]*(1-t)+i1[j]*t;
    }
    for(let ch=0;ch<2;ch++){ const src=ch?i1:i0, dst=ch?R:L; copyRange(dst,src,cut,o2,n3); }
    for(let ch=0;ch<2;ch++){ const src=ch?b1:b0, dst=ch?R:L; copyRange(dst,src,p0,o3,n4); }
    return out;
  }
  $('#pp').onclick=()=>{ if(S.base&&S.ins) playBuf(splice(),$('#pp')); };
  $('#exW').onclick=()=>{ if(S.base&&S.ins) exportBuffer(splice(),'inserted-audio','wav'); };
  $('#exM').onclick=()=>{ if(S.base&&S.ins) exportBuffer(splice(),'inserted-audio','mp3'); };
}

/* ================= VOLUME BOOSTER ================= */
function renderBoost(){
  const S={buf:null,name:'',db:6,soft:true,proc:null,dirty:false};
  page.innerHTML=toolPage('Volume Booster','Amplify quiet recordings. The soft-clip limiter keeps it punchy without nasty distortion.',
   `<div class="panel">${dropHtml('Tap to choose an audio file','or drag & drop here')}</div>
    <div class="panel mt" id="work" hidden>
      <div class="row between">
        <div class="file-row" style="flex:1;min-width:230px;border:0;padding:0;gap:10px"><div class="file-ic">${IC.music}</div><div class="file-meta"><div class="fm-n"><span id="fn"></span></div><div class="fm-s"><span id="fs"></span></div></div></div>
        <button class="btn ghost small" id="chg">Change file</button>
      </div>
      <div class="row mt" style="gap:16px">
        <div style="flex:1;min-width:220px"><label class="lbl">Gain <span id="dbv" style="color:var(--cyan)">+6.0 dB</span></label>
          <input type="range" class="slider" id="db" min="-12" max="18" step="0.5" value="6"></div>
        <span class="chip on" id="softChip">${IC.check} Soft-clip limiter</span>
      </div>
      <div class="wave-wrap mt"><canvas id="wc"></canvas></div>
      <div class="row mt">
        <button class="btn ghost" id="pp">${IC.play} Preview</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="exW">${IC.download} WAV</button>
        <button class="btn primary" id="exM">${IC.download} MP3</button>
      </div>
    </div>`);
  const cv=$('#wc');
  function draw(){
    if(S.proc) drawPeaks(cv,S.proc.getChannelData(0),{color:'#34d399'});
    else if(S.buf) drawPeaks(cv,S.buf.getChannelData(0),{color:'#7d8fd6'});
  }
  let procSeq=0, procTimer=0;
  async function process(){
    if(!S.buf) return;
    clearTimeout(procTimer);
    const seq=++procSeq;
    const buf=S.buf, g=Math.pow(10,S.db/20), soft=S.soft;
    const out=AC().createBuffer(buf.numberOfChannels,buf.length,buf.sampleRate);
    /* soft-knee limiter: linear below |x|=0.8, smoothly saturating to 1.0 above.
       (The old tanh(x)/tanh(g) normalised every peak to full scale, so -12 dB
        and even 0 dB came out at full volume.) */
    const softClip=x=>{
      const a=Math.abs(x);
      return a<=.8?x:Math.sign(x)*(.8+.2*Math.tanh((a-.8)/.2));
    };
    for(let ch=0;ch<buf.numberOfChannels;ch++){
      const d=buf.getChannelData(ch), o=out.getChannelData(ch);
      /* chunked: yield to the UI every ~1M samples so long files never freeze the page */
      const CH=1<<20;
      for(let s0=0;s0<d.length;s0+=CH){
        const s1=Math.min(d.length,s0+CH);
        for(let i=s0;i<s1;i++){
          const x=d[i]*g;
          o[i]=soft?softClip(x):clamp(x,-1,1);
        }
        await sleep(0);
        if(seq!==procSeq) return; /* superseded by a newer slider position */
      }
    }
    if(seq!==procSeq) return;
    S.proc=out; S.dirty=false; draw();
  }
  function scheduleProcess(delay){
    if(!S.buf) return;
    S.dirty=true;
    clearTimeout(procTimer);
    procTimer=setTimeout(()=>{ process(); },delay==null?140:delay);
  }
  async function readyBuf(){
    if(!S.buf) return null;
    if(S.dirty||!S.proc) await process();
    return S.proc;
  }
  async function load(f){
    try{
      const buf=await decodeFile(f);
      S.buf=buf; S.name=f.name; S.proc=null;
      $('#fn').textContent=f.name;
      $('#fs').textContent=fmtTime(buf.duration);
      $('#work').hidden=false;
      await sleep(30); draw(); await process();
    }catch(e){ toast("Couldn't decode "+f.name); }
  }
  attachDrop($('#dz'),fs=>load(fs[0]));
  $('#chg').onclick=()=>{ const i=$('#dz input'); if(i) i.click(); };
  $('#db').oninput=e=>{ S.db=+e.target.value; $('#dbv').textContent=(S.db>=0?'+':'')+S.db.toFixed(1)+' dB'; scheduleProcess(); };
  $('#db').onchange=()=>scheduleProcess(0);
  $('#softChip').onclick=()=>{ S.soft=!S.soft; $('#softChip').classList.toggle('on',S.soft); scheduleProcess(0); };
  $('#pp').onclick=async()=>{ const b=await readyBuf(); if(b) playBuf(b,$('#pp')); };
  $('#exW').onclick=async()=>{ const b=await readyBuf(); if(b) exportBuffer(b,safeName(S.name)+'-boosted','wav'); };
  $('#exM').onclick=async()=>{ const b=await readyBuf(); if(b) exportBuffer(b,safeName(S.name)+'-boosted','mp3'); };
  window.__pageRedraw=draw;
}

        <button class="btn primary" id="exM">${IC.download} MP3</button>
      </div>
    </div>`);
  const cv=$('#wc');
  const maxStart=()=>S.buf?Math.max(0,S.buf.duration-S.len):0;
  function draw(){
    if(!S.buf) return;
    const dur=S.buf.duration;
    drawPeaks(cv,S.buf.getChannelData(0),{sel0:S.start/dur,sel1:Math.min(1,(S.start+Math.min(S.len,Math.max(0.1,dur-S.start))))/dur,mid:true});
    $('#slv').textContent=fmtTime(S.start);
  }
  let drawRaf=0;
  const scheduleDraw=()=>{ if(drawRaf) return; drawRaf=requestAnimationFrame(()=>{ drawRaf=0; draw(); }); };
  function refreshSlider(){
    const s=$('#sld');
    s.max=Math.floor(maxStart()*1000);
    S.start=clamp(S.start,0,maxStart());
    s.value=Math.floor(S.start*1000); paintRange(s);
    scheduleDraw();
  }
  function outBuf(){
    const a=S.start, b=Math.min(S.buf.duration,S.start+S.len);
    const out=sliceBuf(S.buf,a,b);
    if(S.fades){
      const sr=out.sampleRate;
      const fi=Math.min(.5,out.length/sr), fo=Math.min(.8,out.length/sr);
      for(let ch=0;ch<out.numberOfChannels;ch++){
        const d=out.getChannelData(ch);
        for(let i=0;i<d.length;i++){
          const t=i/sr;
          if(t<fi) d[i]*=t/fi;
          if(t>out.duration-fo) d[i]*=Math.max(0,(out.duration-t)/fo);
        }
      }
    }
    return out;
  }
  async function load(f){
    try{
      const buf=await decodeFile(f);

  $('#len').oninput=e=>{ S.len=+e.target.value; $('#llv').textContent=S.len+' s'; refreshSlider(); };
  $('#sld').oninput=e=>{ S.start=+e.target.value/1000; scheduleDraw(); };
  $('#fadesChip').onclick=()=>{ S.fades=!S.fades; $('#fadesChip').classList.toggle('on',S.fades); };
  $('#pp').onclick=()=>{ if(S.buf) playBuf(outBuf(),$('#pp')); };
  $('#exW').onclick=()=>{ if(S.buf) exportBuffer(outBuf(),safeName(S.name)+'-ringtone','wav'); };
  $('#exM').onclick=()=>{ if(S.buf) exportBuffer(outBuf(),safeName(S.name)+'-ringtone','mp3'); };
  window.__pageRedraw=draw;
}

      if(finished) return; finished=true;
      S.active=false;
      try{src.stop();}catch(e){}
      try{an.disconnect();}catch(e){}

        const bh=Math.max(10,v*460);

        rr(g,i*bw+6,640-bh,bw-12,bh,8); g.fill();
      }
      g.fillStyle='#eef2ff'; g.font='700 46px system-ui, sans-serif';
      g.fillText(S.name.length>34?S.name.slice(0,34)+'…':S.name,60,116);
      const t=Math.max(0,c.currentTime-t0);
      g.font='600 30px system-ui, sans-serif'; g.fillStyle='#8f9cc6';
      g.fillText(fmtTime(t)+' / '+fmtTime(S.buf.duration),60,700);
      const bar=g.createLinearGradient(0,0,1280,0);
      bar.addColorStop(0,'#22d3ee'); bar.addColorStop(1,'#a78bfa');
      g.fillStyle=bar; g.fillRect(0,712,1280*clamp(t/S.buf.duration,0,1),8);
      $('#avProg').style.width=(clamp(t/S.buf.duration,0,1)*100)+'%';
      if(t>=S.buf.duration){ finish(); return; }
      requestAnimationFrame(draw);
    };
    draw();
  };
  window.__pageStop=()=>{
    if(S.active){
      S.active=false;
      try{ S.src&&S.src.stop(); }catch(e){}
      try{ S.an&&S.an.disconnect(); }catch(e){}
      S.src=null; S.an=null;
      try{ rec&&rec.state!=='inactive'&&rec.stop(); }catch(e){}
    }
  };
}

/* ================= NOISE REMOVER ================= */
function hann(n){ const w=new Float32Array(n); for(let i=0;i<n;i++) w[i]=.5-.5*Math.cos(2*Math.PI*i/(n-1)); return w; }
function fft(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){
    let bit=n>>1;
    for(;j&bit;bit>>=1) j^=bit;
    j^=bit;
    if(i<j){ let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; }
  }
  for(let len=2;len<=n;len<<=1){
    const ang=-2*Math.PI/len, wr=Math.cos(ang), wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){
      let cr=1,ci=0;
      for(let j=0;j<len>>1;j++){
        const a=i+j, b=a+(len>>1);
        const vr=re[b]*cr-im[b]*ci, vi=re[b]*ci+im[b]*cr;
        re[b]=re[a]-vr; im[b]=im[a]-vi;
        re[a]+=vr; im[a]+=vi;
        const nr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=nr;
      }
    }
  }
}
function ifft(re,im){
  const n=re.length;
  for(let i=0;i<n;i++) im[i]=-im[i];
  fft(re,im);
  for(let i=0;i<n;i++){ re[i]/=n; im[i]=-im[i]/n; }
}
async function denoiseBuffer(buf,strength,onProg){
  const sr=buf.sampleRate, nc=buf.numberOfChannels;
  const frame=2048, hop=512, half=frame/2;
  const win=hann(frame);
  /* weighted overlap-add over a centred (zero-padded) signal, so frame f covers
     [f*hop-half, f*hop+half) and no sample is left out at the head or the tail */
  const nFrames=Math.max(1,Math.ceil((buf.length+frame)/hop));
  const noise=new Float32Array(half+1);
  const re0=new Float32Array(frame), im0=new Float32Array(frame);
  let pf=0;
  const maxPf=Math.max(1,Math.floor(.5*sr/hop));
  const at=(d,i)=>(i>=0&&i<d.length?d[i]:0);
  for(let f=0;f<maxPf&&f<nFrames;f++){
    const c0=f*hop;
    for(let c=0;c<nc;c++){
      const d=buf.getChannelData(c);
      re0.fill(0); im0.fill(0);
      for(let i=0;i<frame;i++) re0[i]=at(d,c0-half+i)*win[i];
      fft(re0,im0);
      for(let k=0;k<=half;k++) noise[k]+=Math.hypot(re0[k],im0[k]);
    }
    pf++;
  }
  const norm=Math.max(1,pf*nc);
  for(let k=0;k<=half;k++) noise[k]/=norm;
  const sums=[], wsums=[];
  for(let c=0;c<nc;c++){ sums.push(new Float32Array(buf.length)); wsums.push(new Float32Array(buf.length)); }
  const re=new Float32Array(frame), im=new Float32Array(frame);
  const yieldEvery=Math.max(1,(nFrames/25)|0);
  for(let f=0;f<nFrames;f++){
    const c0=f*hop;
    for(let c=0;c<nc;c++){
      const d=buf.getChannelData(c);
      re.fill(0); im.fill(0);
      for(let i=0;i<frame;i++) re[i]=at(d,c0-half+i)*win[i];
      fft(re,im);
      for(let k=0;k<=half;k++){
        const mag=Math.hypot(re[k],im[k]);
        /* floor is 12% of the learned profile (was 2%, which left a faint hiss) */
        const nmag=Math.max(mag-noise[k]*strength, noise[k]*.12);
        const s2=mag>1e-9?nmag/mag:0;
        re[k]*=s2; im[k]*=s2;
        if(k>0&&k<half){ re[frame-k]=re[k]; im[frame-k]=-im[k]; }
      }
      ifft(re,im);
      const s32=sums[c], w32=wsums[c];
      for(let i=0;i<frame;i++){
        const j=c0-half+i;
        if(j<0||j>=buf.length) continue;
        s32[j]+=re[i]*win[i];
        w32[j]+=win[i]*win[i];
      }
    }
    if(f%yieldEvery===0){ if(onProg) onProg(f/nFrames); await sleep(0); }
  }
  const out=AC().createBuffer(nc,buf.length,sr);
  /* only trust the overlap-add where the analysis windows actually overlapped */
  const MINW=.2*win[half]*win[half];
  for(let c=0;c<nc;c++){
    const o=out.getChannelData(c), s32=sums[c], w32=wsums[c];
    for(let i=0;i<buf.length;i++){ const w=w32[i]; o[i]=w>MINW?s32[i]/w:0; }
  }
  if(onProg) onProg(1);
  return out;
}

/* ================= voice changer (real DSP) ================= */
function shaperCurve(k){ const n=1024,c=new Float32Array(n); for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=Math.tanh(k*x)/Math.tanh(k); } return c; }
function makeImpulse(ctx,dur,decay){
  const rate=ctx.sampleRate,len=Math.max(1,Math.ceil(rate*dur));
  const ir=ctx.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
  return ir;
}
async function renderVoiceFx(buf,id){
  const rate=id==='chipmunk'?1.5:(id==='deep'?0.6:1);
  const tail=id==='echo'?1.4:(id==='reverb'?2.2:0.15);
  const sr=buf.sampleRate;
  const off=new OfflineAudioContext(2,Math.max(1,Math.ceil((buf.duration/rate+tail)*sr)),sr);
  const src=off.createBufferSource(); src.buffer=buf; src.playbackRate.value=rate;
  const done=()=>off.startRendering();
  if(id==='chipmunk'||id==='deep'){
    src.connect(off.destination); src.start(0); return done();
  }
  if(id==='robot'){
    const sh=off.createWaveShaper(); sh.curve=shaperCurve(24); sh.oversample='4x';
    const hp=off.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=140;
    const ring=off.createGain(); ring.gain.value=.5;
    const lfo=off.createOscillator(); lfo.frequency.value=32;
    const lg=off.createGain(); lg.gain.value=.5;
    lfo.connect(lg); lg.connect(ring.gain);
    src.connect(sh); sh.connect(ring); ring.connect(hp); hp.connect(off.destination);
    src.start(0); lfo.start(0); return done();
  }
  if(id==='echo'){
    const dry=off.createGain(); dry.gain.value=.85;
    const dly=off.createDelay(1); dly.delayTime.value=.28;
    const fb=off.createGain(); fb.gain.value=.42;
    const wet=off.createGain(); wet.gain.value=.65;
    src.connect(dry); dry.connect(off.destination);
    src.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(off.destination);
    src.start(0); return done();
  }
  if(id==='reverb'){
    const conv=off.createConvolver(); conv.buffer=makeImpulse(off,2.4,2.6);
    const wet=off.createGain(); wet.gain.value=.55;
    const dry=off.createGain(); dry.gain.value=.7;
    src.connect(dry); dry.connect(off.destination);
    src.connect(conv); conv.connect(wet); wet.connect(off.destination);
    src.start(0); return done();
  }
  /* phone */
  const hp=off.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=380; hp.Q.value=.7;
  const lp=off.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3000; lp.Q.value=.7;
  const sh=off.createWaveShaper(); sh.curve=shaperCurve(4); sh.oversample='2x';
  src.connect(hp); hp.connect(lp); lp.connect(sh); sh.connect(off.destination);
  src.start(0); return done();
}

    if(S.raf){ cancelAnimationFrame(S.raf); S.raf=0; }
    if(S.rec&&S.rec.state==='recording'){ S.rec.onstop=null; try{S.rec.stop();}catch(e){} } /* detached: onstop must not write into the next page */
    if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; }
    try{ S.node&&S.node.disconnect(); }catch(e){}
    try{ S.analyser&&S.analyser.disconnect(); }catch(e){}
    S.node=null; S.rec=null;
  }
  btn.onclick=async()=>{
    if(S.rec&&S.rec.state==='recording'){ stopRec(); return; }
    try{
      S.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){ toast('Microphone permission denied — allow mic access in your browser, then tap again'); return; }
    const c=AC(); if(c.state==='suspended'){ try{ await c.resume(); }catch(e){} }
    const node=c.createMediaStreamSource(S.stream); S.node=node;
    S.analyser=c.createAnalyser(); S.analyser.fftSize=1024;
    node.connect(S.analyser);
    S.dataBuf=new Float32Array(S.analyser.fftSize);
    let mime='';
    if(window.MediaRecorder) for(const t of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg']){ try{ if(MediaRecorder.isTypeSupported(t)){ mime=t; break; } }catch(e){} }
    S.mime=mime;
    S.rec=new MediaRecorder(S.stream,mime?{mimeType:mime}:undefined);
    S.chunks=[];
    S.rec.ondataavailable=e=>{ if(e.data&&e.data.size) S.chunks.push(e.data); };
    S.rec.onstop=async()=>{
      S.stream&&S.stream.getTracks().forEach(t=>t.stop()); S.stream=null;
      const blob=new Blob(S.chunks,{type:(S.rec&&S.rec.mimeType)||S.mime||'audio/webm'});
      S.chunks=[];
      try{
        const buf=await AC().decodeAudioData(await blob.arrayBuffer());
        S.buf=buf;
        if(!cv.isConnected) return; /* user left this tool while decoding */
        $('#fn').textContent='voice-note';
        $('#fs').textContent=fmtTime(buf.duration);
        $('#work').hidden=false;
        requestAnimationFrame(()=>drawPeaks(cv,buf.getChannelData(0),{color:'#60a5fa'}));
        toast('Recording ready — preview or save');
      }catch(e){
        const ext=blob.type.indexOf('mp4')>-1?'m4a':(blob.type.indexOf('ogg')>-1?'ogg':'webm');
        downloadOnly(blob,'voice-note.'+ext);
        toast('Recording saved as .'+ext+' (preview not supported for this codec)');
      }
    };
    S.rec.start(250);
    S.t0=performance.now();
    ring.classList.add('rec');
    lbl.textContent='Recording… tap to stop';
    meter.hidden=false;
    const loop=()=>{
      if(!S.rec||S.rec.state!=='recording') return;
      S.analyser.getFloatTimeDomainData(S.dataBuf);
      let sum=0;
      for(let i=0;i<S.dataBuf.length;i++) sum+=S.dataBuf[i]*S.dataBuf[i];
      const rms=Math.sqrt(sum/S.dataBuf.length);
      bar.style.width=Math.min(100,Math.round(rms*420))+'%';
      timeEl.textContent=fmtTime((performance.now()-S.t0)/1000);
      S.raf=requestAnimationFrame(loop);
    };
    S.raf=requestAnimationFrame(loop);
  };
  function stopRec(){
    if(S.rec&&S.rec.state==='recording') S.rec.stop();
    if(S.raf){ cancelAnimationFrame(S.raf); S.raf=0; }
    ring.classList.remove('rec');
    meter.hidden=true;
    lbl.textContent='Saved — preview & download below';
  }
  $('#pp').onclick=()=>{ if(S.buf) playBuf(S.buf,$('#pp')); };
  $('#exW').onclick=()=>{ if(S.buf) exportBuffer(S.buf,'voice-note','wav'); else toast('Record something first'); };
  $('#exM').onclick=()=>{ if(S.buf) exportBuffer(S.buf,'voice-note','mp3'); else toast('Record something first'); };
  window.__pageStop=()=>cleanup();
}

/* ================= compressor (real DynamicsCompressor) ================= */
function renderComp(){
  const S={buf:null,name:'',proc:null,th:-18,ra:4,kn:6,at:.01,rl:.25};
  page.innerHTML=toolPage('Compressor','Squashes the loud peaks and lifts the quiet parts with a real-time dynamics compressor. Drag the sliders, hit Compress, compare and export.',
   `<div class="panel">${dropHtml('Tap to choose an audio file','or drag & drop here')}</div>
    <div class="panel mt" id="work" hidden>
      <div class="row between">

        <button class="btn ghost small" id="chg">Change file</button>
