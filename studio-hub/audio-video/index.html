<title>Audio & Video Editor — 63 Tools | Trim, Mix, Studio & Video Suite</title>
<style>
/* ============================================================
   AUDIO EDITOR — Design System v2 (upgraded)
   ============================================================ */
:root{
  --bg:#080e28; --panel:rgba(18,28,66,.55); --panel2:rgba(13,21,52,.8);
  --line:rgba(148,163,255,.14); --line2:rgba(148,163,255,.3);
  --text:#f0f4ff; --muted:#93a0cc; --dim:#5f6da0;
  --cyan:#22d3ee; --blue:#3b82f6; --indigo:#6366f1; --green:#34d399;
  --amber:#fbbf24; --orange:#f97316; --pink:#e879f9; --red:#fb7185; --purple:#a78bfa;
  --grad:linear-gradient(135deg,#6366f1,#4f6df5 45%,#22b8f0);
  --rad:16px; --shadow:0 18px 40px rgba(2,6,24,.45);
  --ring:0 0 0 3px rgba(99,102,241,.4);
  --tl-bg:#0b1333;
}
:root[data-theme="light"]{
  --bg:#eef1fb; --panel:rgba(255,255,255,.82); --panel2:rgba(255,255,255,.9);
  --line:rgba(30,41,90,.13); --line2:rgba(30,41,90,.26);
  --text:#131a3d; --muted:#48527a; --dim:#7d88ad;
  --cyan:#0891b2; --blue:#2563eb; --indigo:#4f46e5; --green:#059669;
  --amber:#d97706; --orange:#ea580c; --pink:#c026d3; --red:#e11d48; --purple:#7c3aed;
  --shadow:0 18px 40px rgba(30,41,90,.14);
  --tl-bg:#f6f8ff;
}
:root[data-theme="light"] body{background:
  radial-gradient(700px 420px at 85% -5%,rgba(59,130,246,.14),transparent 60%),
  radial-gradient(600px 400px at -10% 30%,rgba(192,38,211,.10),transparent 60%),var(--bg)}
:root[data-theme="light"] .header{background:rgba(255,255,255,.85)}
:root[data-theme="light"] .bnav{background:rgba(255,255,255,.9)}
:root[data-theme="light"] .studio-scroll{background:var(--tl-bg)}
:root[data-theme="light"] .toast{background:#fff}
:root[data-theme="light"] .enc-hud{background:rgba(255,255,255,.95)}
:root[data-theme="light"] .tool::before{background:radial-gradient(140px 90px at 50% 0%,rgba(255,255,255,.65),transparent 70%),radial-gradient(120px 120px at 50% 115%,var(--ic),transparent 70%)}
:root[data-theme="light"] .hero-badge{color:#0b6e8f;background:rgba(8,145,178,.12);border-color:rgba(8,145,178,.35)}
:root[data-theme="light"] .hero-badge svg{color:#0891b2}
:root[data-theme="light"] .tool .t-ds{color:rgba(226,232,255,.62)}
:root[data-theme="light"] .btn.ghost{background:rgba(30,41,90,.05)}
:root[data-theme="light"] .btn.ghost:hover{background:rgba(30,41,90,.09)}
:root[data-theme="light"] .menu{background:#fff}
:root[data-theme="light"] .modal{background:#fff}
:root[data-theme="light"] .pop{background:#fff}
:root[data-theme="light"] .inp{background:rgba(255,255,255,.92)}
:root[data-theme="light"] .wave-wrap{background:#dfe6fb}
:root[data-theme="light"] .viz-wrap{background:#e6ebff}
/* hub link in the header */
.hub-link{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;
  font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);background:var(--panel);text-decoration:none}
.hub-link:hover{color:var(--text);border-color:var(--line2)}
@media(max-width:480px){.hub-link{font-size:0;gap:0;padding:8px}}
.hub-link svg{vertical-align:middle}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 700px at 85% -10%, rgba(59,130,246,.16), transparent 60%),
    radial-gradient(900px 600px at -10% 30%, rgba(124,58,237,.10), transparent 55%),
    radial-gradient(1000px 800px at 50% 120%, rgba(34,211,238,.07), transparent 60%),
    linear-gradient(180deg,#060a1e 0%, #0a1130 45%, #0a1332 100%);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
::selection{background:rgba(99,102,241,.4)}
button:focus-visible,.chip:focus-visible,.tool:focus-visible,a:focus-visible{outline:none;box-shadow:var(--ring);border-radius:12px}

/* ---------- scrollbars ---------- */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(148,163,255,.22);border-radius:99px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(148,163,255,.42);background-clip:content-box}
*{scrollbar-width:thin;scrollbar-color:rgba(148,163,255,.25) transparent}

/* ---------- header ---------- */
.header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:12px clamp(14px,4vw,28px);
  background:rgba(7,11,30,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);box-shadow:0 8px 30px rgba(2,6,24,.25)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:.15s;flex:none}
.icon-btn:hover{background:rgba(148,163,255,.1);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:21px;height:21px}
.brand{display:flex;align-items:center;gap:10px;font-size:clamp(18px,2.4vw,21px);font-weight:800;letter-spacing:.2px;cursor:pointer;user-select:none;white-space:nowrap}
.brand .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--indigo),var(--blue) 55%,var(--cyan));
  box-shadow:0 6px 18px rgba(59,130,246,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.brand .logo svg{width:20px;height:20px;color:#fff}
.spacer{flex:1}
.pro-badge{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:11px;font-weight:800;font-size:13px;
  color:#3a2404;background:linear-gradient(135deg,#fcd34d,#f97316);
  box-shadow:0 6px 16px rgba(249,115,22,.35),inset 0 1px 0 rgba(255,255,255,.45);transition:.15s;letter-spacing:.5px;flex:none}
.pro-badge:hover{transform:translateY(-1px);filter:brightness(1.05)}
.pro-badge:active{transform:scale(.96)}
.pro-badge svg{width:14px;height:14px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:50px;min-width:248px;max-height:70vh;overflow:auto;background:#0e1739;border:1px solid var(--line2);
  border-radius:16px;padding:8px;box-shadow:0 24px 60px rgba(2,6,24,.6);display:none;z-index:70}
.menu.open{display:block;animation:pop .18s ease}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:var(--muted);font-size:14.5px;font-weight:600;text-align:left;transition:.13s}
.menu button:hover{background:rgba(148,163,255,.08);color:var(--text);transform:translateX(2px)}
.menu button svg{width:17px;height:17px;flex:none}
.menu .sep{height:1px;background:var(--line);margin:7px 8px}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:clamp(18px,3.5vw,34px) clamp(14px,4vw,28px) 60px;min-height:60vh}
.page{animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:clamp(26px,4.5vw,38px);font-weight:800;letter-spacing:-.5px}
h2.sec-title{font-size:clamp(19px,3vw,24px);font-weight:800;margin:36px 0 14px;display:flex;align-items:center;gap:10px}
h2.sec-title svg{width:22px;height:22px;color:var(--cyan);filter:drop-shadow(0 0 8px rgba(34,211,238,.55))}
.sub{color:var(--muted);margin-top:8px;font-size:15px;max-width:640px;line-height:1.55}
.back-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:14px;padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:rgba(148,163,255,.04);transition:.15s}
.back-btn:hover{color:var(--text);background:rgba(148,163,255,.1);transform:translateX(-2px)}
.back-btn svg{width:16px;height:16px}

/* ---------- hero ---------- */
.hero{padding:clamp(10px,2.5vw,26px) 0 4px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#bfe9ff;
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);padding:7px 14px;border-radius:999px;margin-bottom:18px;
  box-shadow:0 0 18px rgba(34,211,238,.12)}
.hero-badge svg{width:14px;height:14px;color:var(--cyan)}
.hero h1{max-width:780px;line-height:1.12}
.grad{background:linear-gradient(92deg,#22d3ee,#818cf8 55%,#e879f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;
  padding:11px 18px;border-radius:13px;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease,background .16s ease,border-color .16s ease;
  white-space:nowrap;border:1px solid transparent;-webkit-tap-highlight-color:transparent;user-select:none;isolation:isolate}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0) 48%);pointer-events:none}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary{background:linear-gradient(135deg,#6366f1,#4f6df5 45%,#22b8f0);color:#fff;
  box-shadow:0 8px 22px rgba(79,109,245,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 12px 30px rgba(79,109,245,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.ghost{background:rgba(148,163,255,.07);border-color:var(--line2);color:var(--text);backdrop-filter:blur(6px)}
.btn.ghost:hover{background:rgba(148,163,255,.14);border-color:rgba(148,163,255,.45)}
.btn.danger{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;box-shadow:0 8px 20px rgba(244,63,94,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.small{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.big{padding:15px 26px;font-size:16px;border-radius:15px;letter-spacing:.2px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none;box-shadow:none}
.btn.on{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.5);color:#7dd3fc;box-shadow:0 0 14px rgba(34,211,238,.18)}
.btn svg{width:17px;height:17px;flex:none}

/* ---------- tool cards ---------- */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  min-height:164px;padding:26px 14px 20px;border-radius:22px;cursor:pointer;overflow:hidden;
  background:linear-gradient(165deg,var(--c1),var(--c2));
  border:1px solid rgba(148,163,255,.13);box-shadow:0 6px 18px rgba(2,6,24,.35);
  transition:transform .22s cubic-bezier(.2,.8,.25,1),box-shadow .22s ease,border-color .22s ease}
.tool::before{content:"";position:absolute;inset:0;opacity:.55;transition:opacity .25s;
  background:radial-gradient(150px 96px at 50% -8%,rgba(255,255,255,.13),transparent 70%),
             radial-gradient(130px 130px at 50% 118%,var(--ic),transparent 72%)}
.tool::after{content:"\2192";position:absolute;right:13px;bottom:10px;font-size:15px;font-weight:800;color:rgba(255,255,255,.8);
  opacity:0;transform:translateX(-6px);transition:opacity .22s,transform .22s;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.tool:hover::before{opacity:.9}
.tool:hover::after{opacity:1;transform:none}
.tool:hover{transform:translateY(-5px);box-shadow:0 20px 42px rgba(2,6,24,.55);border-color:rgba(148,163,255,.38)}
.tool:active{transform:translateY(-1px) scale(.99)}
.tool .t-ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:var(--ic);
  background:rgba(9,14,36,.5);border:1px solid rgba(255,255,255,.13);
  box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .22s ease;position:relative}
.tool:hover .t-ic{transform:scale(1.09) translateY(-2px)}
.tool .t-ic svg{width:26px;height:26px;filter:drop-shadow(0 0 10px var(--ic))}
.tool .t-nm{font-weight:800;font-size:15.5px;color:#fff;text-shadow:0 1px 8px rgba(2,6,24,.55);text-align:center;line-height:1.25;position:relative}
.tool .t-ds{font-size:11.5px;color:rgba(224,231,255,.55);text-align:center;line-height:1.35;position:relative}
.tool .crown{position:absolute;top:10px;right:10px;width:25px;height:25px;border-radius:8px;display:grid;place-items:center;
  background:rgba(251,191,36,.16);color:#fcd34d;border:1px solid rgba(251,191,36,.4);box-shadow:0 0 12px rgba(251,191,36,.25)}
.tool .crown svg{width:13px;height:13px}
.tool .ai-tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.6px;color:#7dd3fc;
  background:rgba(14,116,144,.35);border:1px solid rgba(34,211,238,.4);padding:3px 7px;border-radius:7px;box-shadow:0 0 10px rgba(34,211,238,.2)}

/* ---------- panels / rows ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,2.5vw,22px);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(2,6,24,.18)}
.panel + .panel{margin-top:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.prog{height:10px;border-radius:999px;background:rgba(148,163,255,.16);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:999px;background:var(--grad);transition:width .2s ease}
.row.wrap{flex-wrap:wrap}
.mt{margin-top:16px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}

/* ---------- dropzone ---------- */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;
  border:2px dashed rgba(148,163,255,.35);border-radius:18px;padding:clamp(24px,5vw,42px) 16px;cursor:pointer;
  color:var(--muted);transition:.18s;background:rgba(148,163,255,.03);position:relative}
.drop svg{width:38px;height:38px;color:var(--cyan);transition:transform .2s}
.drop:hover svg{transform:translateY(-3px) scale(1.06)}
.drop:hover,.drop.over{border-color:var(--cyan);background:rgba(34,211,238,.06);box-shadow:0 0 0 4px rgba(34,211,238,.07)}
.drop .d-main{font-weight:700;font-size:15.5px;color:var(--text)}
.drop .d-sub{font-size:13px}

/* ---------- sliders / chips ---------- */
.slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:rgba(148,163,255,.2);outline:none;transition:.15s}
.slider:hover{background:rgba(148,163,255,.3)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:19px;height:19px;border-radius:50%;
  background:linear-gradient(135deg,#818cf8,#3b82f6);border:2px solid rgba(255,255,255,.3);box-shadow:0 3px 12px rgba(59,130,246,.55);cursor:pointer;transition:transform .12s}
.slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
.slider::-webkit-slider-thumb:active{transform:scale(.95)}
.slider::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:#3b82f6;border:2px solid rgba(255,255,255,.25);cursor:pointer}
label.lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;display:block;margin-bottom:8px}
.inp{background:rgba(10,17,42,.8);border:1px solid var(--line2);border-radius:11px;padding:9px 12px;font-size:14px;color:var(--text);min-width:90px;transition:.15s}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:8px 13px;border-radius:11px;
  background:rgba(148,163,255,.07);border:1px solid var(--line2);color:var(--text);cursor:pointer;transition:.15s;user-select:none}
.chip:hover{background:rgba(148,163,255,.13);transform:translateY(-1px)}
.chip:active{transform:scale(.95)}
.chip.on{background:linear-gradient(135deg,rgba(99,102,241,.4),rgba(59,130,246,.4));border-color:rgba(99,102,241,.65);box-shadow:0 0 14px rgba(99,102,241,.25)}
.chip svg{width:16px;height:16px;stroke-width:2.5}

/* ---------- waveform ---------- */
.wave-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0a1230;box-shadow:inset 0 2px 14px rgba(0,0,0,.35)}
.wave-wrap canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
.wave-wrap.sm canvas{height:92px}

/* ---------- studio ---------- */
.studio-layout{display:block;width:100%;min-width:0}
.studio-main{min-width:0;width:100%}
.track-panel{min-width:0;max-height:none;overflow:visible;padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,rgba(20,31,70,.96),rgba(10,17,43,.96));box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 12px 30px rgba(0,0,0,.15)}
.track-panel-bottom{margin-top:18px}
.track-panel-bottom .track-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
:root[data-theme="light"] .track-panel{background:linear-gradient(160deg,#fff,#f3f6ff)}
.track-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.track-panel-title{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.track-count{font-size:10px;font-weight:800;padding:3px 8px;border:1px solid var(--line);border-radius:99px;color:var(--cyan);background:rgba(34,211,238,.08)}
.track-inspector{padding:12px;border-radius:13px;border:1px solid var(--line);background:rgba(148,163,255,.045);margin-bottom:12px}
.track-inspector-title{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.track-inspector-meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55}
.track-inspector-meter{height:4px;margin-top:10px;border-radius:99px;background:rgba(148,163,255,.1);overflow:hidden}
.track-inspector-meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#22d3ee,#818cf8)}
.track-list{display:flex;flex-direction:column;gap:7px}
.track-card{display:grid;grid-template-columns:4px minmax(0,1fr) auto;align-items:center;gap:9px;padding:9px 8px;border:1px solid transparent;border-radius:12px;background:rgba(148,163,255,.035);transition:.16s;cursor:pointer}
.track-card:hover{background:rgba(148,163,255,.09);border-color:var(--line)}
.track-card.selected{background:rgba(99,102,241,.13);border-color:rgba(129,140,248,.5);box-shadow:0 0 18px rgba(99,102,241,.1)}
.track-swatch{width:4px;height:34px;border-radius:8px;background:linear-gradient(180deg,var(--track-a),var(--track-b));box-shadow:0 0 12px color-mix(in srgb,var(--track-a) 38%,transparent)}
.track-card-name{font-size:11.5px;font-weight:750;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-card-sub{font-size:10px;color:var(--muted);margin-top:3px}
.track-card-actions{display:flex;gap:3px}
.track-mini-btn{width:25px;height:25px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);background:rgba(148,163,255,.045);color:var(--muted);font-size:10px;font-weight:850;transition:.15s}
.track-mini-btn:hover{border-color:var(--line2);color:var(--text);background:rgba(148,163,255,.12)}
.track-mini-btn.on.mute{color:#67e8f9;border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.12)}
.track-mini-btn.on.solo{color:#fbbf24;border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.1)}
.track-mini-btn.on.lock{color:#fb7185;border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.1)}
.track-panel-empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6;border:1px dashed var(--line);border-radius:12px}
.studio-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.studio-title{font-size:clamp(18px,3vw,22px);font-weight:800;margin-right:auto}
.studio-scroll{overflow:auto;border-radius:16px;border:1px solid var(--line);background:var(--tl-bg);touch-action:none;max-height:56vh;position:relative;box-shadow:inset 0 2px 18px rgba(0,0,0,.4)}
.studio-scroll canvas{display:block}
.studio-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;flex-wrap:wrap;
  padding:12px 16px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(10px)}
.time-label{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--muted);min-width:138px;text-align:center}
.time-label b{color:var(--text)}
.play-btn{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#38bdf8,#3b82f6 60%,#6366f1);
  box-shadow:0 0 0 5px rgba(56,189,248,.14),0 10px 26px rgba(56,189,248,.4),inset 0 1px 0 rgba(255,255,255,.4);transition:.15s}
.play-btn:hover{filter:brightness(1.08);box-shadow:0 0 0 7px rgba(56,189,248,.18),0 14px 32px rgba(56,189,248,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.play-btn:active{transform:scale(.94)}
.play-btn svg{width:26px;height:26px;color:#fff}
.studio-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tool-btn{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:76px;padding:11px 10px;border-radius:14px;
  background:rgba(148,163,255,.06);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;transition:.15s;position:relative}
.tool-btn svg{width:20px;height:20px;stroke-width:2.4}
.tool-btn:hover:not(.off){color:var(--text);background:rgba(148,163,255,.12);border-color:var(--line2);transform:translateY(-2px)}
.tool-btn:active{transform:scale(.96)}
.tool-btn.off{opacity:.4}
.tool-btn .tb-v{font-size:9.5px;font-weight:800;letter-spacing:.3px;color:#67e8f9;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);padding:1px 7px;border-radius:99px;line-height:1.5;white-space:nowrap}
.tool-btn:disabled{opacity:.35;cursor:not-allowed}
.tool-btn.on{color:#7dd3fc;border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.1);box-shadow:0 0 14px rgba(34,211,238,.2)}
.empty-studio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:64px 20px;text-align:center;color:var(--muted)}
.empty-studio svg{width:54px;height:54px;color:var(--cyan);opacity:.85;filter:drop-shadow(0 0 16px rgba(34,211,238,.4))}
.empty-studio .es-t{font-weight:800;font-size:17px;color:var(--text)}
.pop{position:fixed;z-index:80;background:#111c44;border:1px solid var(--line2);border-radius:16px;padding:16px;
  box-shadow:0 24px 60px rgba(2,6,24,.6);width:260px;animation:pop .16s ease}
.pop .pop-h{font-weight:800;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop .pop-v{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:800;font-size:13px}

/* ---------- file rows ---------- */
.file-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(148,163,255,.04);transition:.15s}
.file-row:hover{border-color:var(--line2)}
.file-row + .file-row{margin-top:10px}
.file-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:rgba(99,102,241,.15);color:#a5b4fc;border:1px solid rgba(99,102,241,.25)}
.file-ic svg{width:19px;height:19px}
.file-meta{flex:1;min-width:0}
.file-meta .fm-n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta .fm-s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-sq{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none;transition:.13s;border:1px solid transparent}
.icon-sq:hover{background:rgba(148,163,255,.1);color:var(--text);border-color:var(--line)}
.icon-sq.danger:hover{background:rgba(244,63,94,.15);color:#fda4af;border-color:rgba(244,63,94,.3)}
.icon-sq:active{transform:scale(.9)}
.icon-sq:disabled{opacity:.25;cursor:not-allowed}
.icon-sq svg{width:17px;height:17px}

/* ---------- outputs ---------- */
.out-row{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(148,163,255,.04);flex-wrap:wrap;transition:.15s}
.out-row:hover{border-color:var(--line2);background:rgba(148,163,255,.07)}
.out-row + .out-row{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.fx-row{display:flex;flex-wrap:wrap;gap:8px}
.rec-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px}
.rec-ring{width:122px;height:122px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:rgba(148,163,255,.05);transition:transform .15s}
.rec-ring.rec{border-color:rgba(244,63,94,.7);box-shadow:0 0 0 8px rgba(244,63,94,.12),0 0 34px rgba(244,63,94,.4);animation:recPulse 1.4s ease-in-out infinite}
@keyframes recPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.rec-btn{width:86px;height:86px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--indigo),var(--blue));color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(59,130,246,.45),inset 0 1px 0 rgba(255,255,255,.3);transition:.15s}
.rec-btn:hover{filter:brightness(1.08)}
.rec-btn:active{transform:scale(.94)}
.rec-btn svg{width:34px;height:34px}
.rec-ring.rec .rec-btn{background:linear-gradient(135deg,#f43f5e,#e11d48);box-shadow:0 10px 26px rgba(244,63,94,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.rec-lbl{font-size:14px;color:var(--muted);font-weight:600}
.rec-meter{width:100%;max-width:280px;height:8px;border-radius:99px;background:rgba(148,163,255,.12);overflow:hidden}
.rec-meter div{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#3b82f6,#e879f9);transition:width .06s linear}
.rec-time{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;letter-spacing:.06em}
.out-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.25)}
.out-ic.mp3{background:rgba(251,146,60,.12);color:var(--orange);border-color:rgba(251,146,60,.25)}
.out-ic.webm{background:rgba(167,139,250,.12);color:var(--purple);border-color:rgba(167,139,250,.25)}
.out-ic svg{width:20px;height:20px}

/* ---------- how / features / footer ---------- */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.how .step{position:relative;padding:20px;border-radius:18px;border:1px solid var(--line);background:var(--panel);transition:.2s}
.how .step:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 30px rgba(2,6,24,.3)}
.how .step .num{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15px;
  background:linear-gradient(135deg,var(--indigo),var(--blue));margin-bottom:12px;box-shadow:0 6px 14px rgba(59,130,246,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.how .step h3{font-size:16px;font-weight:800;margin-bottom:6px}
.how .step p{font-size:13.5px;color:var(--muted);line-height:1.5}
.features{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.feature{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--muted);
  padding:10px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(148,163,255,.04);transition:.15s}
.feature:hover{border-color:var(--line2);color:var(--text)}
.feature svg{width:17px;height:17px;color:var(--green);flex:none}
footer{border-top:1px solid var(--line);margin-top:54px;padding:22px 0 8px;color:var(--dim);font-size:13px;text-align:center;line-height:1.6}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,8,24,.7);backdrop-filter:blur(5px);z-index:90;display:grid;place-items:center;padding:20px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(440px,100%);background:#0f1838;border:1px solid var(--line2);border-radius:22px;padding:26px;box-shadow:0 30px 80px rgba(2,6,24,.7);animation:pop .2s ease}
.modal .m-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(251,191,36,.25),rgba(249,115,22,.25));color:#fcd34d;border:1px solid rgba(251,191,36,.3)}
.modal .m-ic svg{width:24px;height:24px}
.modal h3{font-size:19px;font-weight:800;margin-bottom:8px}
.modal p{color:var(--muted);font-size:14.5px;line-height:1.55;margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);z-index:100;
  background:#101b40;border:1px solid var(--line2);color:var(--text);font-size:14px;font-weight:600;
  padding:12px 18px;border-radius:13px;box-shadow:0 18px 44px rgba(2,6,24,.55),0 0 0 1px rgba(34,211,238,.12);
  opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
.spin{display:inline-block;animation:rot .9s linear infinite;transform-origin:center}
@keyframes rot{to{transform:rotate(360deg)}}
.enc-hud{position:fixed;left:50%;bottom:138px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:10px;
  background:rgba(10,16,38,.94);border:1px solid var(--line2);border-radius:15px;padding:11px 15px;backdrop-filter:blur(10px);
  box-shadow:0 18px 44px rgba(2,6,24,.6);min-width:236px;max-width:92vw}
.enc-hud .enc-ic{display:grid;place-items:center;color:var(--cyan)}
.enc-hud .enc-txt{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enc-hud .enc-track{flex:1;height:6px;border-radius:99px;background:rgba(148,163,255,.15);overflow:hidden;min-width:54px}
.enc-hud .enc-track i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#3b82f6);transition:width .1s linear}

/* ---------- theme toggle ---------- */
.theme-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:rgba(148,163,255,.08);border:1px solid var(--line2);color:var(--muted);cursor:pointer;transition:.15s}
.theme-btn:hover{color:var(--text);background:rgba(148,163,255,.16);transform:rotate(15deg)}
.theme-btn svg{width:19px;height:19px}

/* ---------- FX rack (effects chain) ---------- */
.fx-eff{border:1px solid var(--line);border-radius:15px;background:rgba(148,163,255,.03);overflow:hidden;margin-top:10px;transition:.15s}
.fx-eff:hover{border-color:var(--line2)}
.fx-eff-h{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.fx-eff-h:active{background:rgba(148,163,255,.05)}
.fx-eff-h .fx-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:rgba(148,163,255,.09);color:var(--muted);transition:.15s}
.fx-eff-h .fx-ic svg{width:17px;height:17px}
.fx-eff.on .fx-ic{background:linear-gradient(135deg,rgba(99,102,241,.35),rgba(59,130,246,.35));color:var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.2)}
.fx-eff-h .fx-nm{font-weight:800;font-size:14px;flex:1}
.fx-eff-h .fx-st{font-size:11px;font-weight:700;color:var(--dim)}
.fx-eff.on .fx-st{color:var(--green)}
.fx-sw{position:relative;width:40px;height:23px;border-radius:99px;background:rgba(148,163,255,.15);flex:none;transition:.18s}
.fx-sw i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#8f9cc6;transition:.18s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.fx-eff.on .fx-sw{background:linear-gradient(90deg,var(--indigo),var(--blue))}
.fx-eff.on .fx-sw i{left:20px;background:#fff}
.fx-eff-b{display:none;padding:2px 13px 14px;border-top:1px solid var(--line)}
.fx-eff.open .fx-eff-b{display:block}
.fx-params{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:6px}
@media(max-width:430px){.fx-params{grid-template-columns:1fr}}
.fx-band{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px}
.fx-band .fx-bv{font-size:11.5px;font-weight:800;color:var(--cyan);text-align:right;font-variant-numeric:tabular-nums}
.fx-order{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:18px;font-weight:800;padding:4px 0;user-select:none}
.fx-order button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:rgba(148,163,255,.06);color:var(--muted);cursor:pointer;font-size:13px;transition:.13s}
.fx-order button:hover{color:var(--text);border-color:var(--line2)}
.fx-order button:active{transform:scale(.94)}

/* ---------- visualizer ---------- */
.viz-wrap{border-radius:16px;background:#05081a;border:1px solid var(--line);overflow:hidden;box-shadow:inset 0 2px 14px rgba(0,0,0,.4)}
.viz-wrap canvas{display:block;width:100%}
.viz-meters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.viz-meter{border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:rgba(148,163,255,.03);transition:.15s}
.viz-meter:hover{border-color:var(--line2)}
.viz-meter .vm-l{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.4px}
.viz-meter .vm-v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.viz-meter .vm-v.clip{color:var(--red);text-shadow:0 0 14px rgba(251,113,133,.5)}

/* ---------- batch converter ---------- */
.batch-row{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:13px;background:rgba(148,163,255,.03);margin-top:8px;transition:.15s}
.batch-row:hover{border-color:var(--line2)}
.batch-row .br-st{font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
.batch-row .br-st.done{color:var(--green)}
.batch-row .br-st.work{color:var(--cyan)}
.batch-row .br-bar{flex:1;height:5px;border-radius:99px;background:rgba(148,163,255,.12);overflow:hidden}
.batch-row .br-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#22d3ee,#3b82f6);border-radius:99px;transition:width .15s}
.batch-fmt{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- video preview ---------- */
.av-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9;box-shadow:0 14px 40px rgba(2,6,24,.4)}
.av-wrap canvas{display:block;width:100%;height:100%}
.prog{height:8px;border-radius:99px;background:rgba(148,163,255,.15);overflow:hidden}
.prog > div{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .2s linear}

/* ---------- bottom nav (mobile) ---------- */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:70;
  background:rgba(7,11,30,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  grid-template-columns:repeat(5,1fr);gap:6px}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--dim);padding:7px 4px;border-radius:11px;transition:.15s}
.bnav a svg{width:21px;height:21px}
.bnav a.on{color:var(--cyan);background:rgba(34,211,238,.08)}
@media (max-width:760px){
  .bnav{display:grid}
  main{padding-bottom:120px}
  .tools{grid-template-columns:repeat(2,1fr)}
  .tool{min-height:146px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){html,body{overflow-x:hidden}}
@media(max-width:520px){.track-panel{padding:10px}.track-panel-bottom .track-list{grid-template-columns:1fr}}
/* ============================================================
   TASK 2 — big touch sliders · bigger targets · fully
   responsive (320px -> desktop) · smoother rendering
   ============================================================ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overflow-x:clip}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,.chip,.tool,.drop,.tool-btn,.track-card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{min-height:44px}
.btn.small{min-height:40px}
.back-btn{min-height:42px}
.menu button{min-height:44px}
.menu{width:min(280px,calc(100vw - 16px));min-width:0;max-width:calc(100vw - 16px)}
.theme-btn{width:40px;height:40px}
.inp{min-height:44px;max-width:100%}
select.inp{max-width:100%}

/* ---------- BIG sliders: 14px track / 30px thumb (16/34 on touch) ---------- */
.slider{--fill:50%;-webkit-appearance:none;appearance:none;width:100%;height:38px;border-radius:999px;
  background:transparent;outline:none;cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.slider::-webkit-slider-runnable-track{height:14px;border-radius:999px;border:1px solid rgba(148,163,255,.25);
  background:linear-gradient(90deg,#22d3ee 0%,#3b82f6 var(--fill,50%),rgba(148,163,255,.18) var(--fill,50%),rgba(148,163,255,.18) 100%);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.05)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;margin-top:-7px;border-radius:50%;
  background:linear-gradient(135deg,#a5b4fc,#3b82f6);border:3px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(59,130,246,.6),inset 0 1px 0 rgba(255,255,255,.5);cursor:grab;transition:transform .12s ease}
.slider::-webkit-slider-thumb:hover{transform:scale(1.08)}
.slider::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.02)}
.slider::-moz-range-track{height:14px;border-radius:999px;border:1px solid rgba(148,163,255,.25);background:rgba(148,163,255,.18);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.slider::-moz-range-progress{height:14px;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#3b82f6)}
.slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#a5b4fc,#3b82f6);
  border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(59,130,246,.6);cursor:grab}
.slider:focus-visible{box-shadow:var(--ring)}
.slider:disabled{opacity:.45;cursor:not-allowed}
:root[data-theme="light"] .slider::-webkit-slider-runnable-track{border-color:rgba(30,41,90,.25);
  background:linear-gradient(90deg,#0891b2 0%,#2563eb var(--fill,50%),rgba(30,41,90,.16) var(--fill,50%),rgba(30,41,90,.16) 100%)}
:root[data-theme="light"] .slider::-moz-range-track{border-color:rgba(30,41,90,.25);background:rgba(30,41,90,.16)}
@media(pointer:coarse){
  .slider{height:44px}
  .slider::-webkit-slider-runnable-track{height:16px}
  .slider::-webkit-slider-thumb{width:34px;height:34px;margin-top:-8px}
  .slider::-moz-range-track,.slider::-moz-range-progress{height:16px}
  .slider::-moz-range-thumb{width:28px;height:28px}
  .btn{min-height:46px}.btn.small{min-height:42px}
  .chip{min-height:42px}
  .icon-btn,.theme-btn{width:42px;height:42px}

const canvasDPR=()=>Math.min(window.devicePixelRatio||1,2); /* cap 3x phone canvases: same look, far less GPU work */
function paintRange(el){
  if(!el||el.type!=='range') return;
  const min=parseFloat(el.min||'0'), max=parseFloat(el.max||'100'), v=parseFloat(el.value||'0');
  const p=(isFinite(min)&&isFinite(max)&&max>min&&isFinite(v))?clamp((v-min)/(max-min)*100,0,100):0;
  el.style.setProperty('--fill',p+'%');
}
function paintAllRanges(root){
  const r=root&&root.querySelectorAll?root:document;
  $$('input[type="range"].slider',r).forEach(paintRange);
}
document.addEventListener('input',e=>{ const t=e.target; if(t&&t.matches&&t.matches('input[type="range"]')) paintRange(t); },true);
document.addEventListener('change',e=>{ const t=e.target; if(t&&t.matches&&t.matches('input[type="range"]')) paintRange(t); },true);
/* keep big-thumb slider drags glued to the finger even if it slides off the bar */
document.addEventListener('pointerdown',e=>{
  const el=e.target&&e.target.closest?e.target.closest('input[type="range"].slider'):null;
  if(el&&!el.disabled){ try{ el.setPointerCapture(e.pointerId); }catch(err){} }
},true);
if(document.body&&window.MutationObserver){
  const _rangeObs=new MutationObserver(ms=>{
    for(const m of ms) for(const n of m.addedNodes){
      if(n&&n.nodeType===1){ if(n.matches&&n.matches('input[type="range"].slider')) paintRange(n); paintAllRanges(n); }
    }
  });
  _rangeObs.observe(document.body,{childList:true,subtree:true});
}

/* ================= audio core ================= */
let _ctx=null;
function AC(){ if(!_ctx){ _ctx=new (window.AudioContext||window.webkitAudioContext)(); } return _ctx; }
async function decodeFile(f){ const ab=await f.arrayBuffer(); return await AC().decodeAudioData(ab); }

function toInt16(f32){
  const i16=new Int16Array(f32.length);
  for(let i=0;i<f32.length;i++){ let v=f32[i]; v=v<-1?-1:v>1?1:v; i16[i]=v<0?v*32768:v*32767; }
  return i16;
}
function wavBlob(buf){
  const nc=buf.numberOfChannels, sr=buf.sampleRate, len=buf.length;
  const ba=nc*2, ds=len*ba, ab=new ArrayBuffer(44+ds), dv=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); dv.setUint32(4,36+ds,true); ws(8,'WAVE'); ws(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,nc,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*ba,true); dv.setUint16(32,ba,true); dv.setUint16(34,16,true);
  ws(36,'data'); dv.setUint32(40,ds,true);
  const ch=[]; for(let c=0;c<nc;c++)ch.push(buf.getChannelData(c));
  let o=44;
  for(let i=0;i<len;i++){ for(let c=0;c<nc;c++){ let v=ch[c][i]; v=v<-1?-1:v>1?1:v; dv.setInt16(o,v<0?v*32768:v*32767,true); o+=2; } }
  return new Blob([ab],{type:'audio/wav'});
}
function resampleLinear(buf,targetSR){
  if(buf.sampleRate===targetSR || !buf.length) return buf;
  const nc=buf.numberOfChannels;
  /* output length must scale with the rate ratio or the duration/pitch changes;
     channel count must be preserved (was: forced stereo, mono right channel silent) */
  const outLen=Math.max(1,Math.round(buf.length*targetSR/buf.sampleRate));
  const out=AC().createBuffer(nc,outLen,targetSR);
  for(let c=0;c<nc;c++){
    const d=buf.getChannelData(c), o=out.getChannelData(c);
    const ratio=buf.sampleRate/targetSR;
    for(let i=0;i<o.length;i++){ const t=i*ratio, i0=Math.floor(t), i1=Math.min(d.length-1,i0+1), f=t-i0; o[i]=d[i0]*(1-f)+d[i1]*f; }
  }
  return out;
}

/* time-scale by resampling: doubles as the Speed control (pitch follows, like tape) */
function resampleSpeed(buf,speed){
  const sr=buf.sampleRate, nc=buf.numberOfChannels;
  const outLen=Math.max(1, Math.round(buf.length/Math.max(.01,speed)));
  const out=AC().createBuffer(nc,outLen,sr);
  for(let c=0;c<nc;c++){
    const d=buf.getChannelData(c), o=out.getChannelData(c);
    const r=buf.length/outLen;
    for(let i=0;i<outLen;i++){ const t=i*r, i0=Math.floor(t), i1=Math.min(d.length-1,i0+1), f=t-i0; o[i]=d[i0]*(1-f)+d[i1]*f; }
  }
  return out;
}
/* grain-based pitch shift: moves the pitch by `ratio` and keeps the length.
   Two read heads sweep the source at `ratio` while drifting back one grain; the
   head about to jump is crossfaded out with a raised cosine (no click, no comb). */
function pitchShiftGrain(buf,ratio){
  const sr=buf.sampleRate, nc=buf.numberOfChannels;
  if(!(ratio>0)||Math.abs(ratio-1)<1e-6) return buf;
  const out=AC().createBuffer(nc,buf.length,sr);
  const g=Math.max(64, Math.min(Math.floor(.05*sr), Math.floor(buf.length/4)||64));
  const drift=ratio-1;
  for(let c=0;c<nc;c++){
    const d=buf.getChannelData(c), o=out.getChannelData(c);
    const rd=p=>{ const a=Math.floor(p), f=p-a; const i0=Math.max(0,Math.min(d.length-1,a)), i1=Math.max(0,Math.min(d.length-1,a+1)); return d[i0]*(1-f)+d[i1]*f; };
    for(let i=0;i<o.length;i++){
      const phA=((i*drift)%g+g)%g, phB=((phA+g/2)%g);
      const wA=.5-.5*Math.cos(2*Math.PI*phA/g);
      o[i]=rd(i+phA-g)*wA + rd(i+phB-g)*(1-wA);
    }
  }
  return out;
}
/* ---- lazy MP3 encoder: compiles on first use so initial load stays fast ---- */
let _lameState=0; // 0 unknown · 1 ready · 2 unavailable
function ensureLame(){
  if(window.lamejs&&window.lamejs.Mp3Encoder) return true;
  if(_lameState===2) return false;
  const s=_lameSrc();
  if(!s){ _lameState=2; return false; }
  try{ (0,eval)(s); }catch(e){ console.warn('lame init failed',e); }
  const ok=!!(window.lamejs&&window.lamejs.Mp3Encoder);
  _lameState=ok?1:2;
  return ok;
}
function mp3Blob(buf,kbps=160){
  try{
    if(!ensureLame()) return null;
    const L=window.lamejs;
    let b=buf, sr=buf.sampleRate;
    const ok=[44100,48000,32000,22050,16000,11025,8000].includes(sr);
    if(!ok){ b=resampleLinear(buf,44100); sr=44100; }
    const nc=b.numberOfChannels, len=b.length;
    const enc=new L.Mp3Encoder(nc,sr,Math.min(kbps,320));
    const bs=1152, out=[];
    const Lch=toInt16(b.getChannelData(0));
    const Rch=nc>1?toInt16(b.getChannelData(1)):Lch;
    for(let i=0;i<len;i+=bs){
      const l=Lch.subarray(i,Math.min(len,i+bs));
      const r=Rch.subarray(i,Math.min(len,i+bs));
      const d=nc>1?enc.encodeBuffer(l,r):enc.encodeBuffer(l);
      if(d.length)out.push(d);
    }
    const e=enc.flush(); if(e.length)out.push(e);
    return new Blob(out,{type:'audio/mpeg'});
  }catch(err){ console.warn('mp3 encode failed',err); return null; }
}
function sliceBuf(buf,a,b){
  const sr=buf.sampleRate;
  /* clamp the start into the file: a start past the end used to ask for a
     negative length and throw */
  const i0=Math.min(buf.length-1, Math.max(0, Math.floor(a*sr)));
  const n=Math.max(1, Math.min(buf.length-i0, Math.max(1, Math.ceil(Math.max(0,b-a)*sr))));
  const out=AC().createBuffer(buf.numberOfChannels,n,sr);
  for(let c=0;c<buf.numberOfChannels;c++) out.getChannelData(c).set(buf.getChannelData(c).subarray(i0,i0+n));
  return out;
}
/* ---- encoding progress HUD ---- */
function encHud(on,p=0,label){
  let el=$('#encHud');
  if(!on){ if(el) el.remove(); return; }
  if(!el){
    el=document.createElement('div'); el.id='encHud'; el.className='enc-hud';
    el.innerHTML=`<span class="enc-ic">${IC.spinner}</span><span class="enc-txt"></span><div class="enc-track"><i></i></div>`;
    document.body.appendChild(el);
    el.querySelector('.enc-ic svg').classList.add('spin');
  }
  el.querySelector('.enc-txt').textContent=label||'Encoding MP3…';
  el.querySelector('.enc-track i').style.width=Math.round(p*100)+'%';
}

/* ---- Web-Worker MP3 encoder (UI never freezes) ---- */
let _mp3w=null,_mp3wDead=false;
function _lameSrc(){
  const el=document.getElementById('lamejs-src');
  if(el&&el.textContent&&el.textContent.indexOf('Mp3Encoder')>-1) return el.textContent;
  for(const s of document.scripts){ const t=s.textContent; if(t&&t.length>20000&&t.indexOf('Mp3Encoder')>-1&&t.indexOf('lamejs-src')<0) return t; }
  return null;
}
const _MP3_WORKER_CODE='\n;('+function(){
  self.onmessage=function(e){
    var d=e.data,L=self.lamejs,bs=1152;
    var enc=new L.Mp3Encoder(d.nc,d.sr,d.kbps);
    var out=[],i=0,len=d.L.length;
    function step(){
      var guard=0;
      while(i<len&&guard<120){
        var end=Math.min(len,i+bs);
        var l=d.L.subarray(i,end);
        var m=d.nc>1?enc.encodeBuffer(l,d.R.subarray(i,end)):enc.encodeBuffer(l);
        if(m.length)out.push(m);
        i=end;guard++;
      }
      if(i<len){ self.postMessage({t:'p',p:i/len}); setTimeout(step,0); }
      else{
        var f=enc.flush(); if(f.length)out.push(f);
        var total=0,k; for(k=0;k<out.length;k++) total+=out[k].length;
        var u=new Uint8Array(total); var o=0;
        for(k=0;k<out.length;k++){ u.set(out[k],o); o+=out[k].length; }
        self.postMessage({t:'d',u:u},[u.buffer]);
      }
    }
    step();
  };
}.toString()+')();';
function mp3WorkerGet(){
  if(_mp3wDead) return null;
  if(_mp3w) return _mp3w;
  try{
    const src=_lameSrc(); if(!src) return null;
    _mp3w=new Worker(URL.createObjectURL(new Blob([src+_MP3_WORKER_CODE],{type:'text/javascript'})));
    _mp3w.onerror=()=>{ _mp3wDead=true; try{_mp3w.terminate();}catch(e){} _mp3w=null; };
    return _mp3w;
  }catch(e){ _mp3wDead=true; return null; }
}
async function mp3BlobAsync(buf,kbps=160,onProg){
  let b=buf,sr=buf.sampleRate;
  const ok=[44100,48000,32000,22050,16000,11025,8000].includes(sr);
  if(!ok){ b=resampleLinear(buf,44100); sr=44100; }
  const nc=b.numberOfChannels,len=b.length;
  const Lch=toInt16(b.getChannelData(0));
  const Rch=nc>1?toInt16(b.getChannelData(1)):Lch;
  const w=mp3WorkerGet();
  if(w){
    try{
      return await new Promise((resolve,reject)=>{
        let done=false;
        const onmsg=e=>{
          const d=e.data;
          if(d.t==='p'){ if(onProg) onProg(d.p); return; }
          if(d.t==='d'&&!done){ done=true; w.removeEventListener('message',onmsg); w.removeEventListener('error',onerr); if(onProg) onProg(1); resolve(new Blob([d.u],{type:'audio/mpeg'})); }
        };
        const onerr=()=>{ if(!done){ done=true; w.removeEventListener('message',onmsg); w.removeEventListener('error',onerr); reject(new Error('worker encode failed')); } };
        w.addEventListener('message',onmsg); w.addEventListener('error',onerr);
        w.postMessage({L:Lch,R:Rch,nc,sr,kbps:Math.min(kbps,320)});
      });
    }catch(e){ console.warn('worker mp3 failed, falling back',e); }
  }
  /* chunked async fallback — yields to keep UI smooth */
  if(!ensureLame()) return null;
  const L=window.lamejs;
  const enc=new L.Mp3Encoder(nc,sr,Math.min(kbps,320));
  const bs=1152,out=[];
  for(let i=0;i<len;i+=bs){
    const l=Lch.subarray(i,Math.min(len,i+bs));
    const m=nc>1?enc.encodeBuffer(l,Rch.subarray(i,Math.min(len,i+bs))):enc.encodeBuffer(l);
    if(m.length)out.push(m);
    if(((i/bs)|0)%60===59){ if(onProg) onProg(i/len); await sleep(0); }
  }
  const e2=enc.flush(); if(e2.length)out.push(e2);
  if(onProg) onProg(1);
  return new Blob(out,{type:'audio/mpeg'});
}

/* ---- minimal ZIP writer (store method, no compression) ---- */
let _crcT=null;
function crc32(u8){
  if(!_crcT){ _crcT=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; _crcT[n]=c; } }
  let crc=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) crc=_crcT[(crc^u8[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function zipBlob(files){
  const enc=new TextEncoder(), chunks=[], central=[];
  let offset=0;
  const d=new Date();
  const dosD=((d.getUTCFullYear()-1980)<<9)|((d.getUTCMonth()+1)<<5)|d.getUTCDate();
  const dosT=(d.getUTCHours()<<11)|(d.getUTCMinutes()<<5)|(d.getUTCSeconds()>>1);
  for(const f of files){
    const nameB=enc.encode(f.name), crc=crc32(f.data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dosT,true); lh.setUint16(12,dosD,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,f.data.length,true); lh.setUint32(22,f.data.length,true);
    lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer),nameB,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0,true); ch.setUint16(10,0,true);
    ch.setUint16(12,dosT,true); ch.setUint16(14,dosD,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,f.data.length,true); ch.setUint32(24,f.data.length,true);
    ch.setUint16(28,nameB.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true);
    ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nameB);
    offset+=30+nameB.length+f.data.length;
  }
  const csize=central.reduce((s,c)=>s+c.length,0);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(4,0,true); eo.setUint16(6,0,true);
  eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,csize,true); eo.setUint32(16,offset,true); eo.setUint16(20,0,true);
  return new Blob([...chunks,...central,new Uint8Array(eo.buffer)],{type:'application/zip'});
}

/* ================= waveform peaks cache (60fps on long files) ================= */
const _pkCache=new WeakMap();
function peaksFor(d){
  let m=_pkCache.get(d.buffer);
  if(!m){ m=new Map(); _pkCache.set(d.buffer,m); }
  let p=m.get(d.byteOffset);
  if(p) return p;
  const len=d.length;
  const STEP=Math.max(16,Math.ceil(len/200000)); /* ≤200k buckets per channel */
  const nb=Math.ceil(len/STEP);
  const mn=new Float32Array(nb),mx=new Float32Array(nb),ab=new Float32Array(nb);
  for(let b=0;b<nb;b++){
    let lo=1,hi=-1,am=0;
    const i1=Math.min(len,(b+1)*STEP);
    for(let i=b*STEP;i<i1;i++){ const v=d[i]; if(v<lo)lo=v; if(v>hi)hi=v; const a=v<0?-v:v; if(a>am)am=a; }
    mn[b]=lo;mx[b]=hi;ab[b]=am;
  }
  /* Segment tree makes clip-clipping checks O(log n) instead of scanning the entire clip on every frame. */
  let treeSize=1; while(treeSize<nb) treeSize<<=1;
  const abTree=new Float32Array(treeSize*2);
  abTree.set(ab,treeSize);
  for(let i=treeSize-1;i>0;i--) abTree[i]=Math.max(abTree[i*2],abTree[i*2+1]);
  p={mn,mx,ab,step:STEP,count:nb,treeSize,abTree};
  m.set(d.byteOffset,p);
  return p;
}
function peakRangeMax(pk,start,end){
  let a=clamp(start|0,0,pk.count)+pk.treeSize;
  let b=clamp(end|0,0,pk.count)+pk.treeSize, max=0;
  while(a<b){
    if(a&1) max=Math.max(max,pk.abTree[a++]);
    if(b&1) max=Math.max(max,pk.abTree[--b]);
    a>>=1; b>>=1;
  }
  return max;
}

/* ================= waveform drawing ================= */
function drawPeaks(canvas,chData,opt={}){
  const dpr=canvasDPR();
  const w=Math.max(50,canvas.clientWidth||canvas.width), h=Math.max(40,canvas.clientHeight||canvas.height);
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  const g=canvas.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const color=opt.color||'#7d8fd6', midY=h/2;
  const n=chData.length, pk=peaksFor(chData), pkStep=pk.step;
  g.fillStyle=color;
  for(let x=0;x<w;x++){
    let mn=1,mx=-1;
    const i0=Math.floor(x*n/w), i1=Math.min(n,Math.floor((x+1)*n/w));
    if(i1<=i0){ const v=chData[Math.min(n-1,i0)]||0; mn=mx=v; }
    else if(n/w>pkStep){ /* cached bucket pass — O(pixels) */
      const b0=Math.floor(i0/pkStep), b1=Math.max(b0+1,Math.ceil(i1/pkStep));
      for(let b=b0;b<b1;b++){ const lo=pk.mn[b]; if(lo<mn)mn=lo; const hi=pk.mx[b]; if(hi>mx)mx=hi; }
    } else {
      for(let i=i0;i<i1;i++){ const v=chData[i]; if(v<mn)mn=v; if(v>mx)mx=v; }
    }
    g.fillRect(x, midY-mx*midY*.92, 1, Math.max(1,(mx-mn)*midY*.92));
  }
  if(opt.mid){ g.fillStyle='rgba(148,163,255,.14)'; g.fillRect(0,midY,w,1); }
  if(typeof opt.sel0==='number'&&typeof opt.sel1==='number'&&opt.sel1>opt.sel0){
    const x0=opt.sel0*w, x1=opt.sel1*w;
    g.fillStyle='rgba(8,13,36,.74)'; g.fillRect(0,0,x0,h); g.fillRect(x1,0,w-x1,h);
    g.strokeStyle='#38bdf8'; g.lineWidth=2; g.strokeRect(x0+1,1,x1-x0-2,h-2);
    const hw=coarsePointer()?12:10, hh=coarsePointer()?44:36;
    g.fillStyle='#38bdf8';
    rr(g,x0-hw/2,h/2-hh/2,hw,hh,4); g.fill();
    rr(g,x1-hw/2,h/2-hh/2,hw,hh,4); g.fill();
    g.fillStyle='rgba(255,255,255,.9)';
    g.fillRect(x0-.75,h/2-7,1.5,14); g.fillRect(x1-.75,h/2-7,1.5,14);
  }
}

function attachDrop(zone,onFiles,accept){
  const inp=document.createElement('input');

  zone.appendChild(inp);

  inp.addEventListener('change',()=>{ if(inp.files.length) onFiles(Array.from(inp.files)); inp.value=''; });
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove('over');}));
  zone.addEventListener('drop',e=>{ const fs=Array.from(e.dataTransfer.files||[]); if(fs.length) onFiles(fs); });

}

  /* slim color rail only; track names and M/S/lock controls live in the side panel */
  st.tracks.forEach((t,ti)=>{
    const y=RULER+ti*LANE;
    const ac=g.createLinearGradient(0,y,0,y+LANE);
    ac.addColorStop(0,t.color[0]); ac.addColorStop(1,t.color[1]);
    g.fillStyle=ac; g.fillRect(0,y,4,LANE);
  });
  st.tracks.forEach((t,ti)=>{
    const y=RULER+ti*LANE;
    /* clips span the full timeline width; track details stay in the side panel */
    const audible=trackAudible(t);
    let selBox=null;
    g.save(); g.beginPath(); g.rect(MARGIN,y,W-MARGIN,LANE); g.clip();
    t.clips.forEach((c,ci)=>{
      const x=stX(c.start), w=c.len*st.p, cy=y+26, ch=LANE-34;
      if(w<2) return;
      const [c1,c2]=t.color;
      const selected=st.sel&&st.sel.t===ti&&st.sel.c===ci;
      const hovered=st.hover&&st.hover.ti===ti&&st.hover.ci===ci;
      /* visible seam: clips that touch (e.g. right after a split) get a 3px gap
         so the split line is actually visible instead of one solid block */
      const gapL=t.clips.some(o=>o!==c&&Math.abs(o.start+o.len-c.start)<.003)?1.5:0;
      const gapR=t.clips.some(o=>o!==c&&Math.abs(c.start+c.len-o.start)<.003)?1.5:0;
      const bx=x+gapL, bw=Math.max(2,w-gapL-gapR);
      const grd=g.createLinearGradient(0,cy,0,cy+ch);
      grd.addColorStop(0,c1); grd.addColorStop(1,c2);
      g.save();
      if(selected){ g.shadowColor='rgba(129,140,248,.8)'; g.shadowBlur=16; }
      rr(g,bx,cy,bw,ch,8); g.fillStyle=grd;
      g.globalAlpha=selected?1:(audible?(hovered?.95:.85):.32);
      g.fill(); g.globalAlpha=1;
      g.restore();
      /* top sheen */
      const sh=g.createLinearGradient(0,cy,0,cy+ch*.55);
      sh.addColorStop(0,'rgba(255,255,255,.20)'); sh.addColorStop(1,'rgba(255,255,255,0)');
      rr(g,bx,cy,bw,ch,8); g.fillStyle=sh; g.fill();
      /* waveform + clip detection (cached peaks — O(pixels), fast at any zoom) */
      const buf=stBuf(c.bufId);
      let clipped=false;
      if(buf){
        const data=buf.getChannelData(0);
        const sr=buf.sampleRate;
        const i0=Math.floor(c.offset*sr), n=Math.min(Math.floor(c.len*sr),data.length-i0);
        if(n>0&&w>6){
          const pk=peaksFor(data), pkStep=pk.step;
          const rb0=Math.floor(i0/pkStep), rb1=Math.max(rb0+1,Math.ceil((i0+n)/pkStep));
          clipped=peakRangeMax(pk,rb0,rb1)>.999;
          if(!st.lofi){ /* low-fidelity while dragging skips this; only the visible slice is drawn */
            const vx0=Math.max(0,x+2), vx1=Math.min(W-1,x+w-2);
            if(vx1>vx0){
              const ta=Math.max(c.start,(S+vx0-MARGIN-2)/st.p), tb=Math.min(c.start+c.len,(S+vx1-MARGIN-2)/st.p);
              if(tb>ta){
                const cols=Math.max(2,Math.min(2400,Math.floor((tb-ta)*st.p)));
                g.save(); g.beginPath(); g.rect(bx,cy,Math.max(1,bw),ch); g.clip();
                g.strokeStyle=selected?'rgba(255,255,255,.85)':'rgba(255,255,255,.72)'; g.lineWidth=1;
                g.beginPath();
                for(let px=0;px<cols;px++){
                  const tA=ta+(tb-ta)*px/cols, tB=Math.max(tA,ta+(tb-ta)*(px+1)/cols);
                  const a=i0+Math.floor((tA-c.start)*sr), b=Math.max(a+1,i0+Math.floor((tB-c.start)*sr));
                  const cb0=Math.floor(a/pkStep), cb1=Math.max(cb0+1,Math.ceil(b/pkStep));
                  let mn=1,mx=-1;
                  for(let bi=cb0;bi<cb1;bi++){ const lo=pk.mn[bi]; if(lo<mn)mn=lo; const hi=pk.mx[bi]; if(hi>mx)mx=hi; }
                  const xx=x+(tA-c.start)*st.p, yy=cy+2+(ch-4)/2;
                  g.moveTo(xx,yy-mx*(ch-4)/2*.88);
                  g.lineTo(xx,yy-mn*(ch-4)/2*.88);
                }
                g.stroke(); g.restore();
              }
            }
          }
        }
      }
      /* clip name pill */
      if(bw>46){
        g.font='700 10.5px system-ui, sans-serif';
        const label=t.name.length>16?t.name.slice(0,15)+'…':t.name;
        const tw=Math.min(g.measureText(label).width+16,bw-12);
        rr(g,bx+6,cy+5,tw,16,5); g.fillStyle='rgba(8,12,30,.5)'; g.fill();
        g.save(); g.beginPath(); g.rect(bx+12,cy+5,tw-12,16); g.clip();
        g.fillStyle='rgba(255,255,255,.9)'; g.textBaseline='middle';
        g.fillText(label,bx+14,cy+13.5); g.restore(); g.textBaseline='alphabetic';
      }
      /* muted overlay with hatch */
      if(c.muted){
        g.save(); rr(g,bx,cy,bw,ch,8); g.clip();
        g.fillStyle='rgba(8,12,30,.45)'; g.fillRect(bx,cy,bw,ch);
        g.strokeStyle='rgba(255,255,255,.09)'; g.lineWidth=5; g.beginPath();
        for(let hx=bx-ch;hx<bx+bw+ch;hx+=12){ g.moveTo(hx,cy+ch); g.lineTo(hx+ch,cy); }
        g.stroke(); g.restore();
        g.font='800 9.5px system-ui, sans-serif'; g.fillStyle='rgba(255,255,255,.7)';
        g.fillText('MUTED',bx+8,cy+ch-8);
      }
      if(clipped&&bw>26){
        rr(g,bx+bw-26,cy+6,20,14,7); g.fillStyle='#ef4444'; g.fill();
        g.fillStyle='#fff'; g.font='800 10px system-ui, sans-serif'; g.textBaseline='middle';
        g.fillText('!',bx+bw-16,cy+13.5); g.textBaseline='alphabetic';
      }
      /* hover edge hints */
      if(hovered&&!selected&&bw>12){
        g.fillStyle='rgba(255,255,255,.55)';
        rr(g,bx+1.5,cy+ch/2-12,4,24,2); g.fill();
        rr(g,bx+bw-5.5,cy+ch/2-12,4,24,2); g.fill();
      }
      if(selected){
        g.strokeStyle='#fff'; g.lineWidth=2;
        rr(g,bx+1,cy+1,Math.max(2,bw-2),ch-2,7); g.stroke();
        selBox={bx,bw,cy,ch}; /* handles drawn after the lane, always on top */
      }
    });
    g.restore(); /* end lane clip region */
    if(selBox){
      const sx=selBox.bx, sw=selBox.bw, scy=selBox.cy, sch=selBox.ch;
      const hy=scy+sch/2-18; /* 14x36 handles, centered on each edge */
      g.strokeStyle='#fff'; g.lineWidth=2;
      rr(g,sx+1,scy+1,Math.max(2,sw-2),sch-2,7); g.stroke();
      g.save();
      g.shadowColor='rgba(2,6,24,.55)'; g.shadowBlur=8; g.shadowOffsetY=2;
      g.fillStyle='#fff';
      rr(g,sx-7,hy,14,36,7); g.fill();
      rr(g,sx+sw-7,hy,14,36,7); g.fill();
      g.restore();
      g.strokeStyle='rgba(15,23,42,.5)'; g.lineWidth=1.3; g.beginPath();
      [sx,sx+sw].forEach(cx=>{ [-3,0,3].forEach(dx=>{ g.moveTo(cx+dx,hy+11); g.lineTo(cx+dx,hy+25); }); });
      g.stroke();
    }
  });

  /* ruler */
  const rl=g.createLinearGradient(0,0,0,RULER);
  rl.addColorStop(0,'#131f4d'); rl.addColorStop(1,'#0d1638');
  g.fillStyle=rl; g.fillRect(0,0,W,RULER);
  g.strokeStyle='rgba(148,163,255,.25)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,RULER-.5); g.lineTo(W,RULER-.5); g.stroke();
  g.font='600 10.5px system-ui, sans-serif'; g.textBaseline='alphabetic';
  let ri0=Math.max(0,Math.floor((S-MARGIN)/st.p/minor)-1), ri1=Math.ceil(t1/minor);
  for(let i=ri0;i<=ri1;i++){
    const t=i*minor, x=MARGIN+t*st.p-S, major=(i%5===0);
    g.strokeStyle=major?'rgba(148,163,255,.5)':'rgba(148,163,255,.16)';
    g.beginPath(); g.moveTo(x+.5,RULER-(major?12:5)); g.lineTo(x+.5,RULER); g.stroke();
    if(major){
      g.fillStyle='#8fa0d0';
      const lbl=(t>=60&&t%60===0)?(t/60)+'m':String(Number(t.toFixed(2)))+'s';
      g.fillText(lbl,x+5,15);
    }
  }
  /* playhead with glow + live time chip */
  if(st.tracks.length){
    const px=stX(st.playhead);
    if(px>=-60&&px<=W+60){
      const pg=g.createLinearGradient(0,RULER,0,H);
      pg.addColorStop(0,'#67e8f9'); pg.addColorStop(.5,'#38bdf8'); pg.addColorStop(1,'#818cf8');
      g.save();
      g.shadowColor='rgba(56,189,248,.9)'; g.shadowBlur=10;
      g.strokeStyle=pg; g.lineWidth=3;
      g.beginPath(); g.moveTo(px,RULER); g.lineTo(px,H-4); g.stroke();
      g.restore();
      /* bright center highlight so the exact frame position pops */
      g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=1;
      g.beginPath(); g.moveTo(px,RULER); g.lineTo(px,H-4); g.stroke();
      const lbl=fmtTime(st.playhead);
      g.font='800 11px system-ui, sans-serif';
      const cw=Math.max(44,g.measureText(lbl).width+20);
      const cx=clamp(px-cw/2,2,W-cw-2), chy=(RULER-22)/2;
      g.save(); g.shadowColor='rgba(56,189,248,.45)'; g.shadowBlur=10;
      rr(g,cx,chy,cw,22,7); g.fillStyle='#0d1638'; g.fill(); g.restore();
      g.strokeStyle='rgba(103,232,249,.75)'; g.lineWidth=1.2; rr(g,cx,chy,cw,22,7); g.stroke();
      g.fillStyle='#67e8f9'; g.textBaseline='middle';
      g.fillText(lbl,cx+(cw-g.measureText(lbl).width)/2,RULER/2+.5);
      g.textBaseline='alphabetic';
      /* big top triangle handle (9px half-width, 11px tall) + white grip dot */
      g.save(); g.shadowColor='rgba(56,189,248,.7)'; g.shadowBlur=8;
      g.fillStyle='#38bdf8';
      g.beginPath(); g.moveTo(px-9,RULER); g.lineTo(px+9,RULER); g.lineTo(px,RULER+11); g.closePath(); g.fill();
      g.restore();
      g.fillStyle='#fff'; g.beginPath(); g.arc(px,RULER+4,2,0,Math.PI*2); g.fill();
      /* bottom cap dot — playhead position readable at a glance */
      g.save(); g.shadowColor='rgba(56,189,248,.85)'; g.shadowBlur=8;
      g.fillStyle='#38bdf8'; g.beginPath(); g.arc(px,H-7,4,0,Math.PI*2); g.fill(); g.restore();
      g.fillStyle='#fff'; g.beginPath(); g.arc(px,H-7,1.4,0,Math.PI*2); g.fill();
    }
  }
}

let _stFrameRaf=0;
function stFrame(){ if(_stFrameRaf) return; _stFrameRaf=requestAnimationFrame(()=>{ _stFrameRaf=0; stRenderContent(); }); }

  const el=$('#stTime');
  if(el){ const txt=fmtTime(st.playhead)+' / '+fmtTime(stTotal()); if(el._aeTxt!==txt){ el._aeTxt=txt; el.innerHTML=`<b>${fmtTime(st.playhead)}</b> / ${fmtTime(stTotal())}`; } }
  const pb=$('#stPlayBtn'); if(pb&&pb._aePlaying!==st.playing){ pb._aePlaying=st.playing; pb.innerHTML=st.playing?IC.pause:IC.play; }
  const sb=$('#stSnap'); if(sb&&sb._aeSnap!==st.snap){ sb._aeSnap=st.snap; sb.classList.toggle('on',st.snap); }
}

      <div class="track-inspector-meter"><i style="width:${fill}%;background:linear-gradient(90deg,${selected.color[0]},${selected.color[1]})"></i></div>
    </div>`;
  }else{
    inspector='<div class="track-inspector"><div class="track-inspector-title">Select a track</div><div class="track-inspector-meta">Track details and clip info will show here.</div></div>';
  }
  const cards=st.tracks.map((t,ti)=>{

      <span class="track-swatch"></span><div style="min-width:0"><div class="track-card-name">${esc(t.name||`Track ${ti+1}`)}</div><div class="track-card-sub">${t.clips.length} clip${t.clips.length===1?'':'s'} · ${fmtTime(dur)}</div></div>
      <div class="track-card-actions">
        <button class="track-mini-btn mute ${t.muted?'on':''}" data-track-action="mute" data-track="${ti}" aria-label="Mute ${esc(t.name)}" title="Mute">M</button>
        <button class="track-mini-btn solo ${t.solo?'on':''}" data-track-action="solo" data-track="${ti}" aria-label="Solo ${esc(t.name)}" title="Solo">S</button>
