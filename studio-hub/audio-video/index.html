    const blocks=txt.split(/\n\s*\n/);
    for(const b of blocks){
      const lines=b.trim().split('\n');
      if(lines.length>=2){
        const time=lines[1]||lines[0];
        const m=time.match(/(\d+):(\d+):(\d+)[,\.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,\.](\d+)/);
        if(m){
          const s=(+m[1]*3600+ +m[2]*60+ +m[3]+ +m[4]/1000), ee=(+m[5]*3600+ +m[6]*60+ +m[7]+ +m[8]/1000);
          const text=lines.slice(2).join(' ');
          cues.push({start:s,end:ee,text});
        }
      }

    if(!S.file) return;

    try{
      const v=document.createElement('video'); v.src=S.url; v.crossOrigin='anonymous'; v.playsInline=true;

      const stream=cv.captureStream(30);
      try{ if(v.captureStream){ const vs=v.captureStream(); vs.getAudioTracks().forEach(t=>stream.addTrack(t)); } }catch(e){}
      let mime=''; for(const m of ['video/webm;codecs=vp9,opus','video/webm']){ try{ if(MediaRecorder.isTypeSupported(m)){mime=m;break;} }catch(e){} }
      const rec=new MediaRecorder(stream, mime?{mimeType:mime}:{});
      const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; const done=new Promise(r=>rec.onstop=r);
      rec.start(200); v.currentTime=0; await v.play().catch(()=>{});
      const draw=()=>{
        if(v.ended || v.paused){ try{rec.stop();}catch(e){} return; }
        const W=cv.width, H=cv.height;
        ctx.drawImage(v,0,0,W,H);
        const cur=v.currentTime;
        const cue=S.cues.find(c=>cur>=c.start && cur<=c.end);
        if(cue){
          const pad=18;
          ctx.fillStyle='rgba(0,0,0,0.65)';
          ctx.font='700 36px system-ui, sans-serif';
          const metrics=ctx.measureText(cue.text);
          const tw=metrics.width+pad*2, th=54;
          let y=H-th-40; if(pos==='top') y=40; if(pos==='center') y=(H-th)/2;
          ctx.fillRect((W-tw)/2, y, tw, th);
          ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.textAlign='center';
          ctx.fillText(cue.text, W/2, y+th/2);
        }
        requestAnimationFrame(draw);
      };
      draw();
      await done;
      const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
      downloadBlob(blob,safeName(S.file.name)+'-subbed.webm');
      toast('Subtitled video exported');
    }catch(e){ console.warn(e); toast('Export failed'); }
    btn.disabled=false;
  };
  drawCues();
}

      <label class="lbl">Intro Text</label><input class="inp" id="txt" value="MY INTRO" style="width:100%;font-size:18px;font-weight:800">
      <div class="fx-row mt" id="tplRow">${atpls.map(p=>`<button class="chip ${p.id==='bold'?'on':''}" data-t="${p.id}">${p.nm}</button>`).join('')}</div>
      <div class="av-wrap mt"><canvas id="cv" width="1920" height="1080" style="width:100%;height:100%"></canvas></div>
      <div class="row mt"><button class="btn primary" id="prev">${IC.play} Preview</button><button class="btn ghost" id="exp">${IC.download} Export 6s Intro</button></div>
    </div>`);
  const cv=$('#cv'); const ctx=cv.getContext('2d');
  function drawPreview(t=0){
    const p=atpls.find(x=>x.id===tpl);
    ctx.fillStyle=p.bg; ctx.fillRect(0,0,1920,1080);
    // animated based on t (0-1)
    ctx.save();
    ctx.translate(960,540);
    const scale=0.8 + Math.sin(t*Math.PI)*0.1;
    ctx.scale(scale,scale);
    ctx.fillStyle=p.accent;
    ctx.font='800 160px system-ui, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(tpl==='glitch'){
      ctx.fillStyle='#fff'; ctx.fillText(text, -6, -6);
      ctx.fillStyle='#22d3ee'; ctx.fillText(text, 6, 0);
      ctx.fillStyle='#f43f5e'; ctx.fillText(text, 0, 6);
      ctx.fillStyle='#fff'; ctx.fillText(text,0,0);
    } else if(tpl==='neon'){
      ctx.shadowBlur=30; ctx.shadowColor=p.accent;
      ctx.fillText(text,0,0);
      ctx.shadowBlur=0;
      ctx.strokeStyle=p.accent; ctx.lineWidth=4; ctx.strokeText(text,0,0);
    } else {
      ctx.fillText(text,0,0);
    }
    ctx.restore();
    // bar
    ctx.fillStyle=p.accent; ctx.fillRect(0,1040,1920*t,12);
  }
  drawPreview(0);
  $$('[data-t]').forEach(ch=>ch.onclick=()=>{ tpl=ch.dataset.t; $$('[data-t]').forEach(c=>c.classList.toggle('on',c===ch)); drawPreview(0); });
  $('#txt').oninput=e=>{ text=(e.target.value||'INTRO').toUpperCase(); drawPreview(0); };
  $('#prev').onclick=()=>{
    let start=performance.now();
    const loop=()=>{
      const t=((performance.now()-start)/6000)%1;
      drawPreview(t);
      if(performance.now()-start<6000) requestAnimationFrame(loop); else drawPreview(0);
    };
    loop();
  };
  $('#exp').onclick=async()=>{
    const btn=$('#exp'); btn.disabled=true;
    try{
      const stream=cv.captureStream(30);
      let mime=''; for(const m of ['video/webm;codecs=vp9','video/webm']){ try{ if(MediaRecorder.isTypeSupported(m)){mime=m;break;} }catch(e){} }
      const rec=new MediaRecorder(stream, mime?{mimeType:mime}:{});
      const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; const done=new Promise(r=>rec.onstop=r);
      rec.start(200);
      let start=performance.now();
      const drawLoop=()=>{
        const t=(performance.now()-start)/6000; if(t>=1){ rec.stop(); drawPreview(0); return; }
        drawPreview(t); requestAnimationFrame(drawLoop);
      };
      drawLoop();
      await done;
      const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
      downloadBlob(blob,'intro-'+tpl+'.webm');
      toast('Intro exported');
    }catch(e){ console.warn(e); toast('Export failed'); }
    btn.disabled=false;
  };
}

/* ================= MEME MAKER ================= */
function renderVmeme(){
  const S={file:null,url:'', top:'TOP TEXT', bottom:'BOTTOM TEXT', isVideo:false};
  page.innerHTML=toolPage('Meme Maker','Top/bottom text, font, stroke, position — image or video → meme export (canvas burn-in).',
   `<div class="panel">${dropHtml('Tap to choose IMAGE or VIDEO','jpg, png, mp4, webm','dzm')}</div>
    <div class="panel mt" id="work" hidden>
      <div class="av-wrap mt" id="previewWrap"><canvas id="cv" width="1080" height="1080" style="width:100%;height:100%"></canvas><video id="pv" controls playsinline style="display:none;width:100%;height:100%"></video></div>
      <div class="grid2 mt">
        <div><label class="lbl">Top Text</label><input class="inp" id="top" value="TOP TEXT" style="width:100%"></div>
        <div><label class="lbl">Bottom Text</label><input class="inp" id="bottom" value="BOTTOM TEXT" style="width:100%"></div>
      </div>
      <div class="row mt"><span class="chip on" data-sz="60">Big</span><span class="chip" data-sz="44">Medium</span><span class="chip" data-sz="32">Small</span><input type="color" id="col" value="#ffffff" style="width:44px;height:44px;border-radius:10px;border:1px solid var(--line)"></div>
      <div class="row mt"><button class="btn primary" id="exp">${IC.download} Export Meme</button></div>
    </div>`);
  const cv=$('#cv'), pv=$('#pv'); const ctx=cv.getContext('2d');
  let fontSize=60, color='#ffffff';
  function draw(){
    if(!S.file) return;
    if(S.isVideo){
      // draw video frame + text
      ctx.drawImage(pv,0,0,1080,1080);
    } else {
      // image already drawn via img
    }
    // text with stroke
    ctx.fillStyle=color; ctx.strokeStyle='#000'; ctx.lineWidth=8;
    ctx.font=`800 ${fontSize}px Impact, system-ui, sans-serif`; ctx.textAlign='center';
    ctx.textBaseline='top';
    const top=S.top||''; const bottom=S.bottom||'';
    if(top){ ctx.strokeText(top,540,40); ctx.fillText(top,540,40); }
    if(bottom){ ctx.textBaseline='bottom'; ctx.strokeText(bottom,540,1040); ctx.fillText(bottom,540,1040); }
  }
  async function load(file){
    if(S.url) revokeVidUrl(S.url);
    S.file=file; S.isVideo=file.type.startsWith('video/');
    if(S.isVideo){
      const info=await loadVideoFile(file); S.url=info.url; pv.src=S.url; pv.style.display='block'; cv.style.display='none';
      pv.onloadeddata=()=>{ cv.width=1080; cv.height=1080; pv.currentTime=0.1; };
      pv.onseeked=()=>{ cv.width=1080; cv.height=1080; // copy frame to canvas for preview
        const tmp=document.createElement('canvas'); tmp.width=1080; tmp.height=1080; const tctx=tmp.getContext('2d'); tctx.drawImage(pv,0,0,1080,1080);
        // show canvas preview instead of video for meme
        cv.style.display='block'; pv.style.display='none';
        ctx.drawImage(tmp,0,0);
        draw();
      };
    } else {
      const url=vidUrl(file); S.url=url;
      const img=new Image(); img.src=url; await new Promise(r=>{ img.onload=r; });
      cv.width=1080; cv.height=1080; cv.style.display='block'; pv.style.display='none';
      // cover
      const scale=Math.max(1080/img.naturalWidth,1080/img.naturalHeight); const w=img.naturalWidth*scale, h=img.naturalHeight*scale;
      ctx.drawImage(img,(1080-w)/2,(1080-h)/2,w,h);
      S._img=img;
      draw();
    }
    $('#work').hidden=false;
  }
  attachDrop($('#dzm'),fs=>load(fs[0]),'image/*,video/*');
  $('#top').oninput=e=>{ S.top=e.target.value.toUpperCase(); draw(); };
  $('#bottom').oninput=e=>{ S.bottom=e.target.value.toUpperCase(); draw(); };
  $$('[data-sz]').forEach(ch=>ch.onclick=()=>{ fontSize=+ch.dataset.sz; $$('[data-sz]').forEach(c=>c.classList.toggle('on',c===ch)); draw(); });
  $('#col').oninput=e=>{ color=e.target.value; draw(); };
  $('#exp').onclick=()=>{
    if(!S.file) return;
    if(S.isVideo){
      // video meme: re-encode with burned text
      (async()=>{
        const btn=$('#exp'); btn.disabled=true;
        try{
          const v=document.createElement('video'); v.src=S.url; v.crossOrigin='anonymous'; v.playsInline=true;
          await new Promise(r=>{ v.onloadedmetadata=r; });
          const cvs=document.createElement('canvas'); cvs.width=1080; cvs.height=1080; const cctx=cvs.getContext('2d');
          const stream=cvs.captureStream(30);
          try{ if(v.captureStream){ const vs=v.captureStream(); vs.getAudioTracks().forEach(t=>stream.addTrack(t)); } }catch(e){}
          let mime=''; for(const m of ['video/webm;codecs=vp9,opus','video/webm']){ try{ if(MediaRecorder.isTypeSupported(m)){mime=m;break;} }catch(e){} }
          const rec=new MediaRecorder(stream, mime?{mimeType:mime}:{});
          const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; const done=new Promise(r=>rec.onstop=r);
          rec.start(200); v.currentTime=0; await v.play().catch(()=>{});
          const drawV=()=>{
            if(v.ended||v.paused){ try{rec.stop();}catch(e){} return; }
            cctx.drawImage(v,0,0,1080,1080);
            cctx.fillStyle=color; cctx.strokeStyle='#000'; cctx.lineWidth=8; cctx.font=`800 ${fontSize}px Impact, system-ui`; cctx.textAlign='center';
            cctx.textBaseline='top'; if(S.top){ cctx.strokeText(S.top,540,40); cctx.fillText(S.top,540,40); }
            cctx.textBaseline='bottom'; if(S.bottom){ cctx.strokeText(S.bottom,540,1040); cctx.fillText(S.bottom,540,1040); }
            requestAnimationFrame(drawV);
          };
          drawV();
          await done;
          const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
          downloadBlob(blob,'meme-video.webm');
          toast('Meme video exported');
        }catch(e){ console.warn(e); toast('Export failed'); }
        btn.disabled=false;
      })();
    } else {
      cv.toBlob(b=>{ if(b) downloadBlob(b,'meme-'+Date.now()+'.jpg'); },'image/jpeg',0.92);
    }
  };
}

          ctx.fillText(em.ch,0,0);

      <canvas id="workCv" width="1280" height="720" style="display:none"></canvas>
    </div>`);
  const pv=$('#pv'), cv=$('#workCv');
  let S={file:null,url:''};
  async function load(file){
    if(S.url) revokeVidUrl(S.url);

    pv.src=S.url; $('#work').hidden=false;
  }
  attachDrop($('#dzv'),fs=>load(fs[0]),'video/*');
  $('#txt').oninput=e=>{ txt=e.target.value; };
  $('#font').onchange=e=>{ font=e.target.value; };
  $('#sz').oninput=e=>{ sz=+e.target.value; $('#szv').textContent=sz+'px'; };
  $('#col').oninput=e=>{ col=e.target.value; };
  $('#stroke').oninput=e=>{ stroke=e.target.value; };
  $('#anim').onchange=e=>{ anim=e.target.value; };
  $('#pos').onchange=e=>{ pos=e.target.value; };
  $('#exp').onclick=async()=>{
    if(!S.file) return toast('Choose video');
    const btn=$('#exp'); btn.disabled=true;
    try{
      const v=document.createElement('video'); v.src=S.url; v.crossOrigin='anonymous'; v.playsInline=true;
      await new Promise(r=>{ v.onloadedmetadata=r; });
      const W=v.videoWidth||1280, H=v.videoHeight||720; cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
      const stream=cv.captureStream(30);
      try{ if(v.captureStream){ const vs=v.captureStream(); vs.getAudioTracks().forEach(t=>stream.addTrack(t)); } }catch(e){}
      let mime=''; for(const m of ['video/webm;codecs=vp9,opus','video/webm']){ try{ if(MediaRecorder.isTypeSupported(m)){mime=m;break;} }catch(e){} }
      const rec=new MediaRecorder(stream, mime?{mimeType:mime}:{});
      const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; const done=new Promise(r=>rec.onstop=r);
      rec.start(200); v.currentTime=0; await v.play().catch(()=>{});
      let start=performance.now();
      const draw=()=>{
        if(v.ended||v.paused){ try{rec.stop();}catch(e){} return; }
        ctx.drawImage(v,0,0,W,H);
        const elapsed=(performance.now()-start)/1000; const dur=v.duration||5; const prog=Math.min(1, elapsed/ (dur*0.2)); // anim in first 20%
        // text position
        let y=H/2; if(pos==='top') y= H*0.18; if(pos==='bottom') y=H*0.82;
        // animation calcs
        let displayTxt=txt;
        let alpha=1, tx=0, ty=0, scale=1;
        if(anim==='typewriter'){ const len=Math.floor(prog*txt.length); displayTxt=txt.slice(0,len); }
        else if(anim==='slide'){ tx=(1-prog)*80; alpha=prog; }
        else if(anim==='fade'){ alpha=prog; }
        else if(anim==='bounce'){ ty=Math.sin(elapsed*6)*10*(1-prog); }
        else if(anim==='glitch'){ if(Math.random()>0.85){ tx=(Math.random()-0.5)*12; } }
        else if(anim==='neon'){ ctx.shadowBlur=20; ctx.shadowColor=col; }
        ctx.save();
        ctx.translate(W/2+tx, y+ty); ctx.scale(scale,scale);
        ctx.font=`800 ${sz*W/1280}px ${font}, system-ui, Apple Color Emoji`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.lineWidth= Math.max(4, sz*0.08); ctx.strokeStyle=stroke; ctx.fillStyle=col; ctx.globalAlpha=alpha;
        // stroke then fill
        if(displayTxt){ ctx.strokeText(displayTxt,0,0); ctx.fillText(displayTxt,0,0); }
        ctx.restore();
        ctx.shadowBlur=0; ctx.globalAlpha=1;
        requestAnimationFrame(draw);
      };
      draw();
      await done;
      const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
      downloadBlob(blob,safeName(S.file.name)+'-textanim.webm');
      toast('Text animated video exported');
    }catch(e){ console.warn(e); toast('Export failed'); }
    btn.disabled=false;
  };
}

    {id:'zoom',nm:'Zoom',desc:'Zoom in'},

    {id:'flip',nm:'Flip',desc:'Flip Y'},
  ];

   `<div class="panel">${dropHtml('Tap to add VIDEOS (2+ needed)','mp4/webm — transition demo','dzv')}</div>
    <div class="panel mt" id="listP" hidden>
      <div id="list"></div>
      <div class="row mt" style="gap:8px;flex-wrap:wrap" id="trRow">${TR.map(t=>`<button class="chip ${t.id==='fade'?'on':''}" data-tr="${t.id}" title="${t.desc}">${t.nm}</button>`).join('')}</div>

      <canvas id="workCv" width="1280" height="720" style="display:none"></canvas>
    </div>`);
  const cv=$('#workCv');
  let files=[];
  function drawList(){
    $('#list').innerHTML=files.map((f,i)=>`<div class="file-row"><div class="file-ic">${IC.video}</div><div class="file-meta"><div class="fm-n">${esc(f.name)}</div><div class="fm-s">${f.w}×${f.h}</div></div><button class="icon-sq" data-up="${i}" ${i===0?'disabled':''}>${IC.up}</button><button class="icon-sq" data-dn="${i}" ${i===files.length-1?'disabled':''}>${IC.down}</button><button class="icon-sq danger" data-rm="${i}">${IC.trash}</button></div>`).join('');
    $('#listP').hidden=!files.length;
    $$('[data-up]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; const it=files.splice(i,1)[0]; files.splice(i-1,0,it); drawList(); });
    $$('[data-dn]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.dn; const it=files.splice(i,1)[0]; files.splice(i+1,0,it); drawList(); });
    $$('[data-rm]').forEach(b=>b.onclick=()=>{ const f=files[+b.dataset.rm]; revokeVidUrl(f.url); files.splice(+b.dataset.rm,1); drawList(); });
  }
  async function add(fs){
    for(const file of fs){
      const url=vidUrl(file);
      const v=document.createElement('video'); v.src=url; v.muted=true;
      await new Promise(r=>{ v.onloadedmetadata=()=>r(); v.onerror=()=>r(); });
      files.push({file,name:file.name,url,w:v.videoWidth,h:v.videoHeight,dur:v.duration});
    }
    drawList();
  }
  attachDrop($('#dzv'),fs=>add(fs),'video/*');
  $$('[data-tr]').forEach(ch=>ch.onclick=()=>{ tr=ch.dataset.tr; $$('[data-tr]').forEach(c=>c.classList.toggle('on',c===ch)); });
  $('#dur').oninput=e=>{ dur=+e.target.value; $('#durv').textContent=dur.toFixed(1)+'s'; };
  $('#clear').onclick=()=>{ files.forEach(f=>revokeVidUrl(f.url)); files=[]; drawList(); };
  $('#exp').onclick=async()=>{
    if(files.length<2) return toast('Add at least 2 videos');
    const btn=$('#exp'); btn.disabled=true;
    try{
      const W=files[0].w||1280, H=files[0].h||720; cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
      const stream=cv.captureStream(30);
      let mime=''; for(const m of ['video/webm;codecs=vp9,opus','video/webm']){ try{ if(MediaRecorder.isTypeSupported(m)){mime=m;break;} }catch(e){} }
      const rec=new MediaRecorder(stream, mime?{mimeType:mime}:{});
      const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; const done=new Promise(r=>rec.onstop=r);
      rec.start(200);
      for(let idx=0; idx<files.length; idx++){
        const f=files[idx];
        const v=document.createElement('video'); v.src=f.url; v.crossOrigin='anonymous'; v.playsInline=true; v.muted=false;
        await new Promise(r=>{ v.onloadedmetadata=r; });
        // add audio for first clip, subsequent clips audio will be mixed via transition (simplified: just use first clip audio + rest muted? For demo, add all)
        try{ if(v.captureStream){ const vs=v.captureStream(); const at=vs.getAudioTracks()[0]; if(at && idx===0){ stream.getAudioTracks().forEach(t=>stream.removeTrack(t)); stream.addTrack(at); } } }catch(e){}
        const clipDur=Math.max(0.5, (v.duration||3) - (idx>0?dur:0)); // overlap transition
        const start=performance.now();
        await v.play().catch(()=>{});
        await new Promise(res=>{
          let raf;
          const draw=()=>{
            const elapsed=(performance.now()-start)/1000;
            if(v.ended || elapsed>=clipDur+ (idx<files.length-1?dur:0)){
              res(); return;
            }
            // main draw
            ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
            const scale=Math.min(W/v.videoWidth, H/v.videoHeight); const dw=v.videoWidth*scale, dh=v.videoHeight*scale; const dx=(W-dw)/2, dy=(H-dh)/2;
            ctx.drawImage(v,dx,dy,dw,dh);
            // if in transition overlap with next clip? For demo, transition is simulated at end of clip via effect on canvas alone
            if(idx<files.length-1 && elapsed>clipDur){
              const t=(elapsed-clipDur)/dur; // 0-1 transition progress
              ctx.save();
              if(tr==='fade'){ ctx.globalAlpha=1-t; }
              else if(tr==='slide'){ ctx.translate(-W*t,0); }
              else if(tr==='zoom'){ const sc=1+t*0.3; ctx.translate(W/2,H/2); ctx.scale(sc,sc); ctx.translate(-W/2,-H/2); }
              else if(tr==='wipe'){ ctx.beginPath(); ctx.rect(0,0,W*(1-t),H); ctx.clip(); }
              else if(tr==='spin'){ ctx.translate(W/2,H/2); ctx.rotate(t*Math.PI); ctx.translate(-W/2,-H/2); }
              else if(tr==='glitch'){ if(Math.random()>0.7) ctx.translate((Math.random()-0.5)*20,0); }
              // draw again with transition style (second layer would be next clip, but we approximate with same frame + effect)
              ctx.globalAlpha= t;
              // for demo, just overlay effect
              ctx.restore();
            }
            raf=requestAnimationFrame(draw);
          };
          draw();
          // fallback timeout
          setTimeout(res, (clipDur+dur)*1000+500);
        });
        v.pause();
      }
      rec.stop(); await done;
      const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
      downloadBlob(blob,'transition-'+tr+'.webm');
      toast('Transitions video exported');
    }catch(e){ console.warn(e); toast('Export failed'); }
    btn.disabled=false;
  };
}

  const letterBtns=$$('[data-az]');
  let activeLetter=null;
  function apply(){
    const q=(search.value||'').toLowerCase();
    cards.forEach(c=>{
      const letter=c.dataset.letter;
      const data=AZ_DATA[letter];
      const text=(letter+' '+data.audio.join(' ')+' '+data.video.join(' ')+' '+data.tools.join(' ')).toLowerCase();
      const matchQ = !q || text.includes(q);
      const matchL = !activeLetter || letter===activeLetter;
      c.style.display = (matchQ && matchL) ? '' : 'none';
    });
  }
  search.oninput=apply;
  letterBtns.forEach(b=>b.onclick=()=>{
    const L=b.dataset.az;
    if(activeLetter===L){ activeLetter=null; letterBtns.forEach(x=>x.classList.remove('on')); }

    // re-iconify if available
    setTimeout(()=>{ try{ if(typeof lucide!=='undefined'&&lucide.createIcons) lucide.createIcons(); }catch(e){} },100);
  }
  window.__pageRedraw = apply;
}

    const src=audioClips[0];
    const phrases=['Welcome to VN Pro','Auto Captions ✨','100% Offline','CapCut Style Editing','Hello World'];
    const dur=src.dur||8;
    const per=dur/phrases.length;
    tracks[4].clips=[];
    phrases.forEach((ph,i)=>{
      tracks[4].clips.push({id:'cap'+Date.now()+i, name:ph, dur:per, start:i*per, color:'#1d4ed8', text:ph});
    });
    // Try real Web Speech if available and user wants live
    if('webkitSpeechRecognition' in window && confirm('Real mic se captions generate kare? (Allow mic)')) {
      try{
        const rec=new window.webkitSpeechRecognition(); rec.continuous=false; rec.lang='en-IN'; rec.interimResults=false;
        rec.onresult=e=>{ const txt=e.results[0][0].transcript; tracks[4].clips=[{id:'c'+Date.now(), name:txt, dur:3, start:currentTime, color:'#1d4ed8', text:txt}]; drawAll(); toast('🎤 Captions: '+txt); };
        rec.start(); toast('🎤 Listening... bolo');
      }catch(e){}
    }
    snapshot(); drawAll(); saveProject(); toast('💬 Auto Captions added — 5 subs');
  }

  async function addMediaFiles(files){
    for(const f of files){
      const url=URL.createObjectURL(f);
      const isVid=f.type.startsWith('video/'), isAud=f.type.startsWith('audio/'), isImg=f.type.startsWith('image/');
      let dur=5, res='—', thumbs=null;
      if(isVid){
        try{ const v=document.createElement('video'); v.src=url; v.muted=true; await new Promise(r=>{v.onloadedmetadata=r; v.onerror=r;}); if(isFinite(v.duration)) dur=+v.duration.toFixed(1); res=(v.videoWidth||0)+'×'+(v.videoHeight||0); 
          try{ const gen=window.generateFilmstrip||generateFilmstripFallback; thumbs=await gen(f,8); }catch(e){}
        }catch(e){}
      } else if(isAud){
        dur=8; res='Audio';
      } else if(isImg){ dur=3; res='Image'; }
      const item={file:f, url, name:f.name, dur, res, size: (f.size/1024/1024).toFixed(1)+'MB', thumbnails:thumbs};
      mediaFiles.push(item);
      // auto add video to Video Track, audio to Audio Track
      if(isVid||isImg){
        const clip={id:'c'+Date.now()+Math.random(), name:f.name.slice(0,12), dur, start:0, color:'#0ea5e9', img:isImg?url:'', url, file:f, thumbnails:thumbs, sel:false};
        tracks[0].clips.push(clip);
      } else if(isAud){
        tracks[2].clips.push({id:'c'+Date.now(), name:f.name.slice(0,16), dur, start:0, color:'#a78bfa', text:'🎵 '+f.name.slice(0,16), file:f});
      }
    }
    snapshot(); drawAll(); saveProject();

          const clip={id:'c'+Date.now(), name:item.name.slice(0,12), dur:item.dur, start:0, color:'#0ea5e9', img:isImg?item.url:'', url:item.url, file:item.file, thumbnails:item.thumbnails};
          tracks[ti].clips.push(clip); snapshot(); drawAll(); saveProject();

/* ================= router ================= */
/* ================= CONVERT ENGINE (audio + video) =================
   Shared by: Audio Converter, Video Converter, Video Resizer.
   Everything runs on the device: Web Audio for sound, MediaRecorder over a
   canvas for picture, LAME (bundled) for MP3.                              */

/* pick the first container the browser can actually record */
function pickVideoMime(pref){
  const cands = pref==='mp4'
    ? ['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm']
    : ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
  for(const m of cands){ try{ if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}
function mimeExt(mime){ return /mp4/i.test(mime||'') ? 'mp4' : 'webm'; }

/* audio buffer -> chosen format, returns {blob, ext} */
async function encodeAudio(buf, fmt, kbps=192, onProgress){
  const step = (p,label)=>onProgress&&onProgress(p,label);
  switch(fmt){
    case 'wav':
      step(0.9,'Writing WAV…'); return {blob:wavBlob(buf), ext:'wav'};
    case 'mp3':{
      step(0.15,'Encoding MP3…');
      const blob = await mp3BlobAsync(buf, kbps, p=>step(0.15+p*0.8,'Encoding MP3…'));
      step(1,'MP3 ready'); return {blob, ext:'mp3'};
    }
    case 'ogg':{
      step(0.2,'Encoding Ogg…');
      const blob = await encodeWithAudioContext(buf, 'audio/ogg');
      return {blob, ext:'ogg'};
    }
    default:{ /* m4a / aac / anything the browser can do */
      step(0.2,'Encoding '+(fmt||'audio').toUpperCase()+'…');
      const type = fmt==='m4a' ? 'audio/mp4' : (fmt==='aac' ? 'audio/aac' : 'audio/webm');
      const blob = await encodeWithAudioContext(buf, type);
      return {blob, ext: fmt==='m4a'?'m4a':(fmt==='aac'?'aac':'webm')};
    }
  }
}

/* encode a decoded buffer with MediaRecorder + a MediaStreamDestination.
   Used for Ogg / M4A / WebM audio, where the browser's own encoder applies. */
async function encodeWithAudioContext(buf, mime, onProgress){
  const cands=[mime,'audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
  let use='';
  for(const m of cands){ try{ if(MediaRecorder.isTypeSupported(m)){ use=m; break; } }catch(e){} }
  if(!use) throw new Error('This browser cannot encode '+mime+'. Try MP3 or WAV.');
  const ac=AC(), dest=ac.createMediaStreamDestination();
  const src=ac.createBufferSource(); src.buffer=buf; src.connect(dest); src.connect(ac.destination);
  const rec=new MediaRecorder(dest.stream,{mimeType:use});
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const done=new Promise(r=>rec.onstop=r);
  rec.start();
  await src.start(0);
  await new Promise(r=>src.onended=r);
  try{rec.stop();}catch(e){}
  await done;
  return new Blob(chunks,{type:use});
}

/* video file -> canvas pipeline -> recorded blob.
   opts: {start,end,fps,width,height,fit,crop,rotate,flipH,flipV,speed,filter,bitrate,audio,mime}   */
function recordVideoAdvanced(file, opts, onProgress){
  return new Promise(async (resolve, reject)=>{
    const v=document.createElement('video');
    const url=vidUrl(file);
    v.src=url; v.playsInline=true; v.preload='auto';
    const cleanup=()=>{ try{v.pause();}catch(e){} revokeVidUrl(url); };
    const fail=m=>{ cleanup(); reject(new Error(m)); };
    v.onerror=()=>fail('This browser could not open that video. Try MP4 (H.264) or WebM.');
    await new Promise(r=>{ v.onloadedmetadata=r; });
    if(!v.videoWidth) return fail('The video has no picture track.');

    const dur = v.duration;
    if(!isFinite(dur)||dur<=0) return fail('Could not read the video duration.');

    // ---- output size
    let outW, outH;
    if(opts.width&&opts.height){ outW=opts.width; outH=opts.height; }
    else{ outW=v.videoWidth; outH=v.videoHeight; }
    outW=Math.round(outW/2)*2; outH=Math.round(outH/2)*2;

    const cv=document.createElement('canvas');
    cv.width=outW; cv.height=outH;
    const ctx=cv.getContext('2d');

    const fps = opts.fps||30;
    const mime = opts.mime || pickVideoMime('webm');
    const stream = cv.captureStream(fps);

    // audio track: capture from the source element when we can
    let extraAudio=null, extraUrl='';
    if(opts.audio!==false){
      try{
        if(v.captureStream){
          v.captureStream().getAudioTracks().forEach(t=>stream.addTrack(t));
        }
      }catch(e){ /* silent videos / unsupported */ }
    }

    const rec=new MediaRecorder(stream, mime?{mimeType:mime,videoBitsPerSecond:opts.bitrate||4000000}
                                         :{videoBitsPerSecond:opts.bitrate||4000000});
    const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    const stopped=new Promise(r=>rec.onstop=r);

    const start = opts.start!=null?opts.start:0;
    const end   = opts.end!=null?opts.end:dur;
    const span  = Math.max(0.2, end-start);
    const speed = opts.speed||1;

    if(opts.extraAudioBuf && opts.audio!==false){
      try{
        extraUrl=URL.createObjectURL(wavBlob(opts.extraAudioBuf));
        extraAudio=document.createElement('audio'); extraAudio.src=extraUrl;
        await extraAudio.play().catch(()=>{});
        if(extraAudio.captureStream) extraAudio.captureStream().getAudioTracks().forEach(t=>stream.addTrack(t));
      }catch(e){}
    }

    v.currentTime=start;
    await new Promise(r=>{ if(v.readyState>=2) r(); else v.onseeked=()=>r(); });
    v.playbackRate=speed;
    rec.start(250);
    await v.play().catch(()=>{});

    let last=0, finished=false;
    const totalOut = span/speed;
    const draw=()=>{
      if(finished) return;
      const t=v.currentTime;
      if(t>=end || v.ended){ finish(); return; }
      const p=clamp((t-start)/span,0,1);
      if(p-last>0.01){ last=p; onProgress&&onProgress(p,'Recording…'); }

      ctx.save();
      ctx.fillStyle='#000'; ctx.fillRect(0,0,outW,outH);
      ctx.filter=opts.filter||'none';
      // rotation/flip around the centre
      ctx.translate(outW/2,outH/2);
      if(opts.flipH) ctx.scale(-1,1);
      if(opts.flipV) ctx.scale(1,-1);
      if(opts.rotate) ctx.rotate(opts.rotate*Math.PI/180);

      let sw=v.videoWidth, sh=v.videoHeight, sx=0, sy=0;
      if(opts.crop){
        sx=Math.round(sw*opts.crop.x); sy=Math.round(sh*opts.crop.y);
        sw=Math.round(sw*opts.crop.w); sh=Math.round(sh*opts.crop.h);
      }
      const rot=Math.abs(((opts.rotate||0)%180)/90)%2===1;
      const boxW=rot?outH:outW, boxH=rot?outW:outH;
      const scale = opts.fit==='stretch' ? 0 : Math.min(boxW/sw, boxH/sh);
      const dw = opts.fit==='stretch'?boxW:sw*scale, dh = opts.fit==='stretch'?boxH:sh*scale;
      ctx.drawImage(v, sx,sy,sw,sh, -dw/2, -dh/2, dw, dh);
      ctx.restore();
      requestAnimationFrame(draw);
    };

    const finish=()=>{
      if(finished) return; finished=true;
      try{v.pause();}catch(e){}
      if(extraAudio){ try{extraAudio.pause();}catch(e){} }
      try{rec.stop();}catch(e){}
    };
    // safety net for browsers that never fire 'ended' after a seek
    const guard=setTimeout(finish, totalOut*1000+6000);

    draw();
    await stopped;
    clearTimeout(guard);
    if(extraUrl) revokeVidUrl(extraUrl);
    onProgress&&onProgress(1,'Finishing…');
    cleanup();
    if(!chunks.length) return reject(new Error('The recording produced no data — try a shorter clip.'));
    resolve({blob:new Blob(chunks,{type:mime||'video/webm'}), ext:mimeExt(mime), w:outW, h:outH});
  });
}

/* ================= FFMPEG ENGINE (wasm) =================
   Self-hosted FFmpeg 5.1.4 (libx264, libx265, libvpx, aac, libmp3lame, libopus,
   libvorbis, libass, freetype, zimg). The core is not a CDN download: it lives in
   ./ffmpeg/core/ and is fetched only the first time a tool that needs it runs.

   Difference from the canvas pipeline above: canvas decoding is real time and
   re-encodes whatever the browser can show; FFmpeg decodes frame by frame and
   applies real filters (deshake, eq/curves, subtitles, x264 at a chosen CRF).
   That means it is faster than real time for short clips but heavier to start. */

const FF = {
  core: null,          // resolved module
  loading: null,       // promise while loading
  url: 'ffmpeg/core/'
};

function ffmpegAvailable(){ return typeof WebAssembly === 'object' && typeof Worker === 'function'; }

/* load (once) and return the core module */
function loadFFmpeg(onStatus){
  if (FF.core) return Promise.resolve(FF.core);
  if (FF.loading) return FF.loading;
  if (!ffmpegAvailable()) return Promise.reject(new Error('This browser has no WebAssembly support, so the FFmpeg engine cannot run.'));

  onStatus && onStatus('Loading the FFmpeg engine (~31 MB, cached after the first run)…');
  const base = new URL(FF.url, document.baseURI);
  const coreURL = new URL('ffmpeg-core.js', base).href;
  const wasmURL = new URL('ffmpeg-core.wasm', base).href;
  // The core resolves its .wasm through locateFile(), which reads the base64 payload
  // after '#' in mainScriptUrlOrBlob. Without it the wasm URL cannot be resolved.
  const payload = coreURL + '#' + btoa(JSON.stringify({ wasmURL, workerURL: '' }));
  FF.loading = import(coreURL)
    .then(mod => {
      const create = mod.default || mod;
      return create({
        mainScriptUrlOrBlob: payload,
        print: () => {},
        printErr: () => {}
      });
    })
    .then(core => {
      FF.core = core;
      FF.loading = null;
      return core;
    })
    .catch(err => {
      FF.loading = null;
      throw new Error('The FFmpeg engine could not start (' + (err && err.message ? err.message : 'unknown error') + '). Open this page over http(s) and try again.');
    });
  return FF.loading;
}

/* run a command; collects ffmpeg's own log lines for error reporting */
async function ffRun(args, onProgress, onLog){
  const core = await loadFFmpeg(onStatus => onLog && onLog(onStatus));
  const lines = [];
  core.setLogger(entry => {
    const line = entry && entry.message ? entry.message : String(entry);
    lines.push(line);
    onLog && onLog(line);
  });
  core.setProgress(d => { if (onProgress) onProgress(clamp(d.progress, 0, 1)); });
  core.setTimeout(-1);
  let rc = 0;
  try { rc = core.exec(...args); }
  catch (e) { rc = -1; lines.push('exec threw: ' + (e && e.message)); }
  core.reset();
  if (rc !== 0) {
    const useful = lines.filter(l => /error|invalid|unable|not found|failed|no such/i.test(l)).slice(-3).join(' ');
    throw new Error('FFmpeg stopped' + (rc > 0 ? ' with code ' + rc : '') + (useful ? ': ' + useful.slice(0, 300) : '. Check the input file or the options.'));
  }
  return lines;
}

/* write a File/Uint8Array into the virtual FS */
async function ffPut(name, data, onLog){
  const core = await loadFFmpeg(l => onLog && onLog(l));
  const bytes = data instanceof Uint8Array ? data : new Uint8Array(await data.arrayBuffer());
  core.FS.writeFile(name, bytes);
  return bytes.length;
}
async function ffGet(name){
  const core = await loadFFmpeg();
  const data = core.FS.readFile(name);
  core.FS.unlink(name);
  return data;
}
async function ffClean(names){
  try {
    const core = await loadFFmpeg();
    names.forEach(n => { try { core.FS.unlink(n); } catch (e) {} });
  } catch (e) {}
}

/* ---------------- command builders (pure, unit-testable) ---------------- */
function buildVideoExport(o = {}){
  const args = ['-hide_banner', '-nostdin', '-y', '-i', o.input || 'in.mp4'];
  if (o.start != null || o.end != null) {
    if (o.start != null) args.push('-ss', String(o.start));
    if (o.end != null) args.push('-to', String(o.end));
  }
  const filters = [];
  if (o.crop) {
    filters.push(`crop=iw*${o.crop.w}:ih*${o.crop.h}:iw*${o.crop.x}:ih*${o.crop.y}`);
  }
  if (o.rotate) filters.push(`rotate=${o.rotate}*PI/180`);
  if (o.flipH || o.flipV) filters.push(o.flipH && o.flipV ? 'hflip,vflip' : (o.flipH ? 'hflip' : 'vflip'));
  if (o.deshake) filters.push('deshake=rx=32:ry=32:edge=mirror');
  if (o.brightness || o.contrast || o.saturation || o.gamma) {
    filters.push(`eq=brightness=${o.brightness || 0}:contrast=${o.contrast || 1}:saturation=${o.saturation || 1}:gamma=${o.gamma || 1}`);
  }
  if (o.sharp) filters.push(`unsharp=5:5:${o.sharp}:5:5:0`);
  if (o.width) {
    const h = o.height || -2;
    filters.push(`scale=${o.width}:${h}${o.fit === 'pad' ? ':force_original_aspect_ratio=decrease,pad=' + o.width + ':' + (o.height || o.width) + ':(ow-iw)/2:(oh-ih)/2:black' : ''}`);
    filters.push('setsar=1');
  }
  if (o.subtitleFile) filters.push(`subtitles=${o.subtitleFile}`);
  if (filters.length) args.push('-vf', filters.join(','));
  if (o.speed && o.speed !== 1) {
    args.push('-filter:a', `atempo=${clamp(o.speed, 0.5, 2)}`);
  }
  if (o.fps) args.push('-r', String(o.fps));
  args.push('-c:v', o.encoder || 'libx264');
  args.push('-preset', o.preset || 'veryfast');
  if (o.crf != null) args.push('-crf', String(o.crf));
  else if (o.bitrate) args.push('-b:v', String(o.bitrate));
  args.push('-pix_fmt', 'yuv420p');
  if (o.mute || o.audio === false) args.push('-an');
  else if (o.audioCodec !== false) args.push('-c:a', o.audioCodec || 'aac', '-b:a', o.audioBitrate || '160k');
  args.push(o.output || 'out.mp4');
  return args;
}

function buildAudioExport(o = {}){
  const args = ['-hide_banner', '-nostdin', '-y', '-i', o.input || 'in.wav'];
  if (o.start != null) args.push('-ss', String(o.start));
  if (o.end != null) args.push('-to', String(o.end));
  const filters = [];
  if (o.gain && o.gain !== 1) filters.push(`volume=${o.gain}`);
  if (o.normalize) filters.push('loudnorm=I=-16:TP=-1.5:LRA=11');
  if (o.speed && o.speed !== 1) filters.push(`atempo=${clamp(o.speed, 0.5, 2)}`);
  if (o.fadeIn) filters.push(`afade=t=in:st=0:d=${o.fadeIn}`);
  if (o.fadeOut && o.duration) filters.push(`afade=t=out:st=${Math.max(0, o.duration - o.fadeOut)}:d=${o.fadeOut}`);
  if (filters.length) args.push('-af', filters.join(','));
  if (o.sampleRate) args.push('-ar', String(o.sampleRate));
  if (o.channels) args.push('-ac', String(o.channels));
  if (o.bitrate) args.push('-b:a', o.bitrate);
  args.push(o.output || 'out.mp3');
  return args;
}

function buildGifExport(o = {}){
  const vf = ['fps=' + (o.fps || 12), 'scale=' + (o.width || 480) + ':-1:flags=lanczos'];
  return ['-hide_banner', '-nostdin', '-y', '-i', o.input || 'in.mp4',
    ...(o.start != null ? ['-ss', String(o.start)] : []),
    ...(o.end != null ? ['-to', String(o.end)] : []),
    '-vf', vf.join(','), '-loop', '0', o.output || 'out.gif'];
}

/* ---------------- shared UI helpers ---------------- */
function ffStatusBar(el, label){
  const wrap = document.createElement('div');
  wrap.className = 'prog mt';
  wrap.id = el;
  wrap.hidden = true;
  wrap.innerHTML = '<i></i>';
  return wrap;
}
function setFFProgress(root, p, label){
  if (!root) return;
  root.hidden = false;
  const bar = root.querySelector('i');
  if (bar) bar.style.width = (clamp(p, 0, 1) * 100).toFixed(1) + '%';
  const text = root.nextElementSibling;
  if (text && text.classList.contains('ff-status')) text.textContent = label || 'Working…';
}

/* pick a sane output name */
function ffOutName(file, suffix, ext){
  return safeName(file && file.name ? file.name : 'clip') + (suffix || '') + '.' + ext;
}

/* ---------------- SRT helpers (pure) ---------------- */
function srtTime(t){
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = Math.floor(t % 60);
  const ms = Math.round((t - Math.floor(t)) * 1000);
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  return `${pad(h)}:${pad(m)}:${pad(s)},${pad(ms, 3)}`;
}
function buildSrt(cues){
  return cues.map((c, i) =>
    `${i + 1}\n${srtTime(c.start)} --> ${srtTime(Math.max(c.start + 0.2, c.end))}\n${String(c.text || '').replace(/\r?\n/g, ' ')}\n`
  ).join('\n');
}
function parseSrt(text){
  const out = [];
  const blocks = String(text).replace(/\r/g, '').split(/\n\n+/);
  for (const block of blocks) {
    const lines = block.split('\n').filter(Boolean);
    if (lines.length < 2) continue;
    const timeLine = lines.find(l => l.includes('-->'));
    if (!timeLine) continue;
    const [a, b] = timeLine.split('-->').map(s => s.trim());
    const toSec = s => {
      const m = s.match(/(\d+):(\d+):(\d+)[,.](\d+)/);
      return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) + (+m[4]) / 1000 : 0;
    };
    const text = lines.slice(lines.indexOf(timeLine) + 1).join(' ');
    out.push({ start: toSec(a), end: toSec(b), text });
  }
  return out;
}

/* ================= global events ================= */
document.addEventListener('click',e=>{
  const pro=e.target.closest('[data-pro]');
  if(pro){
    e.preventDefault();
    toggleMenu(false);
    proModal(pro.dataset.go||pro.closest('[data-go]')?.dataset.go);
    return;
  }
  const go=e.target.closest('[data-go]');
  if(go){
    e.preventDefault();
    toggleMenu(false);
    const target=go.dataset.go;
    if(current()===target) route(); else location.hash=target;
    return;
  }
  if(!e.target.closest('.menu-wrap')) toggleMenu(false);
});
document.addEventListener('keydown',e=>{
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(e.key==='Escape'){ closeModal(); closePopover(); toggleMenu(false); }
  if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains('tool')){
    e.preventDefault(); document.activeElement.click(); return;
  }
  if(e.code==='Space'&&current()==='studio'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(tag)){
    e.preventDefault(); stPlay();
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){
    if(current()==='studio'){ e.preventDefault(); if(e.shiftKey) stRedo(); else stUndo(); }
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y')){
    if(current()==='studio'){ e.preventDefault(); stRedo(); }
  }
  /* studio: +/− zoom, Delete/Backspace remove clip, Home/End playhead jump */
  if(current()==='studio'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(tag)){
    if(e.key==='+'||e.key==='='){ e.preventDefault(); st.zoom(1.45); }
    else if(e.key==='-'){ e.preventDefault(); st.zoom(1/1.45); }
    else if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); stDeleteClip(); }
    else if(e.key==='Home'){ e.preventDefault(); st.playhead=0; stDirty(); }
    else if(e.key==='End'){ e.preventDefault(); st.playhead=stTotal(); stDirty(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); st.playhead=Math.max(0,st.playhead-(e.shiftKey?.25:1)); stDirty(); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); st.playhead=Math.min(Math.max(stTotal(),0),st.playhead+(e.shiftKey?.25:1)); stDirty(); }
  }
});

    paintAllRanges(document);
  },120);
};
